version: 2
# Efficient Dependabot: few grouped PRs, weekly, no major-version surprise bumps.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-patch-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: actions

  - package-ecosystem: pip
    directory: /huggingface/dreamco-router
    schedule:
      interval: monthly
      day: monday
      time: "11:00"
      timezone: America/Chicago
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      pip-router:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
    commit-message:
      prefix: deps
