name: DreamCo 500-Model Benchmark System

# Dedicated single workflow for the complete 500-model benchmark program.
# Other Actions workflows remain reserved for repository/control operations.
# No paid model/API calls are initiated unless an explicitly approved adapter is configured.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick, standard, or maximum'
        required: false
        default: standard
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'tools/**'
      - 'tests/**'
      - 'website/data/**'
      - 'docs/**'
      - '.github/workflows/dreamco-unified-system.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: dreamco-500-model-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  DREAMCO_DISABLE_AUTO_SYNC: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  benchmark-all-500:
    name: Benchmark all catalogued models in one orchestrated run
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install repository dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check openpyxl

      - name: Validate benchmark operating/status contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = [
              'config/buddy-benchmark-performance-contract.json',
              'config/buddy-benchmark-quality-contract.json',
              'config/buddy-benchmark-scorecard.json',
              'config/buddy-benchmark-evidence-ledger.json',
              'config/model-prospectus-benchmark-contract.json',
              'config/buddy-reference-benchmark-execution.json',
              'config/public-dashboard-completeness-contract.json',
              'config/buddy-pages-data-pipeline.json',
              'config/benchmark-status-schema.json',
              'docs/UNIFIED_500_MODEL_BENCHMARK_OPERATING_PLAN.md',
          ]
          for name in required:
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing benchmark contract/plan: {name}')
              if p.suffix == '.json':
                  json.loads(p.read_text())
          print(f'Validated {len(required)} benchmark contracts/plans.')
          PY

      - name: Build/refresh public model catalog
        run: |
          if [ -f tools/build_model_prospectus_catalog.py ]; then
            python3 tools/build_model_prospectus_catalog.py
          elif [ -f tools/build_universal_work_ai_catalog.py ]; then
            python3 tools/build_universal_work_ai_catalog.py
          else
            echo 'No model catalog builder is currently present; existing catalog will be used.'
          fi

      - name: Run the complete 500-model benchmark matrix in this single workflow
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'standard' }}
        run: |
          if [ -f tools/run_500_model_benchmarks.py ]; then
            python3 tools/run_500_model_benchmarks.py --mode "$REQUESTED_MODE"
          elif [ -f tools/run_everything_now.py ]; then
            python3 tools/run_everything_now.py --mode "$REQUESTED_MODE"
          else
            echo 'BLOCKED: no benchmark execution runner is present.'
            exit 2
          fi

      - name: Run benchmark-policy regression tests
        if: always()
        run: |
          python3 -m unittest \
            tests.test_recovery_ontology_workforce_runtime \
            tests.test_universal_capability_benchmark_policy \
            tests.test_global_government_system \
            tests.test_buddy_government_operating_system

      - name: Run repository tests relevant to benchmark infrastructure
        if: always()
        run: |
          python3 -m pytest -q --disable-warnings --maxfail=20

      - name: Validate evidence ledger and 500-model coverage
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = [
              Path('config/generated/model-benchmark-evidence.json'),
              Path('config/generated/buddy-500-model-benchmark.json'),
              Path('config/generated/universal-capability-benchmark.json'),
          ]
          found=next((p for p in candidates if p.exists()), None)
          if found is None:
              raise SystemExit('BLOCKED: no generated benchmark evidence ledger was produced.')
          data=json.loads(found.read_text())
          count=data.get('model_count') or data.get('catalog_model_count') or data.get('count')
          print(f'Evidence source: {found}')
          if count is not None:
              print(f'Model count reported by evidence: {count}')
          if count is not None and int(count) < 500:
              print('WARNING: fewer than 500 models are represented; remaining models are not treated as passed.')

      - name: Validate public/private boundary
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          roots=[Path('website/data'),Path('config/generated')]
          secret=re.compile(r'(?i)(sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)')
          bad=[]
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.json','.js','.txt','.md'} and secret.search(p.read_text(errors='ignore')):
                      bad.append(str(p))
          if bad: raise SystemExit('Potential secret material in public/generated data: '+', '.join(bad))
          print('Public/private boundary passed.')
          PY

      - name: Upload one consolidated benchmark evidence artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dreamco-500-model-benchmark-${{ github.run_id }}
          path: |
            config/generated/*.json
            website/data/*.json
            reports/*.md
          if-no-files-found: warn
          retention-days: 21

      - name: Write Actions summary for Pages/Actions dashboard
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import json
          print('# DreamCo 500-Model Benchmark System')
          print('')
          print('**One workflow owns the entire 500-model benchmark program.**')
          print('')
          for name in ['config/generated/model-benchmark-evidence.json','config/generated/buddy-500-model-benchmark.json','config/generated/universal-capability-benchmark.json']:
              p=Path(name)
              if p.exists():
                  try:
                      d=json.loads(p.read_text())
                      print(f'- Evidence: `{name}`')
                      for k in ('model_count','evaluated_count','blocked_count','failed_count','mastered_count','case_count'):
                          if k in d: print(f'- {k}: **{d[k]}**')
                  except Exception as exc:
                      print(f'- Evidence file exists but could not be summarized: `{name}` ({exc})')
          print('')
          print('Missing, blocked, stale, or unverified models remain visible and are never converted to passes.')
          PY
