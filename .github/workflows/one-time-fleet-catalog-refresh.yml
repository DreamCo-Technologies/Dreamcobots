name: One-time Fleet Catalog Refresh
on:
  push:
    branches: [ops/generate-fleet-catalog-once]
    paths:
      - ".github/workflows/one-time-fleet-catalog-refresh.yml"
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/generate-fleet-catalog-once
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical fleet catalog artifacts
        run: node --import tsx tools/generate_bot_fleet_catalog.ts
      - name: Commit generated fleet catalog artifacts to temporary branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: regenerate canonical fleet catalog"
          git push origin HEAD:refs/heads/ops/generate-fleet-catalog-once
