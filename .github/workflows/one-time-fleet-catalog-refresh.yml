name: One-time Fleet Catalog Refresh
on:
  pull_request:
    branches: [main]
    types: [opened]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical fleet catalog artifacts
        run: node --import tsx tools/generate_bot_fleet_catalog.ts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Synchronize checked-in FreeCodeCamp learning counts
        run: python tools/sync_freecodecamp_learning_inventory.py
      - name: Commit generated artifacts to temporary branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "chore: regenerate canonical fleet and learning artifacts"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
