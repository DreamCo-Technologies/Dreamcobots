name: One-time Fleet Catalog Refresh
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate canonical fleet catalog artifacts
        run: node --import tsx tools/generate_bot_fleet_catalog.ts
      - uses: actions/upload-artifact@v7
        with:
          name: canonical-fleet-catalog-generated
          path: |
            config/master_bot_registry.json
            config/generated/bots.catalog.json
            website/data/bot-fleet-catalog.json
            website/data/buddy-routing-index.js
            website/data/bot-fleet/
            reports/BOT_FLEET_PROSPECTUS.md
          retention-days: 3
