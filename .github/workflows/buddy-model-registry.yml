name: Buddy Model Registry

on:
  pull_request:
    paths:
      - "buddy/modeling/registry.py"
      - "config/buddy-model-registry.json"
      - "config/buddy-tiny-gpt-benchmark-contract.json"
      - "config/buddy-tiny-gpt-synthetic-data-card.json"
      - "tests/test_buddy_model_registry.py"
      - "docs/BUDDY_MODEL_REGISTRY_AND_USER_DEFINED_SIZES.md"
      - "models/buddy-tiny-gpt/README.md"
      - ".github/workflows/buddy-model-registry.yml"
  push:
    branches: [main]
    paths:
      - "buddy/modeling/registry.py"
      - "config/buddy-model-registry.json"
      - "config/buddy-tiny-gpt-benchmark-contract.json"
      - "config/buddy-tiny-gpt-synthetic-data-card.json"
      - "tests/test_buddy_model_registry.py"
      - "docs/BUDDY_MODEL_REGISTRY_AND_USER_DEFINED_SIZES.md"
      - "models/buddy-tiny-gpt/README.md"
      - ".github/workflows/buddy-model-registry.yml"

permissions:
  contents: read

concurrency:
  group: buddy-model-registry-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile registry and validate governed model catalog
        run: |
          python -m py_compile buddy/modeling/registry.py
          python -m unittest tests.test_buddy_model_registry -v
