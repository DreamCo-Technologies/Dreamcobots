name: DreamCo Greenkeeper Orchestrator

on:
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: greenkeeper-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect bounded Keep Green evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/greenkeeper_observations.py --output /tmp/observations.json --max-age-hours 6
      - name: Build repair plan
        run: python3 tools/greenkeeper_orchestrator.py --input /tmp/observations.json
      - name: Publish repair plan
        uses: actions/upload-artifact@v7
        with:
          name: dreamco-greenkeeper-${{ github.run_id }}
          path: artifacts/greenkeeper/repair-plan.json
          if-no-files-found: error
          retention-days: 30
