name: Superbot Migration Ledger

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/superbot-consolidation-v1.json'
      - 'config/generated/superbot-repository-inventory.json'
      - 'config/generated/legacy-bot-recovery-manifest.json'
      - 'tools/compile_superbot_migration.py'
      - 'tools/build_superbot_repository_inventory.py'
      - 'tools/build_division_superbot_manifests.py'
      - 'tools/generate_bot_manifests.py'
      - 'config/bots/bot-manifests.generated.json'
      - 'App_bots/**'
      - 'tests/test_division_superbot_manifests.py'
      - 'shared/division-production-contract.ts'
      - 'config/generated/division-model-manifest.json'
      - 'config/division-model-training-policy.json'
  push:
    branches: [main, 'codex/superbot-consolidation']
    paths:
      - 'config/superbot-consolidation-v1.json'
      - 'config/generated/superbot-repository-inventory.json'
      - 'config/generated/legacy-bot-recovery-manifest.json'
      - 'tools/compile_superbot_migration.py'
      - 'tools/build_division_superbot_manifests.py'
      - 'tools/generate_bot_manifests.py'
      - 'config/bots/bot-manifests.generated.json'
      - 'App_bots/**'
      - 'tests/test_division_superbot_manifests.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build legacy recovery evidence
        run: python tools/recover_legacy_bots.py
      - name: Build whole-repository inventory
        run: python tools/build_superbot_repository_inventory.py
      - name: Generate current bot routing manifests
        run: |
          python tools/generate_bot_manifests.py
          python tools/generate_bot_manifests.py --check
      - name: Build source-backed Division Superbot manifests
        run: |
          python tools/build_division_superbot_manifests.py
          python tools/build_division_superbot_manifests.py --check
          python -m unittest tests.test_division_superbot_manifests -v
      - name: Compile migration ledger
        run: python tools/compile_superbot_migration.py
      - name: Validate migration ledger
        run: |
          python -m json.tool config/generated/superbot-migration-ledger.json >/dev/null
          test -s reports/SUPERBOT_MIGRATION_LEDGER.md
      - name: Upload migration evidence
        uses: actions/upload-artifact@v7
        with:
          name: superbot-migration-ledger
          path: |
            config/generated/superbot-migration-ledger.json
            reports/SUPERBOT_MIGRATION_LEDGER.md
            config/generated/legacy-bot-recovery-manifest.json
            reports/LEGACY_BOT_RECOVERY.md
            config/divisions/
      - name: Open generated Division Superbot manifest review PR
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/division-superbot-manifests
          delete-branch: false
          add-paths: |
            config/divisions/**
          commit-message: "chore: refresh source-backed Division Superbot manifests"
          title: "chore: refresh source-backed Division Superbot manifests"
          body: |
            Generated from canonical bot profiles, owner-routing metadata, and repository inventory.
            Canonical capabilities and proposed-owner candidates are kept separate.
            Tools/connectors/benchmarks are not marked connected, tested, or measured without evidence.
            Review all provenance and gap records before merging.
