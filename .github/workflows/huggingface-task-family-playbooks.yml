name: Hugging Face Task Family Playbooks
on:
  pull_request:
    paths:
      - "config/huggingface-task-taxonomy.json"
      - "config/buddy-huggingface-task-family-playbooks.json"
      - "tools/validate_buddy_huggingface_task_family_playbooks.py"
      - "tests/test_buddy_huggingface_task_family_playbooks.py"
      - ".github/workflows/huggingface-task-family-playbooks.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hf-task-family-playbooks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_buddy_huggingface_task_family_playbooks.py
      - run: python tools/validate_buddy_huggingface_task_family_playbooks.py
