name: Frontier Claim Trust Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "website/**"
      - "evidence/frontier/**"
      - "config/buddy-frontier-claim-disclosure.json"
      - "config/buddy-frontier-readiness-gates.json"
      - "config/buddy-training-data-provenance-policy.json"
      - "config/buddy/500-model-operating-contract.json"
      - "config/generated/sandbox-24h-tick.json"
      - "reports/SANDBOX_24H.md"
      - "tools/check_frontier_claim_trust_gates.py"
      - "tools/verify_frontier_evidence.py"
      - "tools/run_24h_sandbox_soak.py"
      - "tests/test_frontier_claim_trust_gates.py"
      - ".github/workflows/frontier-claim-trust-gate.yml"
      - ".github/workflows/deploy-buddy-pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "evidence/frontier/**"
      - "config/buddy-frontier-claim-disclosure.json"
      - "config/buddy-frontier-readiness-gates.json"
      - "config/buddy-training-data-provenance-policy.json"
      - "config/buddy/500-model-operating-contract.json"
      - "config/generated/sandbox-24h-tick.json"
      - "reports/SANDBOX_24H.md"
      - "tools/check_frontier_claim_trust_gates.py"
      - "tools/verify_frontier_evidence.py"
      - "tools/run_24h_sandbox_soak.py"
      - "tests/test_frontier_claim_trust_gates.py"
      - ".github/workflows/frontier-claim-trust-gate.yml"
      - ".github/workflows/deploy-buddy-pages.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: frontier-claim-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vanity-and-unit:
    name: Block vanity copy + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore latest successful 24-hour sandbox evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow buddy-24h-sandbox-soak.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful 24-hour sandbox soak artifact is available."
            exit 1
          fi
          mkdir -p previous-soak
          gh run download "$run_id" --pattern 'buddy-24h-soak-*' --dir previous-soak
          tick="$(find previous-soak -type f -name sandbox-24h-tick.json -print -quit)"
          history="$(find previous-soak -type f -name sandbox-24h-history.json -print -quit)"
          report="$(find previous-soak -type f -name SANDBOX_24H.md -print -quit)"
          test -n "$tick" && test -n "$history" && test -n "$report"
          mkdir -p config/generated reports
          cp "$tick" config/generated/sandbox-24h-tick.json
          cp "$history" config/generated/sandbox-24h-history.json
          cp "$report" reports/SANDBOX_24H.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path("config/generated/sandbox-24h-history.json").read_text())
          summary = history.get("summary", {})
          if not summary.get("complete"):
              raise SystemExit(
                  "24-hour sandbox evidence is still collecting: "
                  f"{summary.get('successful_ticks', 0)} successful ticks, "
                  f"{summary.get('elapsed_hours', 0)} elapsed hours."
              )
          print("Verified rolling 24-hour sandbox evidence:", summary)
          PY
      - name: Deploy-mode trust check (fail on vanity while gates red)
        run: python3 tools/check_frontier_claim_trust_gates.py --output reports/frontier-claim-trust-deploy.json
      - name: Unit tests
        run: python3 -m unittest tests.test_frontier_claim_trust_gates
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontier-claim-trust-deploy-${{ github.run_id }}
          path: reports/frontier-claim-trust-deploy.json
          if-no-files-found: warn

  claim-surfaces-all-gates:
    name: Claim readiness report (certification remains evidence-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Restore latest successful 24-hour sandbox evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow buddy-24h-sandbox-soak.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful 24-hour sandbox soak artifact is available."
            exit 1
          fi
          mkdir -p previous-soak
          gh run download "$run_id" --pattern 'buddy-24h-soak-*' --dir previous-soak
          tick="$(find previous-soak -type f -name sandbox-24h-tick.json -print -quit)"
          history="$(find previous-soak -type f -name sandbox-24h-history.json -print -quit)"
          report="$(find previous-soak -type f -name SANDBOX_24H.md -print -quit)"
          test -n "$tick" && test -n "$history" && test -n "$report"
          mkdir -p config/generated reports
          cp "$tick" config/generated/sandbox-24h-tick.json
          cp "$history" config/generated/sandbox-24h-history.json
          cp "$report" reports/SANDBOX_24H.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path("config/generated/sandbox-24h-history.json").read_text())
          summary = history.get("summary", {})
          if not summary.get("complete"):
              raise SystemExit(
                  "24-hour sandbox evidence is still collecting: "
                  f"{summary.get('successful_ticks', 0)} successful ticks, "
                  f"{summary.get('elapsed_hours', 0)} elapsed hours."
              )
          print("Verified rolling 24-hour sandbox evidence:", summary)
          PY
      - name: Evaluate strict claim readiness without fabricating certification
        shell: bash
        run: |
          set +e
          python3 tools/check_frontier_claim_trust_gates.py --require-all-gates --output reports/frontier-claim-trust-strict.json
          strict_status=$?
          set -e
          if [ "$strict_status" -eq 0 ]; then
            echo "All claim certification gates are green."
          elif [ "$strict_status" -eq 2 ]; then
            # CI may pass with certification pending only when every foundational
            # trust gate is valid and the sole remaining issue is independent proof.
            python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("reports/frontier-claim-trust-strict.json").read_text())
          gates = result.get("gates", {})
          foundations = ("provenance", "allowlist", "sandbox_soak", "disclosure_config")
          expected_errors = {
              "claim assessment: missing Buddy subject",
              "claim assessment: missing named frontier reference subject",
              "claim assessment: no independent Buddy learning demonstration: baseline failure + native candidate + passing holdout/safety/regression are required",
              "frontier claim not claimable: claimable=False status='incomplete_or_unproven'",
          }
          if any(gates.get(name) is not True for name in foundations):
              raise SystemExit("Foundational trust gate failed; refusing to pass CI.")
          if gates.get("claimable") is not False or result.get("claimable") is not False:
              raise SystemExit("Unexpected claimability state; refusing to pass CI.")
          if set(result.get("errors", [])) != expected_errors:
              raise SystemExit("Unexpected trust-gate errors; manual review required.")
          print("CI check passed: foundational trust gates are valid; frontier certification remains NOT CLAIMABLE until independent Buddy evidence is supplied.")
          PY
          else
            echo "::error::Strict trust check failed unexpectedly with exit code $strict_status"
            exit "$strict_status"
          fi
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontier-claim-trust-strict-${{ github.run_id }}
          path: reports/frontier-claim-trust-strict.json
          if-no-files-found: warn
