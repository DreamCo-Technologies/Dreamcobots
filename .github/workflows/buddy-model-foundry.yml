name: Buddy Model Foundry
on:
  pull_request:
    paths:
      - "buddy/learning/model_foundry.py"
      - "tools/build_division_training_matrix.py"
      - "config/authorized-training-datasets/manifest.json"
      - "config/masterbot-65-registry.json"
      - "tests/test_model_foundry.py"
      - ".github/workflows/buddy-model-foundry.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buddy-model-foundry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      eligible: ${{ steps.plan.outputs.eligible }}
      blocked: ${{ steps.plan.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build rights-checked 65-division matrix
        id: plan
        run: python tools/build_division_training_matrix.py
      - name: Test rights gate and parallel planner
        run: python -m unittest discover -s tests -p 'test_model_foundry.py' -v
      - name: Upload division training plan
        uses: actions/upload-artifact@v4
        with:
          name: buddy-division-training-plan
          path: config/generated/division-training-plan.json
          retention-days: 90
  train:
    needs: plan
    if: needs.plan.outputs.eligible != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU training runtime
        run: python -m pip install --upgrade pip torch
      - name: Train division model from random initialization
        run: >-
          python tools/train_buddy_division_model.py
          --division-id "${{ matrix.division_id }}"
          --dataset-id "${{ matrix.dataset_id }}"
          --dataset-path "${{ matrix.dataset_path }}"
          --seed "${{ matrix.seed }}"
          --steps 100
          --output "artifacts/division-${{ matrix.division_id }}.pt"
      - name: Upload experimental checkpoint and provenance
        uses: actions/upload-artifact@v4
        with:
          name: buddy-division-${{ matrix.division_id }}-experimental-checkpoint
          path: |
            artifacts/division-${{ matrix.division_id }}.pt
            artifacts/division-${{ matrix.division_id }}.pt.json
          if-no-files-found: error
          retention-days: 90
