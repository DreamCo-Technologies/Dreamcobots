name: Self Working System

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/offline-buddy-repository-engine.json"
      - "config/dreamco-generator-factory.json"
      - "config/universal-api-task-sandbox-program.json"
      - "config/buddy-self-repair-controller.json"
      - "tools/buddy_local_repository.py"
      - "tools/dreamco_generator_factory.py"
      - "tools/build_universal_api_task_sandbox.py"
      - "tools/run_safe_self_repair.py"
      - "tests/test_offline_generator_universal_sandbox.py"
      - "tools/build_fleet_status.py"
      - ".github/workflows/self-working-system.yml"
  schedule:
    - cron: "29 9 * * *"

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: self-working-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Initialize local Buddy workspace before install
        run: python3 tools/buddy_local_repository.py init
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .buddy-local/logs
          npm ci 2>&1 | tee .buddy-local/logs/npm-install.log
      - name: Verify offline engine and universal generator/sandbox contracts
        run: python3 -m unittest tests.test_offline_generator_universal_sandbox
      - name: Build generator registry for every bot
        run: python3 tools/dreamco_generator_factory.py registry
      - name: Run deterministic self-repair and regression checks
        run: python3 tools/run_safe_self_repair.py
      - name: Run local-first health check
        run: python3 tools/buddy_local_repository.py check
      - name: Generate fleet status report
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f tools/build_fleet_status.py ]; then
            python3 tools/build_fleet_status.py
            cat reports/FLEET_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::tools/build_fleet_status.py not present; skipping FLEET_STATUS.md"
          fi
      - name: Save local-equivalent evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-working-system-${{ github.run_id }}
          path: |
            .buddy-local/
            config/generated/dreamco-generator-registry.json
            config/generated/full-potential-sandbox-catalog.json
            config/generated/bot-sandbox-curriculum.json
            config/generated/council-bot-career-paths.json
            reports/FLEET_STATUS.md
          if-no-files-found: warn
          retention-days: 7
