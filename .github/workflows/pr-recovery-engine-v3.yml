name: PR Recovery Engine v3

on:
  workflow_dispatch:
    inputs:
      max_prs:
        description: Maximum open PRs to inspect
        required: false
        default: "100"
      create_replacements:
        description: Create replacement PRs for cleanly replayable PRs
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "53 */6 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inventory open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pr_recovery.py --repo "$GITHUB_REPOSITORY" --limit "${{ inputs.max_prs || '100' }}"

      - name: Replay complete PR commit ranges
        if: ${{ inputs.create_replacements != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          queue = json.loads(Path('pr-recovery-queue.json').read_text())
          report = []
          Path('recovery-output').mkdir(exist_ok=True)
          for pr in queue.get('candidates', []):
              n, title, source = pr['number'], pr['title'], pr.get('source_repo') or queue['repository']
              commits_raw = subprocess.run(['gh','pr','view',str(n),'--repo',queue['repository'],'--json','commits','--jq','.commits[].oid'],capture_output=True,text=True,check=True).stdout.splitlines()
              if not commits_raw:
                  report.append({'pr':n,'status':'blocked','reason':'PR has no commits to replay','source_repo':source}); continue
              branch=f'recovery/pr-{n}'
              subprocess.run(['git','checkout','-B',branch,'main'],check=True)
              fetch=subprocess.run(['git','fetch',f'https://github.com/{source}.git',*commits_raw],capture_output=True,text=True)
              if fetch.returncode != 0:
                  report.append({'pr':n,'status':'blocked','reason':'source commit range unavailable','source_repo':source,'commits':commits_raw}); continue
              failed=False
              for sha in commits_raw:
                  replay=subprocess.run(['git','cherry-pick','--no-edit',sha],capture_output=True,text=True)
                  if replay.returncode != 0:
                      subprocess.run(['git','cherry-pick','--abort'],check=False)
                      report.append({'pr':n,'status':'blocked','reason':'commit-range conflict on current main; no changes discarded','source_repo':source,'failed_commit':sha,'details':(replay.stderr or replay.stdout)[-4000:]})
                      failed=True
                      break
              if failed: continue
              subprocess.run(['git','push','--force-with-lease','origin',branch],check=True)
              existing=json.loads(subprocess.run(['gh','pr','list','--repo',queue['repository'],'--head',branch,'--state','open','--json','number'],capture_output=True,text=True,check=True).stdout or '[]')
              if existing:
                  replacement=existing[0]['number']
              else:
                  body=(f'Recovered from PR #{n}. Source `{source}`. Replayed the complete original commit range onto the current main. No conflicting changes were discarded. Normal CI, review, security, and deployment gates remain required.')
                  replacement=subprocess.run(['gh','pr','create','--repo',queue['repository'],'--base','main','--head',branch,'--title',f'Recovery: PR #{n} — {title}','--body',body],capture_output=True,text=True,check=True).stdout.strip()
              report.append({'pr':n,'status':'replacement_pr','replacement':replacement,'branch':branch,'commits_replayed':len(commits_raw)})
          Path('recovery-output/report-v3.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-recovery-evidence-v3
          path: |
            pr-recovery-queue.json
            recovery-output/report-v3.json
