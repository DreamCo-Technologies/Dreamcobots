name: Buddy Benchmark Program Guides
on:
  pull_request:
    paths:
      - "config/buddy-benchmark-index.json"
      - "config/buddy-benchmark-program-guides.json"
      - "tools/validate_buddy_benchmark_program_guides.py"
      - "tests/test_buddy_benchmark_program_guides.py"
      - ".github/workflows/buddy-benchmark-program-guides.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buddy-benchmark-program-guides-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_buddy_benchmark_program_guides.py
      - run: python tools/validate_buddy_benchmark_program_guides.py
