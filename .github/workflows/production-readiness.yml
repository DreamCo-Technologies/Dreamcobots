name: Production Readiness Evidence

on:
  push:      - "server/index.ts"
      - "server/openaiConfig.ts"

    branches: [main]
    paths:
      - "governance/**"
      - "config/production-readiness-contract.json"
      - "config/full-system-operational-certification.json"
      - "config/runtime-connection-evidence.json"
      - "tools/production_readiness_gate.py"
      - "tools/build_full_system_certification.py"
      - "tests/test_production_readiness_gate.py"
      - "tests/test_full_system_operational_certification.py"
      - ".github/workflows/production-readiness.yml"
      - "tools/build_production_readiness_evidence_manifest.py"
      - "config/production-readiness-evidence-map.json"
      - "tests/test_production_readiness_evidence_manifest.py"
      - "tests/test_production_readiness_workflow.py"
  pull_request:      - "server/index.ts"
      - "server/openaiConfig.ts"

    paths:
      - "governance/**"
      - "config/production-readiness-contract.json"
      - "config/full-system-operational-certification.json"
      - "config/runtime-connection-evidence.json"
      - "tools/production_readiness_gate.py"
      - "tools/build_full_system_certification.py"
      - "tests/test_production_readiness_gate.py"
      - "tests/test_full_system_operational_certification.py"
      - ".github/workflows/production-readiness.yml"
      - "tests/test_production_readiness_workflow.py"
      - "tests/test_production_readiness_evidence_manifest.py"
      - "config/production-readiness-evidence-map.json"
      - "tools/build_production_readiness_evidence_manifest.py"
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-gate:
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test production certification truth rules and workflow safety
        run: python3 -m unittest tests.test_production_readiness_gate tests.test_production_readiness_workflow tests.test_production_readiness_evidence_manifest -v
      - name: Build revision-bound production evidence manifest
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/build_production_readiness_evidence_manifest.py --output "$RUNNER_TEMP/production-readiness-area-evidence.json" --wait-seconds 600
          echo "DREAMCO_PRODUCTION_EVIDENCE_MANIFEST=$RUNNER_TEMP/production-readiness-area-evidence.json" >> "$GITHUB_ENV"
      - name: Run evidence inventory
        run: python3 tools/production_readiness_gate.py | tee production-readiness-report.txt
      - name: Run static site preflight
        run: python3 tools/build_buddy_public_site.py --check
      - name: Run production contract strict gate
        if: github.event_name != 'pull_request'
        run: python3 tools/production_readiness_gate.py --strict
      - name: Fail closed unless production is fully certified
        if: github.event_name != 'pull_request'
        run: npm run production:certification
      - name: Explain report-only pull request result
        if: github.event_name == 'pull_request'
        run: |
          echo "This pull request receives a current, read-only production-readiness inventory."
          echo "Strict production certification remains fail-closed and is not run from a pull request."
          echo "An uploaded report is evidence inventory, not a production-ready certification."
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-readiness-${{ github.sha }}
          path: |
            data/production-readiness-report.json
            reports/PRODUCTION_READINESS_REPORT.md
            production-readiness-report.txt
          if-no-files-found: error
