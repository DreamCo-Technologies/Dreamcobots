permissions:
  contents: read
concurrency:
  group: buddy-bootcamp-curriculum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  weekly-transcript-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test weekly transcript coverage rules
        run: python -m unittest discover -s tests -p 'test_weekly_transcript_evaluation.py' -v
      - name: Build first transcript readiness report
        run: python tools/build_weekly_transcript_evaluation.py --output /tmp/buddy-weekly-transcript-evaluation.json
      - name: Print transcript readiness blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/buddy-weekly-transcript-evaluation.json').read_text())
          print(json.dumps(report, indent=2))
          if report['status'] == 'blocked':
              print('::warning::Buddy transcript evaluation is BLOCKED; see blocked_reasons and due_transcripts in the uploaded artifact. No transcript was counted as evaluated.')
          PY
      - name: Upload first transcript readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-weekly-transcript-evaluation-first-run
          path: /tmp/buddy-weekly-transcript-evaluation.json
          if-no-files-found: warn
          retention-days: 90

  generate-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install freeCodeCamp metadata enumerator
        run: python -m pip install --disable-pip-version-check 'yt-dlp==2026.11.23'
      - name: Validate committed freeCodeCamp catalog before refresh
        run: |
          if [ -f buddy/bootcamp/sources/freecodecamp/catalog.json ]; then
            python tools/sync_freecodecamp_catalog.py --check
          python tools/sync_freecodecamp_learning_inventory.py
          python tools/sync_freecodecamp_learning_inventory.py --check
          else
            echo "No committed catalog yet; first discovery will create it."
          fi
      - name: Discover freeCodeCamp channel videos and categorize
        run: python tools/sync_freecodecamp_catalog.py
      - name: Validate freeCodeCamp catalog and tests
        run: |
          python tools/sync_freecodecamp_catalog.py --check
          # The catalog refresh above can change the lesson inventory. Rebuild
          # its derived policy/path manifests before count-sensitive tests.
          python tools/sync_freecodecamp_learning_inventory.py
          python tools/sync_freecodecamp_learning_inventory.py --check
          python -m unittest discover -s tests -p 'test_freecodecamp_catalog.py' -v
          python -m py_compile tools/catalog_freecodecamp_youtube.py
          python -m unittest discover -s tests -p 'test_freecodecamp_youtube_catalog.py' -v
          python tools/validate_buddy_continuous_study_policy.py
          python -m unittest discover -s tests -p 'test_buddy_continuous_study_policy.py' -v
          python -m unittest discover -s tests -p 'test_buddy_dataset_profile_builder.py' -v
          python -m unittest discover -s tests -p 'test_buddy_dataset_profile_builder_ui.py' -v
          python tools/build_freecodecamp_division_queues.py --out "$RUNNER_TEMP/freecodecamp-division-learning-queues.json"
          python tools/build_freecodecamp_division_queues.py --check --out "$RUNNER_TEMP/freecodecamp-division-learning-queues.json"
          python -m unittest discover -s tests -p 'test_freecodecamp_division_queues.py' -v
          python tools/build_freecodecamp_routes.py --out "$RUNNER_TEMP/freecodecamp-source-routes.json"
          python tools/build_freecodecamp_routes.py --check --out "$RUNNER_TEMP/freecodecamp-source-routes.json"
          python -m unittest discover -s tests -p 'test_freecodecamp_source_routes.py' -v
          python -m unittest discover -s tests -p 'test_study_artifact_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_study_resource_scheduler.py' -v
          python -m unittest discover -s tests -p 'test_permissioned_study_worker.py' -v
          python tools/build_daily_lesson_plan.py --queues "$RUNNER_TEMP/freecodecamp-division-learning-queues.json"
          python -m unittest discover -s tests -p 'test_daily_lesson_plan.py' -v
          python -m unittest discover -s tests -p 'test_original_lesson.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_evidence.py' -v
          python -m unittest discover -s tests -p 'test_weekly_transcript_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_buddy_tolkien_study_track.py' -v
          python -m unittest discover -s tests -p 'test_buddy_tokenizer_training_curriculum.py' -v
          python -m unittest discover -s tests -p 'test_buddy_25m_cpu_llm_course.py' -v
          python -m unittest discover -s tests -p 'test_buddy_course_track_registry.py' -v
          python -m unittest discover -s tests -p 'test_buddy_universal_library_registry.py' -v
          python -m unittest discover -s tests -p 'test_buddy_internal_first_learning_router.py' -v
          python -m unittest discover -s tests -p 'test_buddy_knowledge_router.py' -v
          python -m unittest discover -s tests -p 'test_buddy_onet_task_index.py' -v
          python -m unittest discover -s tests -p 'test_onet_task_curricula.py' -v
          python -m unittest discover -s tests -p 'test_buddy_fleet_internal_bootcamp_routing.py' -v
          python -m unittest discover -s tests -p 'test_fleet_runtime_executor.py' -v
          # Manifest regeneration and drift validation are owned by fleet-runtime-truth.yml.
          python -m unittest discover -s tests -p 'test_buddy_library_registry_discovery.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_inventory.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_specialist_routing.py' -v
          python -m unittest discover -s tests -p 'test_buddy_library_guide_draft.py' -v
          python tools/build_buddy_library_seed_catalog.py --check
          python -m unittest discover -s tests -p 'test_buddy_library_seed_catalog.py' -v
          python -m unittest discover -s tests -p 'test_buddy_universal_library_curriculum.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_inventory.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_specialist_routing.py' -v
          python -m unittest discover -s tests -p 'test_buddy_library_guide_draft.py' -v
          python tools/build_buddy_library_seed_catalog.py --check
          python -m unittest discover -s tests -p 'test_buddy_library_seed_catalog.py' -v
          python tools/build_weekly_transcript_evaluation.py --output /tmp/buddy-weekly-transcript-evaluation.json
      - name: Publish first weekly transcript coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-weekly-transcript-evaluation-first-run
          path: /tmp/buddy-weekly-transcript-evaluation.json
          if-no-files-found: warn
          retention-days: 90
      - name: Build and validate curriculum
        run: |
          python tools/build_buddy_bootcamp_curriculum.py
          python tools/build_buddy_bootcamp_curriculum.py --check
          python -m unittest discover -s tests -p 'test_buddy_bootcamp_curriculum.py' -v
          python -m unittest discover -s tests -p 'test_buddy_bootcamp_workflow_safety.py' -v
          python -m unittest discover -s tests -p 'test_buddy_tolkien_study_track.py' -v
          python -m unittest discover -s tests -p 'test_buddy_tokenizer_training_curriculum.py' -v
          python -m unittest discover -s tests -p 'test_buddy_25m_cpu_llm_course.py' -v
          python -m unittest discover -s tests -p 'test_buddy_course_track_registry.py' -v
          python -m unittest discover -s tests -p 'test_buddy_universal_library_registry.py' -v
          python -m unittest discover -s tests -p 'test_buddy_internal_first_learning_router.py' -v
          python -m unittest discover -s tests -p 'test_buddy_knowledge_router.py' -v
          python -m unittest discover -s tests -p 'test_buddy_onet_task_index.py' -v
          python -m unittest discover -s tests -p 'test_onet_task_curricula.py' -v
          python -m unittest discover -s tests -p 'test_buddy_fleet_internal_bootcamp_routing.py' -v
          python -m unittest discover -s tests -p 'test_fleet_runtime_executor.py' -v
          python tools/generate_bot_manifests.py --check
          python -m unittest discover -s tests -p 'test_buddy_library_registry_discovery.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_inventory.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_specialist_routing.py' -v
          python -m unittest discover -s tests -p 'test_buddy_library_guide_draft.py' -v
          python tools/build_buddy_library_seed_catalog.py --check
          python -m unittest discover -s tests -p 'test_buddy_library_seed_catalog.py' -v
          python -m unittest discover -s tests -p 'test_buddy_universal_library_curriculum.py' -v
          python -m unittest discover -s tests -p 'test_dreamco_bootcamp_seed_data.py' -v
          python -m unittest discover -s tests -p 'test_dreamco_training_factory.py' -v
          python -m unittest discover -s tests -p 'test_dreamco_original_training_examples.py' -v
          python -m py_compile tools/build_dreamco_bootcamp_seed_data.py tools/build_dreamco_training_factory.py tools/build_dreamco_training_examples.py
          python -m unittest tests.test_buddy_dataset_route_check -v
      - name: Upload generated study artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-bootcamp-study-artifacts
          path: |
            buddy/bootcamp/sources/freecodecamp/catalog.json
            ${{ runner.temp }}/freecodecamp-division-learning-queues.json
            ${{ runner.temp }}/freecodecamp-source-routes.json
            config/generated/daily-lesson-production-plan.json
            config/generated/buddy-bootcamp-curriculum.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish manual-review instructions
        if: success() && github.event_name != 'pull_request'
        run: |
          {
            echo "## Buddy Bootcamp curriculum artifact ready"
            echo "- Generated curriculum and study artifacts are available in the workflow artifact."
            echo "- No dataset downloads, training, certification, or model promotion occurred."
            echo "- This workflow is read-only; inspect artifacts and create a human-reviewed PR if generated output should be committed."
          } >> "$GITHUB_STEP_SUMMARY"
