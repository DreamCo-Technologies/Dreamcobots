name: Buddy Bootcamp Curriculum
on:
  pull_request:
    paths:
      - ".github/workflows/buddy-bootcamp-curriculum.yml"
      - "tools/build_buddy_bootcamp_curriculum.py"
      - "tests/test_buddy_bootcamp_curriculum.py"
      - "config/masterbot-65-registry.json"
      - "config/huggingface-task-taxonomy.json"
      - "config/hf-capability-download-map.json"
      - "config/generated/division-huggingface-taxonomy-map.json"
      - "config/buddy-model-serving-policy.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buddy-bootcamp-curriculum.yml"
      - "tools/build_buddy_bootcamp_curriculum.py"
      - "config/masterbot-65-registry.json"
      - "config/huggingface-task-taxonomy.json"
      - "config/hf-capability-download-map.json"
      - "config/generated/division-huggingface-taxonomy-map.json"
      - "config/buddy-model-serving-policy.json"
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: read
concurrency:
  group: buddy-bootcamp-curriculum
  cancel-in-progress: false
jobs:
  generate-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate curriculum
        run: |
          python tools/build_buddy_bootcamp_curriculum.py
          python tools/build_buddy_bootcamp_curriculum.py --check
          python -m unittest discover -s tests -p 'test_buddy_bootcamp_curriculum.py' -v
      - name: Upload generated curriculum evidence
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: buddy-bootcamp-curriculum-${{ github.run_id }}
          path: config/generated/buddy-bootcamp-curriculum.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish manual-review instructions
        if: success() && github.event_name != 'pull_request'
        run: |
          {
            echo "## Buddy Bootcamp curriculum artifact ready"
            echo "- The generated 65-division curriculum is available in the workflow artifact."
            echo "- No dataset downloads, training, certification, or model promotion occurred."
            echo "- This workflow is read-only because repository Actions policy does not permit automated pull-request creation."
            echo "- Review the artifact and create a human-reviewed pull request if the generated file should be committed."
          } >> "$GITHUB_STEP_SUMMARY"
