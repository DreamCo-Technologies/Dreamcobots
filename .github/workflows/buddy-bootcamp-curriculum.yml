name: Buddy Bootcamp Curriculum
on:
  pull_request:
    paths:
      - ".github/workflows/buddy-bootcamp-curriculum.yml"
      - "tools/build_buddy_bootcamp_curriculum.py"
      - "tests/test_buddy_bootcamp_curriculum.py"
      - "config/masterbot-65-registry.json"
      - "config/huggingface-task-taxonomy.json"
      - "config/hf-capability-download-map.json"
      - "config/generated/division-huggingface-taxonomy-map.json"
      - "config/buddy-model-serving-policy.json"
      - "buddy/bootcamp/buddy_bootcamp.yaml"
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "tools/sync_freecodecamp_catalog.py"
      - "tests/test_freecodecamp_catalog.py"
      - "tools/build_freecodecamp_division_queues.py"
      - "tests/test_freecodecamp_division_queues.py"
      - "tools/validate_freecodecamp_learning_evidence.py"
      - "tests/test_freecodecamp_learning_evidence.py"
      - "buddy/bootcamp/sources/freecodecamp/learning-evidence.schema.json"
      - "tools/build_freecodecamp_routes.py"
      - "buddy/learning/freecodecamp_source.py"
      - "tests/test_freecodecamp_source_routes.py"
      - "buddy/learning/study_artifact_cleanup.py"
      - "tests/test_study_artifact_cleanup.py"\n      - "tools/validate_original_lesson.py"\n      - "tests/test_original_lesson.py"\n      - "buddy/bootcamp/sources/original-lesson.schema.json"\n      - "buddy/bootcamp/templates/original-lesson.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/buddy-bootcamp-curriculum.yml"
      - "tools/build_buddy_bootcamp_curriculum.py"
      - "config/masterbot-65-registry.json"
      - "config/huggingface-task-taxonomy.json"
      - "config/hf-capability-download-map.json"
      - "config/generated/division-huggingface-taxonomy-map.json"
      - "config/buddy-model-serving-policy.json"
      - "buddy/bootcamp/buddy_bootcamp.yaml"
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "tools/sync_freecodecamp_catalog.py"
      - "tests/test_freecodecamp_catalog.py"
      - "tools/build_freecodecamp_division_queues.py"
      - "tests/test_freecodecamp_division_queues.py"
      - "tools/validate_freecodecamp_learning_evidence.py"
      - "tests/test_freecodecamp_learning_evidence.py"
      - "buddy/bootcamp/sources/freecodecamp/learning-evidence.schema.json"
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: buddy-bootcamp-curriculum
  cancel-in-progress: false
jobs:
  generate-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install freeCodeCamp metadata enumerator
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Discover freeCodeCamp channel videos and categorize
        run: python tools/sync_freecodecamp_catalog.py
      - name: Validate freeCodeCamp catalog and tests
        run: |
          python tools/sync_freecodecamp_catalog.py --check
          python -m unittest discover -s tests -p 'test_freecodecamp_catalog.py' -v
          python tools/build_freecodecamp_division_queues.py
          python tools/build_freecodecamp_division_queues.py --check
          python -m unittest discover -s tests -p 'test_freecodecamp_division_queues.py' -v
          python tools/build_freecodecamp_routes.py
          python tools/build_freecodecamp_routes.py --check
          python -m unittest discover -s tests -p 'test_freecodecamp_source_routes.py' -v
          python -m unittest discover -s tests -p 'test_study_artifact_cleanup.py' -v\n          python -m unittest discover -s tests -p 'test_original_lesson.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_evidence.py' -v
      - name: Commit discovered catalog back to this pull request branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buddy/bootcamp/sources/freecodecamp/catalog.json config/generated/freecodecamp-division-learning-queues.json config/generated/freecodecamp-source-routes.json
          if git diff --cached --quiet; then
            echo "Catalog is unchanged."
          else
            git commit -m "chore(bootcamp): add discovered freeCodeCamp video catalog"
            git push origin "HEAD:$PR_BRANCH"
          fi
      - name: Build and validate curriculum
        run: |
          python tools/build_buddy_bootcamp_curriculum.py
          python tools/build_buddy_bootcamp_curriculum.py --check
          python -m unittest discover -s tests -p 'test_buddy_bootcamp_curriculum.py' -v
      - name: Propose generated curriculum
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/buddy-bootcamp-curriculum
          delete-branch: false
          add-paths: |
            config/generated/buddy-bootcamp-curriculum.json
            buddy/bootcamp/sources/freecodecamp/catalog.json
            config/generated/freecodecamp-division-learning-queues.json
            config/generated/freecodecamp-source-routes.json
          commit-message: "chore: refresh Buddy Bootcamp curriculum"
          title: "chore: refresh Buddy Bootcamp curriculum"
          body: |
            Generated curriculum from the canonical 65-division registry, HF task taxonomy,
            capability packs, and division discovery map. No datasets are downloaded and
            no training or model promotion is performed.
