name: DreamCo Division Benchmark Evidence Gate
on:
  pull_request:
    paths:
      - "buddy/benchmarks/division_benchmark_contract.py"
      - "tests/test_division_benchmark_contract.py"
      - "docs/DREAMCO_DIVISION_BENCHMARK_EVIDENCE_GATES.md"
      - ".github/workflows/dreamco-division-benchmark-evidence.yml"
  push:
    branches: [main]
    paths:
      - "buddy/benchmarks/division_benchmark_contract.py"
      - "tests/test_division_benchmark_contract.py"
permissions:
  contents: read
jobs:
  benchmark-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate benchmark evidence gates
        run: python -m unittest discover -s tests -p 'test_division_benchmark_contract.py' -v
