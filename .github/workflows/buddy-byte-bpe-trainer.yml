name: Buddy Byte BPE Trainer Tests
on:
  pull_request:
    paths:
      - "buddy/learning/byte_bpe_trainer.py"
      - "schemas/authorized-tokenizer-corpus-manifest.schema.json"
      - "tests/test_buddy_byte_bpe_trainer.py"
      - ".github/workflows/buddy-byte-bpe-trainer.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buddy-byte-bpe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pytest -q tests/test_buddy_byte_bpe_trainer.py
