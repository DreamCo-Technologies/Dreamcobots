name: Consolidated DreamCo evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'
  pull_request:
    paths:
      - 'buddy/learning/**'
      - 'buddy/workbench/**'
      - 'tools/workbench_bridge.py'
      - 'tests/test_workbench*.py'
      - 'tools/compile_division_catalog.py'
      - 'tools/build_training_strategy_pages.py'
      - 'tests/test_strategy_policy.py'
      - 'tests/test_source_division_catalog.py'
      - 'tests/test_cycle_evidence_integrity.py'
permissions:
  contents: read
concurrency:
  group: consolidated-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 pytest-subtests==0.14.2
      - run: python tools/compile_division_catalog.py
      - run: python tools/build_training_strategy_pages.py
      - run: python tools/general_intelligence.py
      - run: python -m pytest -q tests/test_workbench.py tests/test_workbench_bridge.py tests/test_workbench_finance.py tests/test_strategy_policy.py tests/test_source_division_catalog.py tests/test_cycle_evidence_integrity.py tests/test_verify_frontier_evidence.py tests/test_general_intelligence.py --junitxml=evidence/consolidated-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidated-offline-evidence
          path: |
            evidence/consolidated-tests.xml
            config/generated/source-divisions/
            website/data/training-strategy-registry.json
          if-no-files-found: error
