name: Model Foundry BPE Tokenizer Integration
on:
  pull_request:
    paths:
      - "buddy/learning/model_foundry.py"
      - "buddy/learning/byte_bpe_trainer.py"
      - "config/buddy-25m-bpe-cpu-architecture-profile.json"
      - "tests/test_model_foundry.py"
      - "tests/test_buddy_byte_bpe_trainer.py"
      - ".github/workflows/model-foundry-bpe-tokenizer-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-foundry-bpe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_buddy_byte_bpe_trainer.py tests/test_model_foundry.py
