name: Evidence gate

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-gate.yml"
      - "tests/test_buddy_os_evidence_gate.py"
      - "buddy/builder/promotion_gate.py"
      - "buddy/builder/model_selection.py"
      - "buddy/builder/division_audit.py"
      - "buddy/builder/division_gaps.py"
      - "buddy/builder/division_resources.py"
      - "config/buddy-model-selection-registry.json"
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the fail-closed evidence gate
        run: |
          python3 -m unittest tests.test_buddy_os_evidence_gate
          python3 buddy/builder/promotion_gate.py
          python3 buddy/builder/model_selection.py
          python3 buddy/builder/division_audit.py
