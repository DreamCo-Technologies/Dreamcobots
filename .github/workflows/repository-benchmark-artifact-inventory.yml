name: Repository Benchmark Artifact Inventory
on:
  pull_request:
    paths:
      - "tools/scan_repository_benchmark_artifacts.py"
      - "tests/test_repository_benchmark_artifact_scanner.py"
      - "docs/REPOSITORY_BENCHMARK_ARTIFACT_DISCOVERY.md"
      - ".github/workflows/repository-benchmark-artifact-inventory.yml"
      - "**/*benchmark*"
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * 1"
permissions:
  contents: read
concurrency:
  group: repository-benchmark-artifact-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_repository_benchmark_artifact_scanner.py
      - run: python tools/scan_repository_benchmark_artifacts.py --output benchmark-artifact-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: repository-benchmark-artifact-inventory
          path: benchmark-artifact-inventory.json
          if-no-files-found: error
          retention-days: 30
