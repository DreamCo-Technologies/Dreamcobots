name: Buddy Sandbox Bootcamp

on:
  workflow_dispatch:
  push:
    paths:
      - 'buddy/sandbox/**'
      - 'buddy/bootcamp/**'
      - 'buddy/learning/**'
      - 'config/buddy-study-resources-*.json'

permissions:
  contents: read

concurrency:
  group: buddy-sandbox-bootcamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile sandbox and bootcamp modules
        run: python -m compileall -q buddy/sandbox buddy/bootcamp buddy/learning
      - name: Run safe sandbox smoke test
        run: |
          python - <<'PY'
          from buddy.sandbox.buddy_sandbox import BuddySandbox
          result = BuddySandbox().run('bootcamp-smoke', lambda: (True, 1.0, []))
          assert result.passed and result.score == 1.0
          print(result)
          PY
      - name: Validate curriculum JSON
        run: |
          python - <<'PY'
          import glob, json
          files = glob.glob('config/buddy-study-resources-*.json')
          assert files, 'No study-resource sets found'
          total = 0
          ids = set()
          urls = set()
          for path in files:
              with open(path, encoding='utf-8') as handle:
                  data = json.load(handle)
              assert isinstance(data.get('resources'), list), f'Invalid resources list: {path}'
              for row in data['resources']:
                  assert len(row) >= 6
                  assert isinstance(row[0], int)
                  assert row[3].startswith(('https://', 'http://'))
                  assert row[0] not in ids, f'Duplicate study resource ID: {row[0]}'
                  canonical = row[3].strip().rstrip('/').lower()
                  assert canonical not in urls, f'Duplicate study resource URL: {row[3]}'
                  ids.add(row[0])
                  urls.add(canonical)
                  total += 1
          assert total >= 1000, f'Expected at least 1000 unique study resources, found {total}'
          print(f'validated {total} unique study resources')
          PY
