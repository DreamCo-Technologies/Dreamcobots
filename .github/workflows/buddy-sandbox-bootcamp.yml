name: Buddy Sandbox Bootcamp

on:
  workflow_dispatch:
  schedule:
    # Daily rotating public metadata discovery; no dataset downloads or training.
    - cron: "23 8 * * *"
  pull_request:
    paths:
      - '.github/workflows/buddy-sandbox-bootcamp.yml'
      - 'buddy/gpt_baseline/**'
      - 'config/buddy-tiny-gpt-baseline.json'
      - 'docs/BUDDY_TINY_GPT_BASELINE_MODEL_CARD.md'
      - 'tools/run_buddy_gpt_baseline.py'
      - 'tests/test_buddy_gpt_baseline.py'
      - 'tests/test_buddy_dataset_source_auth.py'
      - 'tools/bootcamp_lesson_planner.py'
      - 'tests/test_bootcamp_lesson_planner.py'
      - 'tools/dreamco_division_mastery_orchestrator.py'
      - 'tests/test_dreamco_division_mastery_orchestrator.py'
      - 'tools/build_division_model_fleet.py'
      - 'tests/test_division_model_fleet.py'
  push:
    paths:
      - '.github/workflows/buddy-sandbox-bootcamp.yml'
      - 'buddy/sandbox/**'
      - 'buddy/bootcamp/**'
      - 'buddy/learning/**'
      - 'buddy/datasets/**'
      - 'buddy/gpt_baseline/**'
      - 'config/buddy-tiny-gpt-baseline.json'
      - 'docs/BUDDY_TINY_GPT_BASELINE_MODEL_CARD.md'
      - 'tools/run_buddy_gpt_baseline.py'
      - 'tests/test_buddy_gpt_baseline.py'
      - 'tests/test_buddy_dataset_source_auth.py'
      - 'tools/bootcamp_lesson_planner.py'
      - 'tests/test_bootcamp_lesson_planner.py'
      - 'tools/dreamco_division_mastery_orchestrator.py'
      - 'tests/test_dreamco_division_mastery_orchestrator.py'
      - 'tools/build_division_model_fleet.py'
      - 'tests/test_division_model_fleet.py'
      - 'tests/test_buddy_cross_model_benchmark.py'
      - 'tools/create_buddy_model_benchmark.py'
      - 'tools/run_buddy_model_benchmark.py'
      - 'config/buddy-study-resources-*.json'
      - 'config/buddy-dataset-routing-policy.json'
      - 'config/huggingface-task-taxonomy.json'
      - 'config/generated/division-huggingface-taxonomy-map.json'
      - 'config/generated/division-resource-readiness-map.json'
      - 'schemas/division-resource-readiness-map.schema.json'
      - 'tools/build_division_resource_readiness_map.py'
      - 'tests/test_division_resource_readiness.py'
      - 'buddy/resources/division_resource_router.py'
      - 'config/review/masterbot-domain-crosswalk-owner-review.json'
      - 'docs/architecture/DREAMCO_DIVISION_RESOURCE_READINESS.md'
      - 'schemas/division-huggingface-taxonomy-map.schema.json'
      - 'tools/build_division_huggingface_taxonomy_map.py'
      - 'tests/test_division_huggingface_taxonomy_map.py'
      - 'docs/architecture/DREAMCO_HUGGINGFACE_DIVISION_TAXONOMY.md'
      - 'config/masterbot-65-registry.json'
      - 'website/data/free-datasets.json'
      - 'tools/build_buddy_dataset_routes.py'
      - 'tests/test_buddy_dataset_routing.py'
      - 'tests/test_buddy_dataset_hub_runtime.py'
      - 'tests/test_buddy_database_sources.py'
      - 'tools/route_buddy_unknown_problem.py'
      - 'buddy/datasets/transformers_runner.py'
      - 'buddy/datasets/training_jobs.py'
      - 'tools/run_buddy_training_job.py'
      - 'tools/create_buddy_training_job.py'
      - 'tools/build_dreamco_training_examples.py'
      - 'tests/test_dreamco_original_training_examples.py'
      - 'tools/register_buddy_dataset.py'
      - 'buddy/datasets/discovery_fleet.py'
      - 'buddy/datasets/license_policy.py'
      - 'tools/run_buddy_dataset_discovery.py'
      - 'tests/test_buddy_dataset_discovery_fleet.py'
      - '.github/workflows/buddy-failure-learning.yml'
      - 'tools/buddy_failure_learning.py'
      - 'tests/test_buddy_failure_learning.py'
      - '.github/workflows/buddy-safe-repair.yml'
      - 'tools/buddy_safe_repair.py'
      - 'tests/test_buddy_safe_repair.py'

permissions:
  contents: read

concurrency:
  group: buddy-sandbox-bootcamp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile sandbox, bootcamp, learning, and tiny GPT modules
        run: python -m compileall -q buddy/sandbox buddy/bootcamp buddy/learning buddy/datasets buddy/gpt_baseline tools/build_buddy_dataset_routes.py tools/route_buddy_unknown_problem.py tools/run_buddy_training_job.py tools/create_buddy_training_job.py tools/build_dreamco_training_examples.py tools/register_buddy_dataset.py buddy/datasets/discovery_fleet.py buddy/datasets/license_policy.py tools/run_buddy_dataset_discovery.py tools/create_buddy_model_benchmark.py tools/run_buddy_model_benchmark.py tools/run_buddy_gpt_baseline.py
      - name: Run reproducible tiny GPT forward-pass baseline
        run: python tools/run_buddy_gpt_baseline.py --config config/buddy-tiny-gpt-baseline.json --output-dir artifacts/buddy-gpt-baseline --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Test tiny GPT baseline and safe dataset token scoping
        run: python -m unittest tests.test_buddy_gpt_baseline tests.test_buddy_dataset_source_auth tests.test_bootcamp_lesson_planner tests.test_dreamco_division_mastery_orchestrator tests.test_division_model_fleet
      - name: Restore rotating Dataset Hub catalog
        if: github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: .dreamco/dataset-hub
          key: dreamco-dataset-hub-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dreamco-dataset-hub-${{ runner.os }}-${{ github.ref_name }}-
      - name: Run safe sandbox smoke test
        run: |
          python - <<'PY'
          from buddy.sandbox.buddy_sandbox import BuddySandbox
          result = BuddySandbox().run('bootcamp-smoke', lambda: (True, 1.0, []))
          assert result.passed and result.score == 1.0
          print(result)
          PY
      - name: Validate the 65-lane Hugging Face taxonomy map
        run: |
          python tools/build_division_huggingface_taxonomy_map.py --check
          python -m unittest tests.test_division_huggingface_taxonomy_map
      - name: Validate all 65 division resource bundles
        run: |
          python tools/build_division_resource_readiness_map.py --check
          python -m unittest tests.test_division_resource_readiness
          python -m unittest tests.test_buddy_dataset_discovery_fleet
      - name: Build DreamCo dataset discovery routes
        run: python tools/build_buddy_dataset_routes.py
      - name: Test 65 MasterBot dataset routing and training gates
        run: python -m unittest tests.test_buddy_dataset_routing tests.test_buddy_dataset_hub_runtime tests.test_buddy_database_sources tests.test_dreamco_original_training_examples tests.test_buddy_dataset_discovery_fleet tests.test_buddy_cross_model_benchmark
      - name: Test Buddy failure classification and verified-lesson safeguards
        run: python -m unittest tests.test_buddy_failure_learning tests.test_buddy_safe_repair
      - name: Smoke test local unknown-problem routing
        run: PYTHONPATH=. python tools/route_buddy_unknown_problem.py --problem 'Build a SQL database analytics pipeline' --out artifacts/buddy-dataset-hub/ci-unknown-route.json
      - name: Validate curriculum JSON
        # Scheduled timer still validates the dataset route policy; broader study catalog validation runs on push/dispatch.
        if: github.event_name != 'schedule'
        run: |
          python - <<'PY'
          import glob, json
          from pathlib import Path
          files = glob.glob('config/buddy-study-resources-*.json')
          assert files, 'No study-resource sets found'
          policy = json.loads(Path('config/buddy-study-resource-policy.json').read_text(encoding='utf-8'))
          total = 0
          ids = set()
          urls = set()
          for path in files:
              with open(path, encoding='utf-8') as handle:
                  data = json.load(handle)
              assert isinstance(data.get('resources'), list), f'Invalid resources list: {path}'
              for row in data['resources']:
                  assert len(row) >= 6
                  assert isinstance(row[0], int)
                  assert row[3].startswith(('https://', 'http://'))
                  assert row[0] not in ids, f'Duplicate study resource ID: {row[0]}'
                  canonical = row[3].strip().rstrip('/').lower()
                  assert canonical not in urls, f'Duplicate study resource URL: {row[3]}'
                  ids.add(row[0])
                  urls.add(canonical)
                  total += 1
          minimum = int(policy.get('minimum_operational_count', policy.get('target_count', 0)))
          target = int(policy.get('target_count', minimum))
          assert total >= minimum, f'Expected at least {minimum} unique study resources, found {total}'
          assert total <= target, f'Expected no more than target catalog size {target}, found {total}'
          print(f'validated {total} unique study resources toward target {target}')
          PY
      - name: Discover public datasets across rotating MasterBot lanes
        if: github.event_name == 'schedule'
        env:
          DREAMCO_ALLOW_SOURCE_NETWORK: '1'
        run: python tools/run_buddy_dataset_discovery.py --lanes-per-run 5 --limit 3
      - name: Preserve dataset routing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-dataset-routes-${{ github.run_id }}
          path: |
            artifacts/buddy-dataset-hub/dataset-routes.json
            artifacts/buddy-dataset-hub/discovery-fleet.json
            .dreamco/dataset-hub/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve tiny GPT baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-gpt-baseline-${{ github.run_id }}
          path: artifacts/buddy-gpt-baseline/
          if-no-files-found: warn
          retention-days: 90
