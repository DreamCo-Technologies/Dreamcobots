name: FreeCodeCamp Catalog Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: freecodecamp-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh-metadata-and-open-pr:
    if: github.repository == 'DreamCo-Technologies/Dreamcobots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned metadata enumerator
        run: python -m pip install --disable-pip-version-check "yt-dlp==2026.11.23"
      - name: Enumerate the full public freeCodeCamp uploads playlist
        run: |
          python tools/sync_freecodecamp_catalog.py --out buddy/bootcamp/sources/freecodecamp/catalog.json
          python tools/sync_freecodecamp_catalog.py --check --out buddy/bootcamp/sources/freecodecamp/catalog.json
      - name: Synchronize course and division queue counts
        run: |
          python tools/sync_freecodecamp_learning_inventory.py
          python tools/sync_freecodecamp_learning_inventory.py --check
      - name: Validate curriculum and catalog tests
        run: |
          python -m py_compile tools/sync_freecodecamp_catalog.py tools/sync_freecodecamp_learning_inventory.py buddy/learning/course_track_registry.py
          python -m unittest discover -s tests -p 'test_freecodecamp_catalog.py' -v
          python -m unittest discover -s tests -p 'test_freecodecamp_learning_inventory.py' -v
          python -m unittest discover -s tests -p 'test_buddy_course_track_registry.py' -v
      - name: Open a reviewable catalog update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/freecodecamp-catalog-refresh
          delete-branch: true
          commit-message: "chore(learning): refresh freeCodeCamp public video metadata"
          title: "chore(learning): refresh complete freeCodeCamp video catalog"
          body: |
            ## Summary
            - Refresh public freeCodeCamp channel metadata from the official uploads playlist.
            - Require yt-dlp's playlist count to match every parsed, non-null, unique video ID.
            - Synchronize Buddy's video inventory and course-queue counts.

            ## Safety
            - Metadata only: no video, audio, captions, transcripts, comments or viewer data are downloaded.
            - This does not grant training or redistribution rights.
            - The PR updates the catalog and count manifests only; it does not train model weights or deploy services.

            ## Completeness
            - The catalog remains partial if upstream playlist count, enumerator version or unique ID coverage cannot be verified.
            - All cataloged videos enter the shared Buddy course queue as metadata-only study candidates.
          add-paths: |
            buddy/bootcamp/sources/freecodecamp/catalog.json
            config/freecodecamp-complete-learning-path.json
            config/buddy-continuous-study-policy.json
