name: Parallel Benchmark Gap Builders

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "tools/**"
      - "server/**"
      - "client/**"
      - "website/**"
      - "dreamco_platform/**"
      - "tests/**"
      - "App_bots/**"
      - ".github/workflows/parallel-benchmark-gap-builders.yml"
  pull_request:
    paths:
      - "config/**"
      - "tools/**"
      - "server/**"
      - "client/**"
      - "website/**"
      - "dreamco_platform/**"
      - "tests/**"
      - "App_bots/**"
      - ".github/workflows/parallel-benchmark-gap-builders.yml"

permissions:
  contents: read

concurrency:
  group: benchmark-gap-builders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Explain this action
        run: |
          {
            echo "# Parallel Benchmark Gap Builders"
            echo
            echo "**Owner:** Finds benchmark areas that need work and assigns each non-overlapping area its own temporary builder lane."
            echo "**Cost control:** Every lane runs only its explicit tests and unique scripts instead of repeating the whole repository verification suite."
            echo "**Conflict control:** Independent lanes run in parallel, but each canonical owner remains single-writer."
            echo "**Truth rule:** A lane closes only from passing evidence; unknown, blocked, failed, or regressed gaps stay visible."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check Actions health
        run: python3 tools/audit_actions_health.py
      - name: Validate consolidated guardrails and benchmark coverage
        run: python3 tools/check_guardrails_benchmark_program.py
      - name: Generate parallel benchmark plan
        run: python3 tools/plan_parallel_benchmark_gaps.py
      - id: matrix
        name: Build lane matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path('config/generated/parallel-benchmark-gap-plan.json').read_text())
          include=[{'lane':lane['lane'],'slot':lane['parallel_slot']} for lane in plan['lanes']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          print({'lanes':len(include),'policy':'targeted_lane_execution'})
          PY

  benchmark-lane:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: benchmark-owner-${{ github.ref }}-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: npm ci
      - name: Install declared Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate guardrails before lane execution
        run: python3 tools/check_guardrails_benchmark_program.py
      - name: Regenerate gap plan
        run: python3 tools/plan_parallel_benchmark_gaps.py
      - name: Show lane execution plan
        env:
          BENCHMARK_BUILDER_LANE: ${{ matrix.lane }}
          BENCHMARK_PARALLEL_SLOT: ${{ matrix.slot }}
        run: python3 tools/run_benchmark_lane.py --lane "$BENCHMARK_BUILDER_LANE" --dry-run
      - name: Run only lane-owned benchmark evidence
        env:
          BENCHMARK_BUILDER_LANE: ${{ matrix.lane }}
          BENCHMARK_PARALLEL_SLOT: ${{ matrix.slot }}
        run: |
          echo "Benchmark builder lane: $BENCHMARK_BUILDER_LANE (slot $BENCHMARK_PARALLEL_SLOT)"
          python3 tools/run_benchmark_lane.py --lane "$BENCHMARK_BUILDER_LANE"
      - name: Guardrail invariant
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/buddy-guardrails-benchmark-program.json').read_text())
          assert p.get('canonical') is True
          assert len(p.get('global_guardrails',[])) >= 40
          assert p['parallel_builder_team']['maximum_parallel_changes_per_owner'] == 1
          assert p['parallel_builder_team']['maximum_parallel_lanes'] <= 32
          print('Guardrail invariants pass; workflow executor supports up to 32 independent lanes')
          PY
