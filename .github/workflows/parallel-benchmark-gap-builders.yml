name: Parallel Benchmark Gap Builders

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "tools/**"
      - "server/**"
      - "client/**"
      - "website/**"
      - "dreamco_platform/**"
      - "tests/**"
      - "App_bots/**"
      - ".github/workflows/parallel-benchmark-gap-builders.yml"
  pull_request:
    paths:
      - "config/**"
      - "tools/**"
      - "server/**"
      - "client/**"
      - "website/**"
      - "dreamco_platform/**"
      - "tests/**"
      - "App_bots/**"
      - ".github/workflows/parallel-benchmark-gap-builders.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: benchmark-gap-builders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check Actions health
        run: python3 tools/audit_actions_health.py
      - name: Validate consolidated guardrails and benchmark coverage
        run: python3 tools/check_guardrails_benchmark_program.py
      - name: Generate accelerated parallel benchmark plan
        run: python3 tools/plan_parallel_benchmark_gaps.py
      - id: matrix
        name: Build lane matrix
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan=json.loads(Path('config/generated/parallel-benchmark-gap-plan.json').read_text())
          include=[{'lane':lane['lane'],'slot':lane['parallel_slot']} for lane in plan['lanes']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n')
          PY

  benchmark-lane:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: benchmark-owner-${{ github.ref }}-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Validate guardrails before lane execution
        run: python3 tools/check_guardrails_benchmark_program.py
      - name: Regenerate gap plan
        run: python3 tools/plan_parallel_benchmark_gaps.py
      - name: Run lane-owned suites through universal verification
        env:
          BENCHMARK_BUILDER_LANE: ${{ matrix.lane }}
          BENCHMARK_PARALLEL_SLOT: ${{ matrix.slot }}
        run: |
          echo "Benchmark builder lane: $BENCHMARK_BUILDER_LANE (slot $BENCHMARK_PARALLEL_SLOT)"
          npx tsx tools/run_universal_verification.ts
      - name: Guardrail invariant
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('config/buddy-guardrails-benchmark-program.json').read_text())
          a=json.loads(Path('config/benchmark-gap-acceleration-policy.json').read_text())
          assert p.get('canonical') is True
          assert len(p.get('global_guardrails',[])) >= 40
          assert p['parallel_builder_team']['maximum_parallel_changes_per_owner'] == 1
          assert a['parallelism']['maximum_parallel_lanes'] <= 32
          assert a['parallelism']['same_canonical_owner_serialized'] is True
          print('Guardrail and acceleration invariants pass')
          PY

  gap-velocity:
    needs: benchmark-lane
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate core business and benchmark artifacts
        shell: bash
        run: |
          python3 tools/build_500_advertising_methods.py
          python3 tools/build_150_billable_business_services.py
          python3 tools/build_bot_business_blueprints.py
          python3 tools/build_universal_capability_benchmark.py
          python3 tools/build_business_lifecycle_benchmarks.py
          python3 tools/build_creative_mastery_benchmarks.py
          python3 tools/build_government_public_sector_benchmarks.py
          python3 tools/build_parallel_benchmark_gap_registry.py
      - name: Audit repo-wide connections
        continue-on-error: true
        run: python3 tools/audit_repository_connections.py
      - name: Audit stagnation and calculate closure estimate
        id: velocity
        continue-on-error: true
        run: python3 tools/audit_benchmark_gap_velocity.py
      - name: Publish summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('config/generated/benchmark-gap-velocity.json')
          if not p.exists():
              print('## Benchmark gap velocity\n\nNo velocity artifact was produced.')
              raise SystemExit(0)
          d=json.loads(p.read_text()); e=d['closure_estimate']
          print('## Benchmark gap velocity')
          print(f"- Open gaps: **{d['open_gap_count']}**")
          print(f"- Stagnant gaps: **{d['stagnant_gap_count']}**")
          print(f"- Blocked gaps: **{d['blocked_gap_count']}**")
          print(f"- Effective parallel lanes: **{e['effective_parallel_lanes']}**")
          print(f"- Parallel waves: **{e['estimated_parallel_waves']}**")
          print(f"- Planning hours (optimistic / expected / conservative): **{e['planning_hours']['optimistic']} / {e['planning_hours']['expected']} / {e['planning_hours']['conservative']}**")
          print('\nEstimate is planning evidence, not a delivery promise; blocked/external gaps require their blockers to resolve.')
          PY
      - name: Open or update benchmark stagnation issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path('config/generated/benchmark-gap-velocity.json')
          if not p.exists(): raise SystemExit(0)
          d=json.loads(p.read_text())
          if not d.get('stagnant_gap_count'): raise SystemExit(0)
          title='Benchmark watchdog: stagnant gaps require builder attention'
          e=d['closure_estimate']
          lines=['# Benchmark stagnation backlog','',f"Open gaps: {d['open_gap_count']}",f"Stagnant gaps: {d['stagnant_gap_count']}",f"Blocked gaps: {d['blocked_gap_count']}",f"Parallel lanes: {e['effective_parallel_lanes']}",'','## First stagnant gaps','']
          for row in d.get('stagnant_gaps',[])[:100]: lines.append(f"- `{row['gap_id']}` — {row['status']} — {row['stagnant_reason']} — {row['required_action']}")
          Path('tmp-stagnation-issue.md').write_text('\n'.join(lines))
          q=subprocess.run(['gh','issue','list','--state','open','--search',title+' in:title','--json','number','--jq','.[0].number // empty'],capture_output=True,text=True); n=q.stdout.strip()
          subprocess.run(['gh','issue','comment',n,'--body-file','tmp-stagnation-issue.md'] if n else ['gh','issue','create','--title',title,'--body-file','tmp-stagnation-issue.md'],check=False)
          PY
      - name: Upload gap evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-gap-velocity-${{ github.run_id }}
          path: |
            config/generated/benchmark-gap-velocity.json
            config/generated/parallel-benchmark-gap-registry.json
            config/generated/repo-wide-connection-map.json
            config/generated/repo-connection-builder-backlog.json
            reports/BENCHMARK_GAP_VELOCITY.md
            reports/REPOSITORY_SYSTEM_CONNECTIONS.md
          if-no-files-found: warn
          retention-days: 21
