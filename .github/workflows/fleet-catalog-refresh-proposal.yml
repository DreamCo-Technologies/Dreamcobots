name: Safe fleet catalog refresh proposals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"
  push:
    branches: [main, feat/division-resource-readiness-blueprints-20261124]
    paths:
      - "App_bots/**"
      - "server/seed-bots.ts"
      - "server/seed-codelabs.ts"
      - "server/seed-github-bots.ts"
      - "server/seed-supplemental-bots.ts"
      - "shared/api-registry.ts"
      - "shared/division-production-contract.ts"
      - "tools/generate_bot_fleet_catalog.ts"
      - ".github/workflows/fleet-catalog-refresh-proposal.yml"
      - "tools/audit_actions_health.py"
      - "tools/build_actions_prospectus.py"
      - "config/actions-control-prospectus.json"
      - "config/generated/actions-health-report.json"
      - "website/data/actions-health-report.json"
      - "reports/ACTIONS_HEALTH_REPORT.md"
      - "config/generated/actions-prospectus.json"
      - "website/data/actions-prospectus.json"
      - "config/buddy/run-with-buddy.generated.json"
      - "website/data/run-prospectus.json"
      - "website/data/run-prospectus-bots.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fleet-catalog-refresh-proposal-main
  cancel-in-progress: false

jobs:
  generate-and-propose:
    if: github.repository == 'DreamCo-Technologies/Dreamcobots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate fleet catalog from canonical source inputs
        run: npx tsx tools/generate_bot_fleet_catalog.ts

      - name: Verify generated fleet catalog is deterministic
        run: npm run buddy:fleet

      - name: Refresh Actions health and prospectus evidence
        run: |
          python3 tools/audit_actions_health.py
          python3 -m pip install PyYAML==6.0.2
          python3 tools/build_actions_prospectus.py

      - name: Check generated diff formatting
        run: git diff --check

      - name: Open or update a review-only pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/fleet-catalog-refresh
          delete-branch: true
          commit-message: "chore: refresh generated bot fleet catalog"
          title: "chore: refresh generated bot fleet catalog"
          body: |
            ## Automated generated-artifact proposal

            This pull request regenerates the committed fleet catalog from the current canonical repository sources.

            - Generated by `tools/generate_bot_fleet_catalog.ts`.
            - Verified by `npm run buddy:fleet`.
            - No model training, deployment, external writes, or production release is performed.
            - This workflow proposes changes for review; it never auto-merges or auto-deploys.

            Review the generated diff and CI results before merging.
          add-paths: |
            config/master_bot_registry.json
            config/generated/bots.catalog.json
            website/data/bot-fleet-catalog.json
            website/data/buddy-routing-index.js
            website/data/bot-fleet/**
            reports/BOT_FLEET_PROSPECTUS.md
            config/generated/actions-health-report.json
            website/data/actions-health-report.json
            reports/ACTIONS_HEALTH_REPORT.md
            config/generated/actions-prospectus.json
            website/data/actions-prospectus.json
            config/buddy/run-with-buddy.generated.json
            website/data/run-prospectus.json
            website/data/run-prospectus-bots.json
