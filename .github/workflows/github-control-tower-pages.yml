name: DreamCo GitHub Control Tower

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: dreamco-github-control-tower-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate public repository, PR and Actions inventory
        env:
          GH_TOKEN: \${{ github.token }}
        run: python3 tools/generate_github_control_tower.py
      - name: Validate snapshot and tests
        run: |
          python3 tools/generate_github_control_tower.py --check
          python3 -m unittest tests.test_github_control_tower
          python3 -m json.tool website/data/control-tower/github-status.json >/dev/null
          node --check website/control-tower.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Combine documentation and website
        run: |
          set -euo pipefail
          mkdir -p public_site
          cp -a _site/. public_site/
          rsync -a website/ public_site/
          touch public_site/.nojekyll
          test -s public_site/control-tower.html
          test -s public_site/data/control-tower/github-status.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_site
      - name: Deploy Control Tower snapshot
        id: deployment
        uses: actions/deploy-pages@v5
