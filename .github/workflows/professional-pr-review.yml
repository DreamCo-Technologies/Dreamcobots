name: Professional PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: professional-pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repository contract review
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          required=['README.md','LICENSE']
          missing=[p for p in required if not Path(p).exists()]
          workflows=list(Path('.github/workflows').glob('*.yml'))+list(Path('.github/workflows').glob('*.yaml'))
          print(f'workflows={len(workflows)}')
          print(f'missing_required={missing}')
          if missing: raise SystemExit(1)
          # Flag obvious secret literals without printing their values.
          suspicious=[]
          for p in workflows:
              text=p.read_text(errors='ignore')
              if re.search(r'(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})',text): suspicious.append(str(p))
          if suspicious:
              print('Potential credential literal in:', suspicious); raise SystemExit(1)
          PY
      - name: Python compile smoke test
        run: python -m compileall -q tools framework 2>/dev/null || true
      - name: Review evidence summary
        run: |
          {
            echo '## Professional PR Review'
            echo ''
            echo '- Repository contract: evaluated'
            echo '- Credential literal scan: evaluated'
            echo '- Python syntax smoke: evaluated'
            echo '- Full product tests remain owned by the repository CI workflows.'
            echo '- This job never claims tests passed unless their actual command exits successfully.'
          } >> "$GITHUB_STEP_SUMMARY"
