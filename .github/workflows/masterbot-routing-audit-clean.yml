name: MasterBot Routing Audit
on:
  pull_request:
    paths:
      - 'config/masterbot-20-extension.json'
      - 'website/data/masterbot-homepage-featured.json'
      - 'App_bots/**'
      - 'bots/**'
      - 'original-bots/**'
      - 'tools/masterbot_routing_audit.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/masterbot_routing_audit.py > masterbot-routing-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: masterbot-routing-audit
          path: masterbot-routing-audit.json
