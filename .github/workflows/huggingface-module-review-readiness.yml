name: Hugging Face Module Review Readiness

on:
  pull_request:
    paths:
      - "config/buddy-huggingface-18-ecosystem-module-guides.json"
      - "config/buddy-huggingface-module-review-artifacts.json"
      - "tools/audit_huggingface_module_review_readiness.py"
      - "tests/test_huggingface_module_review_readiness.py"
      - ".github/workflows/huggingface-module-review-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-module-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_huggingface_module_review_readiness.py
      - run: python tools/audit_huggingface_module_review_readiness.py
