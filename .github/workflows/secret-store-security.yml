name: Secret Store Authenticated Encryption

on:
  pull_request:
    paths:
      - "buddy/security/secret_store.py"
      - "buddy/security/secret_store_test.py"
      - "docs/security/SECRET_STORE.md"
      - ".github/workflows/secret-store-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-store-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check cryptography
      - run: python -m unittest buddy.security.secret_store_test
