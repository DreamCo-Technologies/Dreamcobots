name: DreamCo Native Teacher Model Adapters
on:
  pull_request:
    paths:
      - "buddy/models/native_provider_runtime.py"
      - "tests/test_buddy_native_provider_runtime.py"
      - "docs/DREAMCO_NATIVE_TEACHER_MODEL_ADAPTERS.md"
      - ".github/workflows/dreamco-native-teacher-model-adapters.yml"
  push:
    branches: [main]
    paths:
      - "buddy/models/native_provider_runtime.py"
      - "tests/test_buddy_native_provider_runtime.py"
permissions:
  contents: read
jobs:
  native-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native provider contract tests
        run: python -m unittest discover -s tests -p 'test_buddy_native_provider_runtime.py' -v
