name: Buddy CI Safe Generated-Artifact Repair

on:
  push:
    branches-ignore: [main]
    paths:
      - "tools/build_buddy_dataset_routes.py"
      - "tools/build_division_model_fleet.py"
      - "tools/build_pages_connection_index.py"
      - "tools/build_actions_prospectus.py"
      - "tools/audit_actions_health.py"
      - "tools/audit_actions_live.py"
      - ".github/workflows/dependency-review.yml"
      - "tests/test_dependency_review_scope.py"
      - "tests/test_actions_live_health.py"
      - "tools/build_file_prospectus.py"
      - "tools/daily_bot_study_scan.py"
      - "tests/test_daily_bot_study_scan.py"
      - ".github/workflows/daily-bot-study-scan.yml"
      - "tools/buddy_safe_repair.py"
      - "tools/buddy_failure_learning.py"
      - "tests/test_buddy_failure_learning.py"
      - "tests/test_buddy_safe_repair.py"
      - "tests/test_buddy_dataset_route_check.py"
      - "tests/test_file_prospectus_inventory.py"
      - "config/buddy-dataset-routing-policy.json"
      - "config/division-model-competitiveness-policy.json"
      - "config/division-model-training-policy.json"
      - "tools/generate_division_model_manifest.py"
      - "config/generated/division-model-manifest.json"
      - "tests/test_division_model_manifest.py"
      - "config/masterbot-65-registry.json"
      - ".github/workflows/buddy-ci-safe-repair.yml"
      - ".github/workflows/issue-lifecycle.yml"
      - ".github/workflows/issue-intelligence.yml"
      - ".github/workflows/actions-failure-watch.yml"
      - ".github/workflows/buddy-continuous-repair.yml"
      - ".github/workflows/greenkeeper-root-cause.yml"
      - ".github/workflows/greenkeeper-orchestrator.yml"
      - "tools/issue_lifecycle.py"
      - "tools/issue_intelligence.py"
      - "tests/test_issue_lifecycle.py"
      - "tools/generate_bot_manifests.py"
      - "tools/audit_markdown_implementation_gaps.py"
      - "App_bots/**"
      - "bots/**"
      - "server/seed-bots.ts"
      - "config/generated/bots.catalog.json"
      - "buddy/fleet_runtime/**"
      - "docs/**"
      - "website/data/markdown-implementation-gap-audit.json"
      - "config/generated/markdown-implementation-gap-audit.json"
      - "reports/MARKDOWN_IMPLEMENTATION_GAP_AUDIT.md"
  workflow_run:
    workflows:
      - "DreamCo Division Mastery Engine"
      - "Buddy Sandbox Bootcamp"
      - "Actions Health"
      - "Keep Green"
      - "Repository Test Matrix"
      - "DreamCo Core Health"
      - "Buddy Actions Test Lab"
      - "Buddy Failure Learning Regression"
      - "Buddy Learning Regression"
      - "Buddy 65 MasterBot Training Lanes"
      - "Buddy Continuous Learning Fleet"
      - "DreamCo Mastery Continuity"
      - "DreamCo Global Reconciliation"
      - "DreamCo PR Review Guardian"
      - "DreamCo PR Review Manifest"
      - "Buddy OS Contract Verification"
      - "Buddy Pages Link Check"
      - "Buddy Pages Mastery Evidence"
      - "Code Trust Gate"
      - "CodeQL Security Scan"
      - "Dependency Review"
      - "Consolidation Integrity Gate"
      - "Frontier Claim Trust Gate"
      - "Fleet runtime truth"
      - "Benchmark Tracker"
      - "Superbot Repository Inventory"
      - "Command Center Data Contract"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: buddy-ci-safe-repair-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main') || (github.event_name != 'workflow_run' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted default branch for failure-triggered repairs
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out the current non-main repair branch
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize failed job into a safe repair observation
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const run = context.payload.workflow_run;
            const result = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: run.id, per_page: 100
            });
            const failed = result.data.jobs.find(job => job.conclusion === "failure");
            const failedStep = failed && (failed.steps || []).find(step => step.conclusion === "failure");
            const observation = {
              repository: context.repo.owner + "/" + context.repo.repo,
              workflow: run.name || "",
              job: failed ? failed.name : "",
              failed_step: failedStep ? failedStep.name : "",
              error_signature: failedStep ? failedStep.name : "failed run without a failed step",
              commit: run.head_sha || "",
              run_id: String(run.id),
              source_run_url: run.html_url || ""
            };
            fs.mkdirSync("artifacts/buddy-safe-repair", {recursive: true});
            fs.writeFileSync("artifacts/buddy-safe-repair/observation.json", JSON.stringify(observation, null, 2) + "\n");
            core.setOutput("has_failed_job", failed ? "true" : "false");
      - name: Run exact allowlisted repair for a failed default-branch workflow
        if: github.event_name == 'workflow_run'
        run: python -m tools.buddy_safe_repair --observation artifacts/buddy-safe-repair/observation.json --out artifacts/buddy-safe-repair/result.json
      - name: Regenerate allowlisted deterministic indexes
        run: |
          set -euo pipefail
          python tools/build_buddy_dataset_routes.py
          python tools/build_division_model_fleet.py
          python tools/generate_division_model_manifest.py
          python tools/build_pages_connection_index.py
          python tools/audit_actions_health.py
          python tools/build_actions_prospectus.py
          python tools/build_file_prospectus.py
          python tools/generate_bot_manifests.py
          python tools/audit_markdown_implementation_gaps.py --write
      - name: Verify repaired indexes and Buddy repair-learning tests
        run: |
          set -euo pipefail
          python tools/build_buddy_dataset_routes.py --check
          python tools/build_division_model_fleet.py --check
          python tools/generate_division_model_manifest.py --check
          python -m unittest tests.test_division_model_manifest
          python tools/build_pages_connection_index.py --check
          python tools/build_actions_prospectus.py --check
          python tools/build_file_prospectus.py --check
          python tools/generate_bot_manifests.py --check
          python tools/audit_markdown_implementation_gaps.py --check
          python tools/validate_buddy_engineering_capabilities.py
          python tools/validate_dreamco_mastery_registry.py
          python -m unittest tests.test_buddy_safe_repair tests.test_buddy_failure_learning tests.test_buddy_dataset_routing tests.test_division_model_fleet tests.test_dreamco_division_mastery_orchestrator tests.test_buddy_dataset_route_check tests.test_file_prospectus_inventory tests.test_issue_lifecycle tests.test_actions_live_health tests.test_daily_bot_study_scan tests.test_dependency_review_scope tests.test_markdown_implementation_gaps tests.test_markdown_gap_audit_workflow_safety
          git diff --check
      - name: Detect allowlisted generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          for path in artifacts/buddy-dataset-hub/dataset-routes.json artifacts/division-model-fleet config/generated/file-prospectus config/bots config/generated/markdown-implementation-gap-audit.json website/data/markdown-implementation-gap-audit.json reports/MARKDOWN_IMPLEMENTATION_GAP_AUDIT.md config/buddy/run-with-buddy.generated.json config/generated/actions-prospectus.json website/data/actions-health-report.json website/data/actions-prospectus.json website/data/run-prospectus.json website/data/run-prospectus-bots.json website/data/pages-connection-index.json; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No allowlisted generated artifacts needed repair."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Commit and publish verified generated repairs
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPAIR_BRANCH: ${{ github.event_name == 'workflow_run' && format('buddy/ci-repair-{0}', github.event.workflow_run.id) || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            git switch -c "$REPAIR_BRANCH"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): apply verified allowlisted DreamCo repair"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $AUTH" push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$REPAIR_BRANCH"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REPAIR_BRANCH" \
              --title "Buddy safe CI repair for run ${{ github.event.workflow_run.id }}" \
              --body "This PR contains only allowlisted deterministic generated-index repairs. Original failing run: ${{ github.event.workflow_run.html_url }}. Review the diff and CI evidence before merging."
          fi
      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-safe-repair-${{ github.run_id }}
          path: artifacts/buddy-safe-repair/
          if-no-files-found: warn
          retention-days: 30
