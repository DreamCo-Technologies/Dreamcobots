name: Buddy CI Safe Generated-Artifact Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/buddy-ci-safe-repair.yml"
      - ".github/workflows/full-system-certification.yml"
      - "tools/run_bot_fleet_e2e.ts"
      - "reports/BOT_FLEET_E2E.md"
  workflow_run:
    workflows:
      - "Repository Test Matrix"
      - "DreamCo Core Health"
      - "Fleet runtime truth"
      - "Buddy Fleet Execution Map"
      - "Actions Health"
      - "Superbot Repository Inventory"
      - "Buddy Bootcamp Curriculum"
      - "Buddy Sandbox Bootcamp"
      - "Buddy Open-Source Weekly Bootcamp"
      - "Buddy Bootcamp Curriculum"
      - "Full System Certification"
      - "DreamCo Live Dashboard"
      - "Deploy Buddy Website"
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: buddy-ci-safe-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    if: github.repository == 'DreamCo-Technologies/Dreamcobots' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted default branch for generated-evidence repairs
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node for canonical fleet regeneration
        if: github.event_name == 'push' || (github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Full System Certification' || github.event.workflow_run.name == 'DreamCo Live Dashboard' || github.event.workflow_run.name == 'Deploy Buddy Website'))
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Node dependencies for fleet regeneration
        if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Full System Certification')
        run: npm ci
      - name: Install pinned workflow parser dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Normalize failed job into a safe repair observation
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const run = context.payload.workflow_run;
            const result = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: run.id, per_page: 100
            });
            const failed = result.data.jobs.find(job => job.conclusion === "failure");
            const failedStep = failed && (failed.steps || []).find(step => step.conclusion === "failure");
            const observation = {
              repository: context.repo.owner + "/" + context.repo.repo,
              workflow: run.name || "",
              job: failed ? failed.name : "",
              failed_step: failedStep ? failedStep.name : "",
              error_signature: failedStep ? failedStep.name : "failed run without a failed step",
              commit: run.head_sha || "",
              run_id: String(run.id),
              source_run_url: run.html_url || ""
            };
            fs.mkdirSync("artifacts/buddy-safe-repair", {recursive: true});
            fs.writeFileSync("artifacts/buddy-safe-repair/observation.json", JSON.stringify(observation, null, 2) + "\n");
            core.setOutput("has_failed_job", failed ? "true" : "false");
      - name: Run exact allowlisted repair for a failed default-branch workflow
        if: github.event_name == 'workflow_run'
        run: python -m tools.buddy_safe_repair --observation artifacts/buddy-safe-repair/observation.json --out artifacts/buddy-safe-repair/result.json
      - name: Regenerate allowlisted deterministic indexes
        run: |
          set -euo pipefail
          python tools/build_buddy_dataset_routes.py
          python tools/build_division_model_fleet.py
          python tools/generate_division_model_manifest.py
          python tools/build_pages_connection_index.py
          python tools/generate_bot_manifests.py
          python tools/fleet_runtime_audit.py --skip-folder-tests
          python tools/refresh_repository_evidence.py
          python tools/generate_command_center_data.py
          python tools/sync_freecodecamp_learning_inventory.py
          python tools/build_division_huggingface_taxonomy_map.py
          python tools/build_division_resource_readiness_map.py
      - name: Regenerate canonical bot fleet catalog after certification drift
        if: github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Full System Certification' || github.event.workflow_run.name == 'DreamCo Live Dashboard' || github.event.workflow_run.name == 'Deploy Buddy Website')
        run: node --import tsx tools/generate_bot_fleet_catalog.ts
      - name: Regenerate canonical fleet end-to-end evidence after certification drift
        if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Full System Certification')
        run: node --import tsx tools/run_bot_fleet_e2e.ts
      - name: Regenerate Markdown implementation-gap audit after source inventories
        run: python tools/audit_markdown_implementation_gaps.py --write
      - name: Regenerate file prospectus after all generated source inventories
        run: python tools/build_file_prospectus.py
      - name: Verify repaired indexes and Buddy repair-learning tests
        run: |
          set -euo pipefail
          python tools/build_buddy_dataset_routes.py --check
          python tools/build_division_model_fleet.py --check
          python tools/generate_division_model_manifest.py --check
          python -m unittest tests.test_division_model_manifest
          python tools/build_pages_connection_index.py --check
          python tools/generate_bot_manifests.py --check
          python tools/audit_pages_features.py --check --check-regressions
          python tools/build_actions_prospectus.py --check --check-buttons
          python tools/build_file_prospectus.py --check
          python tools/sync_freecodecamp_learning_inventory.py --check
          python tools/build_division_huggingface_taxonomy_map.py --check
          python tools/build_division_resource_readiness_map.py --check
          python tools/generate_command_center_data.py --check
          python -m unittest tests.test_command_center_data
          python tools/audit_markdown_implementation_gaps.py --check
          python tools/validate_buddy_engineering_capabilities.py
          python tools/validate_dreamco_mastery_registry.py
          python -m unittest tests.test_buddy_ci_safe_repair_workflow
          python -m unittest tests.test_buddy_safe_repair tests.test_buddy_failure_learning tests.test_buddy_dataset_routing tests.test_division_model_fleet tests.test_dreamco_division_mastery_orchestrator tests.test_buddy_dataset_route_check tests.test_file_prospectus_inventory tests.test_issue_lifecycle tests.test_actions_live_health tests.test_daily_bot_study_scan tests.test_dependency_review_scope tests.test_markdown_implementation_gaps tests.test_markdown_gap_audit_workflow_safety tests.test_freecodecamp_learning_inventory tests.test_buddy_continuous_study_policy tests.test_buddy_universal_library_registry tests.test_division_huggingface_taxonomy_map tests.test_division_resource_readiness
          git diff --check
      - name: Verify canonical fleet catalog
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Full System Certification'
        run: npm run buddy:fleet
      - name: Verify canonical fleet end-to-end evidence
        if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Full System Certification')
        run: npm run buddy:fleet:e2e
      - name: Detect allowlisted generated changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          for path in artifacts/buddy-dataset-hub/dataset-routes.json artifacts/division-model-fleet config/generated/file-prospectus config/bots/bot-manifests.generated.json config/bots/division-manifests.generated.json config/generated/markdown-implementation-gap-audit.json website/data/markdown-implementation-gap-audit.json reports/MARKDOWN_IMPLEMENTATION_GAP_AUDIT.md config/buddy/run-with-buddy.generated.json config/generated/actions-prospectus.json  website/data/actions-health-report.json website/data/actions-prospectus.json website/data/run-prospectus.json website/data/run-prospectus-bots.json website/data/pages-connection-index.json website/data/pages-feature-audit.json reports/PAGES_FEATURE_AUDIT.md command-center/data website/data/command-center website/data/fleet-runtime-status.json website/data/bot-fleet-e2e.json reports/BOT_FLEET_E2E.md website/data/buddy-capability-certifications.js website/data/bot-capability-tests config/master_bot_registry.json config/generated/bots.catalog.json website/data/bot-fleet-catalog.json website/data/buddy-routing-index.js website/data/bot-fleet reports/BOT_FLEET_PROSPECTUS.md config/freecodecamp-complete-learning-path.json config/buddy-continuous-study-policy.json config/generated/division-huggingface-taxonomy-map.json config/generated/division-resource-readiness-map.json; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No allowlisted generated artifacts needed repair."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi
      - name: Commit and publish verified generated repairs
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ format('buddy-ci-repair-{0}', github.event.workflow_run.id || github.run_id) }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$REPAIR_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): apply verified allowlisted DreamCo repair"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null -c http.extraheader="AUTHORIZATION: basic $AUTH" push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$REPAIR_BRANCH"
          printf 'Verified generated repairs are available on [%s](https://github.com/%s/tree/%s).\n' "$REPAIR_BRANCH" "$GITHUB_REPOSITORY" "$REPAIR_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "The repository blocks GITHUB_TOKEN pull-request creation; open a review PR from this branch." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-safe-repair-${{ github.run_id }}
          path: artifacts/buddy-safe-repair/
          if-no-files-found: warn
          retention-days: 30
