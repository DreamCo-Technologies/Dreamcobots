name: DreamCo Verified Goals Contract
on:
  pull_request:
    paths:
      - 'config/dreamco-verified-goals-2027.json'
      - 'docs/DREAMCO_2027_VERIFIED_DELIVERY_PROGRAM.md'
      - 'tests/test_dreamco_verified_goals_2027.py'
      - '.github/workflows/dreamco-verified-goals-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_dreamco_verified_goals_2027.py' -v
