name: Deploy Buddy Website

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - buddy-rebuild-v2
      - codex/master-capability-pages
    paths:
      - "website/**"
      - "docs/**"
      - "tools/build_buddy_public_site.py"
      - "tools/audit_actions_health.py"
      - "tools/audit_actions_live.py"
      - "tools/build_actions_prospectus.py"
      - "tools/problem_registry.py"
      - "tools/auto_repair_policy.py"
      - "tools/build_manufacturer_marketplace_catalog.py"
      - "tools/check_deployment_cost_policy.py"
      - "tools/generate_buddy_model_router.py"
      - "tools/check_buddy_model_benchmarks.mjs"
      - "tools/generate_buddy_distribution_catalog.py"
      - "tools/generate_repository_test_registry.py"
      - "tools/generate_dreamco_repository_master_map.py"
      - "tools/generate_repository_guide.py"
      - "tools/connect_repository_pages.py"
      - "tools/generate_master_directive_status.py"
      - "tools/generate_command_center_data.py"
      - "tools/normalize_legacy_portfolios.py"
      - "tools/place_original_bots.py"
      - "original-bots/**"
      - "bots/**"
      - "config/project-feature-coverage.json"
      - "tools/generate_resource_connection_catalog.py"
      - "tools/generate_buddy_expert_mode.py"
      - "command-center/data/**"
      - "docs/DREAMCO_BUDDY_MASTER_CODEX_DIRECTIVE.md"
      - "config/**"
      - ".github/workflows/deploy-buddy-pages.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dreamco-github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Refresh Actions health and prospectus data for Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p config/generated reports website/data
          python3 tools/audit_actions_health.py
          python3 tools/audit_actions_live.py
          python3 tools/problem_registry.py
          python3 tools/auto_repair_policy.py config/generated/problem-registry.json
          python3 tools/build_actions_prospectus.py
      - name: Run deployment preflight
        run: |
          python3 tools/check_deployment_cost_policy.py
          python3 tools/generate_buddy_model_router.py --check
          node tools/check_buddy_model_benchmarks.mjs
          node tools/check_buddy_demand_ontology.mjs
          python3 tools/generate_buddy_distribution_catalog.py --check
          python3 tools/generate_repository_test_registry.py
          python3 tools/generate_repository_guide.py
          python3 tools/generate_connection_indexes.py --check
          python3 -m unittest tests.test_repository_guide tests.test_repository_master_map
          python3 tools/generate_dreamco_repository_master_map.py
          python3 tools/generate_master_directive_status.py
          python3 tools/generate_command_center_data.py
          python3 tools/generate_command_center_data.py --check
          python3 tools/generate_resource_connection_catalog.py
          python3 tools/generate_resource_connection_catalog.py --check
          python3 tools/generate_opportunity_hub.py --check
          python3 tools/generate_setup_center.py --check
          python3 tools/build_buddy_learning_os_connection_graph.py
          python3 tools/generate_buddy_expert_mode.py
          python3 tools/generate_buddy_benchmark_index.py --check
          python3 tools/generate_buddy_open_model_lab.py --check
          python3 tools/generate_buddy_learning_strategies.py --check
          python3 tools/build_manufacturer_marketplace_catalog.py
          python3 tools/connect_repository_pages.py
          python3 tools/connect_repository_pages.py --check
          python3 -m unittest tests.test_repository_browser tests.test_legacy_portfolios tests.test_branch_health_public_report
          python3 tools/build_buddy_public_site.py --check
          npm run test:actions-page
          npm run test:buddy-open-core
          npm run test:expert-mode
          node --test tests/benchmark-tracker-page.test.mjs tests/service-worker-benchmark-cache.test.mjs
          test -s website/manufacturer-marketplace.html
          test -s website/data/manufacturer-marketplace.json
          test -s website/data/repository-master-map.json
          test -s website/data/actions-health-report.json
          test -s website/data/actions-live-health.json
          test -s website/data/master-directive-status.json
          test -s website/data/buddy-learning-os-connections.json
          test -s website/data/buddy-expert-mode.js
          test -s website/buddy-expert-mode.html
          test -s website/buddy-invention-lab.html
          test -s website/data/actions-prospectus.json
          test -s website/data/problem-registry.json
      - name: Check generated Actions data contracts
        run: |
          python3 -m json.tool website/data/actions-prospectus.json >/dev/null
          python3 -m json.tool website/data/problem-registry.json >/dev/null
          python3 -m json.tool website/data/actions-health-report.json >/dev/null
          python3 -m json.tool website/data/actions-live-health.json >/dev/null
      - name: Check browser JavaScript syntax
        run: |
          node --check website/buddy.js
          node --check website/install.js
          node --check website/studio.js
          node --check website/models.js
          node --check website/benchmark-tracker.js
          node --check website/data-control.js
          node --check website/open-model-lab.js
          node --check website/test-center.js
          node --check website/actions.js
          node --check website/page-actions.js
          node --check website/nav.js
          node --check website/chat-data.js
          node --check website/desk-chrome.js
          node --check website/hub.js
          node --check website/learn-hf.js
          node --check website/tasks.js
          node --check website/os.js
          node --check website/goals.js
          node --check website/service-worker.js
          node --check website/master-build.js
          node --check website/buddy-command-center.js
          node --check website/repositories.js
          node --check website/project-conversations.js
          node --check website/buddy-model-lab.js
          node --check website/buddy-model-worker.js
          node --check website/world-lens.js
          node --check website/family-circle.js
          node --check website/resource-211.js
          node --check website/voice-command-center.js
          node --check website/world-source-center.js
          node --check website/my-buddy.js
          node --check website/independence-center.js
          node --check website/buddy-workspace.js
          node --check website/resource-connection-center.js
          node --check website/sign-in.js
          node --check website/buddy-open-core.js
          node --check website/buddy-learning-lab.js
          node --check website/buddy-expert-mode.js
          node --check website/buddy-invention-lab.js
          node --check website/opportunity-hub.js
          node --check website/setup-center.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build rendered documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Combine documentation and Buddy website
        run: |
          mkdir -p public_site
          cp -a _site/. public_site/
          rsync -a website/ public_site/
          touch public_site/.nojekyll
          test -s public_site/index.html
          test -s public_site/repositories.html
          test -s public_site/project-conversations.html
          test -s public_site/buddy-model-lab.html
      - name: Upload public website
        uses: actions/upload-pages-artifact@v5
        with:
          path: public_site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
