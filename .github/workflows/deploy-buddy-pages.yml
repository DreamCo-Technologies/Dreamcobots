name: Deploy Buddy Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - buddy-rebuild-v2
    paths:
      - "website/**"
      - "tools/build_buddy_public_site.py"
      - "tools/check_deployment_cost_policy.py"
      - "tools/generate_buddy_model_router.py"
      - "tools/check_buddy_model_benchmarks.mjs"
      - "tools/generate_buddy_distribution_catalog.py"
      - "tools/generate_repository_test_registry.py"
      - "config/**"
      - ".github/workflows/deploy-buddy-pages.yml"

permissions:
  contents: read

concurrency:
  group: buddy-github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run deployment preflight
        run: |
          python3 tools/check_deployment_cost_policy.py
          python3 tools/generate_buddy_model_router.py --check
          node tools/check_buddy_model_benchmarks.mjs
          python3 tools/generate_buddy_distribution_catalog.py --check
          # Pages should reflect the exact checked-out commit. Regenerate the derived
          # repository inventory inside the build rather than failing only because a
          # newly added source file has not yet had its generated snapshot committed.
          python3 tools/generate_repository_test_registry.py
          python3 tools/build_buddy_public_site.py --check

      - name: Check browser JavaScript syntax
        run: |
          node --check website/buddy.js
          node --check website/install.js
          node --check website/studio.js
          node --check website/models.js
          node --check website/data-control.js
          node --check website/open-model-lab.js
          node --check website/test-center.js
          node --check website/page-actions.js
          node --check website/nav.js
          node --check website/service-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload public website only
        uses: actions/upload-pages-artifact@v5
        with:
          path: website
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
