name: Division Owner Review Queue
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/division-owner-review-queue.yml"
      - "tools/build_division_owner_review_queue.py"
      - "config/generated/division-resource-readiness-map.json"
      - "config/generated/division-reconciliation.json"
      - "config/division-reconciliation-policy.json"
      - "website/data/masterbot-homepage-featured.json"
  pull_request:
    paths:
      - ".github/workflows/division-owner-review-queue.yml"
      - "tools/build_division_owner_review_queue.py"
      - "tests/test_division_owner_review_queue.py"
      - "config/generated/division-resource-readiness-map.json"
      - "config/generated/division-reconciliation.json"
      - "config/division-reconciliation-policy.json"
      - "website/data/masterbot-homepage-featured.json"
  schedule:
    - cron: "41 8 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: division-owner-review-queue
  cancel-in-progress: false
jobs:
  generate-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and validate owner review queue
        run: |
          python tools/build_division_owner_review_queue.py
          python tools/build_division_owner_review_queue.py --check
          python -m unittest discover -s tests -p 'test_division_owner_review_queue.py' -v
      - name: Propose updated review queue
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/division-owner-review-queue
          delete-branch: false
          add-paths: config/generated/division-owner-review-queue.json
          commit-message: "chore: refresh division owner review queue"
          title: "chore: refresh division owner review queue"
          body: |
            Generated from the current division resource readiness map and division reconciliation.
            Shared platform roles are not assigned a primary domain. Supplemental collaborator links remain proposed and unapproved.
