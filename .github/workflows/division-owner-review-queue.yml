name: Division Owner Review Queue
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/division-owner-review-queue.yml"
      - "tools/build_division_owner_review_queue.py"
      - "config/generated/division-resource-readiness-map.json"
      - "config/generated/division-reconciliation.json"
      - "config/division-reconciliation-policy.json"
      - "website/data/masterbot-homepage-featured.json"
  pull_request:
    paths:
      - ".github/workflows/division-owner-review-queue.yml"
      - "tools/build_division_owner_review_queue.py"
      - "tests/test_division_owner_review_queue.py"
      - "config/generated/division-resource-readiness-map.json"
      - "config/generated/division-reconciliation.json"
      - "config/division-reconciliation-policy.json"
      - "website/data/masterbot-homepage-featured.json"
  schedule:
    - cron: "41 8 * * *"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: division-owner-review-queue
  cancel-in-progress: false
jobs:
  generate-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and validate owner review queue
        run: |
          python tools/build_division_owner_review_queue.py
          python tools/build_division_owner_review_queue.py --check
          python -m unittest discover -s tests -p 'test_division_owner_review_queue.py' -v
      - name: Snapshot generated queue before PR proposal
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/division-owner-review-queue"
          cp config/generated/division-owner-review-queue.json "$RUNNER_TEMP/division-owner-review-queue/division-owner-review-queue.json"
      - name: Propose updated review queue
        id: propose
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/division-owner-review-queue
          delete-branch: false
          add-paths: config/generated/division-owner-review-queue.json
          commit-message: "chore: refresh division owner review queue"
          title: "chore: refresh division owner review queue"
          body: |
            Generated from the current division resource readiness map and division reconciliation.
            Shared platform roles are not assigned a primary domain. Supplemental collaborator links remain proposed and unapproved.
      - name: Preserve generated review queue when PR creation is policy-blocked
        if: github.event_name != 'pull_request' && steps.propose.outcome == 'failure'
        run: |
          echo "::warning::The repository policy rejected pull-request creation with GITHUB_TOKEN. The generated review queue is preserved as an artifact for manual review; no owner approval is inferred."
          echo "The generated division-owner-review-queue.json is available in the workflow artifact because this repository does not permit Actions to create pull requests with GITHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload generated owner review queue for manual review
        if: github.event_name != 'pull_request' && steps.propose.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: division-owner-review-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/division-owner-review-queue/division-owner-review-queue.json
          if-no-files-found: error
          retention-days: 30
