name: Repository Test Matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Refresh derived fleet quality program for this exact commit
        run: npx tsx tools/generate_buddy_fleet_quality_program.ts
      - name: Refresh derived repository registry after all generators
        run: python3 tools/generate_repository_test_registry.py
      - name: Run DreamCo Universal Verification Engine
        run: npx tsx tools/run_universal_verification.ts
