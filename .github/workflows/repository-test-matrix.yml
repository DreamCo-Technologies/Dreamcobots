name: Repository Test Matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "client/**"
      - "website/**"
      - "tools/**"
      - "tests/**"
      - "config/**"
      - "App_bots/**"
      - ".github/agents/**"
      - "package.json"
      - ".github/workflows/repository-test-matrix.yml"
  pull_request:
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: repository-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governed-local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile DreamCo Model Foundry source and entry points
        run: python -m compileall -q buddy/learning/model_foundry.py tools/build_division_training_matrix.py tools/train_buddy_division_model.py tools/build_model_release_candidate.py
      - name: Test Model Foundry rights gate and parallel division planner
        run: python -m unittest discover -s tests -p "test_model_foundry.py" -v
      - name: Validate pretrained model store catalog and publication gates
        run: python tools/validate_pretrained_model_catalog.py --check && python -m unittest tests.test_pretrained_model_catalog -v
      - name: Test evidence-linked model release candidate gates
        run: python -m compileall -q tools/build_model_release_candidate.py && python -m unittest tests.test_model_release_candidate -v
      - run: npm ci
      - name: Verify Buddy model progress center
        run: npm run buddy:model-progress
      - name: Check Actions health
        run: python3 tools/audit_actions_health.py
      - name: Check builder team readiness
        run: npx tsx tools/check_builder_team_readiness.ts
      - name: Validate Buddy personality and acting program
        run: python3 tools/check_buddy_personality_acting_program.py
      - name: Refresh canonical bot fleet catalog
        run: npx tsx tools/generate_bot_fleet_catalog.ts
      - name: Refresh canonical bot fleet catalog
        run: npx tsx tools/generate_bot_fleet_catalog.ts
      - name: Refresh Buddy search index
        run: npx tsx tools/generate_dreamco_search_index.ts
      - name: Refresh Buddy success program
        run: npx tsx tools/generate_buddy_success_program.ts
      - name: Refresh derived fleet quality program for this exact commit
        run: npx tsx tools/generate_buddy_fleet_quality_program.ts
      - name: Audit bot division placement
        run: python3 tools/audit_bot_division_placement.py
      - name: Audit all bots categories divisions and specialist agents
        run: python3 tools/audit_all_bots_categories_and_agents.py
      - name: Regenerate canonical bot runtime manifests before repository inventory
        run: python3 tools/generate_bot_manifests.py
      - name: Refresh derived repository registry after all generators
        run: python3 tools/generate_repository_test_registry.py
      - name: Build bounded public technology radar projection
        run: |
          python3 tools/refresh_buddy_technology_radar.py --project
          python3 tools/refresh_buddy_technology_radar.py --check
          python3 -m unittest tests.test_buddy_technology_radar
      - name: Regenerate canonical bot runtime manifests
        run: python3 tools/generate_bot_manifests.py
      - name: Run DreamCo Universal Verification Engine
        run: npx tsx tools/run_universal_verification.ts
      - name: Save debugging evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-test-${{ github.run_id }}
          path: |
            tmp/dreamco-verification/
            reports/ACTIONS_HEALTH_REPORT.md
            reports/BOT_DIVISION_PLACEMENT_AUDIT.md
            reports/BOT_ACCOUNTING_PLACEMENT_AUDIT.md
            config/generated/actions-health-report.json
            config/generated/bot-division-placement-audit.json
            config/generated/bot-accounting-placement-audit.json
          if-no-files-found: ignore
          retention-days: 7
