name: DreamCo Five-Minute Goal and Division Pulse

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamco-five-minute-goal-pulse
  cancel-in-progress: true

jobs:
  goal-division-pulse:
    name: Repository divisions, Markdown goals and evidence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate master directive progress
        run: python3 tools/generate_master_directive_status.py
      - name: Generate repository and division source map
        run: python3 tools/generate_dreamco_repository_master_map.py
      - name: Generate repository-wide test registry
        run: python3 tools/generate_repository_test_registry.py
      - name: Run repository goal and capability scan
        run: python3 tools/dreamco_daily_scan.py --action daily-scan
      - name: Verify invention hub and specialist page contracts
        run: |
          python3 tools/build_bot_profile_pages.py
          python3 tools/build_invention_hub.py
          node --test tests/invention-hub.test.mjs
      - name: Publish pulse summary
        if: always()
        run: |
          echo "## DreamCo five-minute goal and division pulse" >> "$GITHUB_STEP_SUMMARY"
          echo "This run inventories documented goals, division sources, repository capabilities, test registrations and invention/profile page contracts." >> "$GITHUB_STEP_SUMMARY"
          echo "File presence and generated pages are not runtime-route, benchmark, or production verification." >> "$GITHUB_STEP_SUMMARY"
          if [ -d artifacts/daily-scan ]; then find artifacts/daily-scan -maxdepth 2 -type f -print >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain evidence snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamco-five-minute-goal-pulse-${{ github.run_id }}
          path: |
            artifacts/daily-scan/
            config/generated/
            reports/
            website/data/master-directive-status.json
          if-no-files-found: warn
          retention-days: 30
