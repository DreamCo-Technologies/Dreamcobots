name: DreamCo Five-Minute Rotating Operations

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamco-five-minute-goal-pulse
  cancel-in-progress: false

jobs:
  rotating-operations:
    name: Inventory every specification and advance one workstream
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify deterministic rotation scheduler
        run: python3 -m unittest tests/test_dreamco_rotating_operations.py
      - name: Inventory every tracked Markdown specification and run the current lane
        run: python3 tools/dreamco_rotating_operations.py
      - name: Publish rotation summary
        if: always()
        run: |
          echo "## DreamCo five-minute rotating operations" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/dreamco-rotation/latest.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/dreamco-rotation/latest.json").read_text())
          print(f"- Lane: **{p['lane']['title']}** (`{p['lane']['id']}`)")
          print(f"- Markdown/MDX specifications inventoried: **{p['specification_inventory']['count']}**")
          print(f"- Commands passed: **{p['summary']['passed']}**")
          print(f"- Failed or blocked: **{p['summary']['failed_or_blocked']}**")
          print(f"- Commit: `{p['commit']}`")
          print(f"- Model training executed: **{p['safety']['model_training_executed']}**")
          print(f"- Production deployment performed: **{p['safety']['production_deployment_performed']}**")
          PY
          else
            echo "Rotation report was not produced; inspect the failed scheduler step." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "A successful inventory or catalog check is not proof of runtime, benchmark, or production readiness." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamco-rotation-${{ github.run_id }}
          path: |
            artifacts/dreamco-rotation/
            artifacts/daily-scan/
            config/generated/
            reports/
            website/data/master-directive-status.json
          if-no-files-found: warn
          retention-days: 30
