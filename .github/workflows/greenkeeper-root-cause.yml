name: DreamCo Greenkeeper Root Cause

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: greenkeeper-root-cause-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Collect bounded Keep Green evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/greenkeeper_observations.py --output /tmp/observations.json --max-age-hours 6
      - name: Fingerprint and queue root cause
        run: python3 tools/greenkeeper_root_cause.py --input /tmp/observations.json
      - name: Publish root-cause artifact
        uses: actions/upload-artifact@v7
        with:
          name: dreamco-root-cause-${{ github.run_id }}
          path: artifacts/greenkeeper/root-cause.json
          if-no-files-found: error
          retention-days: 30
