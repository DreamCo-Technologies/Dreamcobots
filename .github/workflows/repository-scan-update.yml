name: Repository Scan Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-scan-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-scan-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build scan update artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-update
          git rev-parse HEAD > scan-update/ref.txt
          git ls-files | wc -l > scan-update/tracked-files.txt
          cat > scan-update/comment.md <<'EOF'
          ## Buddy repository scan update

          **Status:** scan completed for this workflow run.

          ### Scope
          - Repository tracked-file inventory
          - Current commit/ref
          - Scan configuration and benchmark contracts

          ### Evidence
          - Commit: `${GITHUB_SHA}`
          - Workflow run: `${GITHUB_RUN_ID}`

          ### Changes
          No code changes are claimed by this workflow. Findings and fixes must be produced by an authorized scanner and linked to their evidence.

          ### Next steps
          - Run the configured authorized repository scanner.
          - Record findings with severity and reproduction evidence.
          - Convert verified fixes into regression benchmarks.
          - Keep unresolved work explicitly marked pending or blocked.

          > Buddy reports only evidence-backed results.
          EOF

      - name: Publish scan summary to workflow summary
        run: cat scan-update/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan update evidence
        uses: actions/upload-artifact@v6
        with:
          name: repository-scan-update-${{ github.run_id }}
          path: scan-update/
          if-no-files-found: error
          retention-days: 14
