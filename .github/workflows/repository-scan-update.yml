name: Repository Scan Update\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: '17 6 * * 1'\n\npermissions:\n  contents: read\n  issues: write\n\njobs:\n  prepare-scan-update:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n      - name: Build scan update artifact\n        shell: bash\n        run: |\n          mkdir -p scan-update\n          git rev-parse HEAD > scan-update/ref.txt\n          git ls-files | wc -l > scan-update/tracked-files.txt\n          cat > scan-update/comment.md <<'EOF'\n## Buddy repository scan update\n\n**Status:** scan completed for this workflow run.\n\n### Scope\n- Repository tracked-file inventory\n- Current commit/ref\n- Scan configuration and benchmark contracts\n\n### Evidence\n- Commit: `${GITHUB_SHA}`\n- Workflow run: `${GITHUB_RUN_ID}`\n\n### Changes\nNo code changes are claimed by this workflow. Findings and fixes must be produced by an authorized scanner and linked to their evidence.\n\n### Next steps\n- Run the configured authorized repository scanner.\n- Record findings with severity and reproduction evidence.\n- Convert verified fixes into regression benchmarks.\n- Keep unresolved work explicitly marked pending or blocked.\n\n> Buddy reports only evidence-backed results.\nEOF\n      - name: Publish scan summary to workflow summary\n        run: cat scan-update/comment.md >> "$GITHUB_STEP_SUMMARY"\n      - name: Upload scan update evidence\n        uses: actions/upload-artifact@v4\n        with:\n          name: repository-scan-update-${{ github.run_id }}\n          path: scan-update/\n