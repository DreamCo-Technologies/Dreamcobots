name: FreeCodeCamp Study Guide Review Evidence

on:
  pull_request:
    paths:
      - "tools/build_freecodecamp_study_guides.py"
      - "tests/test_freecodecamp_study_guides.py"
      - "docs/bootcamp/FREECODECAMP_STUDY_GUIDE_REVIEW_POLICY.md"
      - ".github/workflows/freecodecamp-study-guide-review-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freecodecamp-guide-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate study guide review evidence without downloading content
        run: |
          python -m unittest tests.test_freecodecamp_study_guides
          python -m py_compile tools/build_freecodecamp_study_guides.py
