name: Buddy Spaced Repetition Tests

on:
  pull_request:
    paths:
      - 'buddy/learning/srs/**'
      - 'requirements-buddy-learning.txt'
      - 'shared/schema.ts'
      - 'migrations/**'
      - 'tests/test_buddy_srs_*.py'
      - 'docs/learning/BUDDY_ADAPTIVE_SPACED_REPETITION.md'
      - '.github/workflows/buddy-spaced-repetition-tests.yml'
  push:
    branches: [main]
    paths:
      - 'buddy/learning/srs/**'
      - 'tests/test_buddy_srs_*.py'
      - 'docs/learning/BUDDY_ADAPTIVE_SPACED_REPETITION.md'
      - '.github/workflows/buddy-spaced-repetition-tests.yml'

permissions:
  contents: read

concurrency:
  group: buddy-spaced-repetition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spaced-repetition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned SRS dependencies
        run: python -m pip install --disable-pip-version-check "fsrs==6.3.3" pytest
      - name: Test FSRS-6, Anki Classic profile, SM-2, Leitner and persistence
        run: python -m pytest -q -p no:cacheprovider tests/test_buddy_srs_sm2.py tests/test_buddy_srs_leitner.py tests/test_buddy_srs_fsrs.py tests/test_buddy_srs_anki_classic.py tests/test_buddy_srs_store.py
