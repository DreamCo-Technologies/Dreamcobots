name: Reconcile generated artifacts and dependency fixes

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dreamco-generated-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Regenerate, verify, and propose a repair
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check pyyaml pytest openpyxl

      - name: Apply non-breaking dependency security updates
        run: |
          npm audit fix
          npm audit --audit-level=high

      - name: Regenerate fleet, Actions, and repository prospectuses
        env:
          FULL: "1"
        run: bash tools/regen_fleet_truth.sh

      - name: Verify prospectus and fleet regression suites
        run: |
          python3 -m pytest -q -p no:cacheprovider \
            tests/test_fleet_runtime_executor.py \
            tests/test_fleet_runtime_customize.py \
            tests/test_generate_bot_manifests.py \
            tests/test_fleet_runtime_audit.py \
            tests/test_check_website_links.py \
            tests/test_run_prospectus.py \
            tests/test_file_prospectus.py \
            tests/test_fleet_divisions.py \
            tests/test_pages_feature_audit.py \
            tests/test_build_queue.py
          node --test tests/buddy-run-page.test.mjs tests/actions-page.test.mjs
          python3 tools/build_actions_prospectus.py --check --check-buttons
          python3 tools/build_file_prospectus.py --check
          python3 tools/audit_pages_features.py --check --check-regressions

      - name: Verify published-site build and navigation
        run: |
          npm run buddy:site:check
          npm run build
          python3 tools/check_website_links.py --all

      - name: Open a reviewable pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/generated-artifacts-and-security-repair
          delete-branch: false
          commit-message: "fix: reconcile generated prospectuses and dependency security"
          title: "Fix: reconcile generated artifacts, fleet checks, and dependency security"
          body: |
            ## Automated repository reconciliation

            This PR is generated by the repository's own reproducible repair workflow.

            - Applies non-breaking npm security updates and enforces the high-severity audit gate.
            - Regenerates bot manifests, fleet runtime truth, Actions prospectuses, file prospectuses, and Pages feature audit artifacts.
            - Runs the fleet, prospectus, Pages feature, navigation, and production build checks.
            - Preserves main as the production source; no direct main-branch writes are performed.

            Review the generated diffs and all required checks before merging.
          labels: |
            automation
            dependencies
            github-pages
            verification
          draft: true
