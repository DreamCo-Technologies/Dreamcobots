name: DreamCo Division Lifecycle Migration Contract
on:
  pull_request:
    paths:
      - "buddy/datasets/migrate_division_lifecycle.py"
      - "buddy/datasets/postgres_training_queue.py"
      - "database/migrations/001_division_model_lifecycle.sql"
      - "tests/test_division_lifecycle_migration.py"
      - "tests/test_postgres_training_queue.py"
      - "docs/DREAMCO_POSTGRES_DIVISION_LIFECYCLE_MIGRATION.md"
      - ".github/workflows/dreamco-division-lifecycle-migration.yml"
  push:
    branches: [main]
    paths:
      - "buddy/datasets/migrate_division_lifecycle.py"
      - "database/migrations/001_division_model_lifecycle.sql"
      - "tests/test_division_lifecycle_migration.py"
permissions:
  contents: read
jobs:
  migration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate guarded 65-schema migration contract
        run: python -m unittest discover -s tests -p 'test_*training_queue.py' -v && python -m unittest discover -s tests -p 'test_division_lifecycle_migration.py' -v
