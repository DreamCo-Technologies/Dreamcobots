name: FreeCodeCamp Complete Study Guide Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * 1"
  pull_request:
    paths:
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "config/divisions/**"
      - "config/masterbot-65-registry.json"
      - "config/generated/masterbot-55-domain-crosswalk.json"
      - "config/freecodecamp-division-category-profiles.json"
      - "config/freecodecamp-division-routing-overrides.json"
      - "config/buddy-division-specialist-course-artifacts.json"
      - "tools/audit_freecodecamp_division_video_coverage.py"
      - "tests/test_freecodecamp_division_video_coverage_audit.py"
      - "tests/test_buddy_learning_runtime_bridge.py"
      - "tests/test_buddy_course_track_registry.py"
      - "tests/test_freecodecamp_specialist_routing.py"
      - "buddy/learning/runtime_bridge.py"
      - "buddy/learning/course_track_registry.py"
      - "config/buddy-course-track-registry.json"
      - "config/freecodecamp-division-routing-overrides.json"
      - "config/authorized-transcripts/**"
      - "config/freecodecamp-complete-learning-path.json"
      - "config/freecodecamp-detailed-video-study-guide.schema.json"
      - "tools/build_freecodecamp_study_guides.py"
      - "tools/sync_freecodecamp_catalog.py"
      - "tests/test_freecodecamp_study_guides.py"
      - "tests/test_freecodecamp_catalog_categories.py"
      - ".github/workflows/freecodecamp-study-guide-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "config/freecodecamp-division-routing-overrides.json"
      - "config/buddy-course-track-registry.json"
      - "buddy/learning/course_track_registry.py"
      - "buddy/learning/runtime_bridge.py"
      - "tests/test_freecodecamp_specialist_routing.py"
      - "tests/test_buddy_course_track_registry.py"
      - "tests/test_buddy_learning_runtime_bridge.py"
      - "config/authorized-transcripts/**"
      - "config/freecodecamp-complete-learning-path.json"
      - "config/freecodecamp-detailed-video-study-guide.schema.json"
      - "tools/build_freecodecamp_study_guides.py"
      - "tests/test_freecodecamp_study_guides.py"
      - ".github/workflows/freecodecamp-study-guide-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: freecodecamp-study-guides-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-complete-video-guide-coverage:
    if: github.repository == 'DreamCo-Technologies/Dreamcobots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate guide queue and rights gates
        run: python -m unittest discover -s tests -p 'test_freecodecamp_study_guides.py' -v
      - name: Validate FreeCodeCamp catalog taxonomy
        run: python -m unittest discover -s tests -p 'test_freecodecamp_catalog_categories.py' -v
      - name: Validate specialist division routing and rights-aware authoring backlog
        run: python -m unittest discover -s tests -p 'test_freecodecamp_specialist_routing.py' -v
      - name: Test division and video inventory audit
        run: python -m unittest discover -s tests -p 'test_freecodecamp_division_video_coverage_audit.py' -v
      - name: Generate truthful division and video coverage report (not certification)
        run: |
          python tools/audit_freecodecamp_division_video_coverage.py --output "$RUNNER_TEMP/freecodecamp-division-video-coverage.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/freecodecamp-division-video-coverage.json").read_text())
          summary = {
              "status": report["status"],
              "video_rows": report["catalog"]["video_rows"],
              "unclassified_video_count": report["catalog"]["unclassified_video_count"],
              "division_config_counts": report["division_coverage"]["division_config_counts"],
              "missing_division_config_ids": [row["domain_id"] for row in report["division_coverage"]["configs"] if row["status"] == "missing"],
              "incomplete_division_config_ids": [row["domain_id"] for row in report["division_coverage"]["configs"] if row["status"] == "incomplete"],
              "required_artifact_slots": report["specialist_curriculum"]["required_artifact_slots"],
              "missing_artifact_slots": report["specialist_curriculum"]["missing_artifact_slots"],
              "blockers": report["blockers"],
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("FreeCodeCamp division/video coverage audit\n\n")
              stream.write("Inventory report only; not a study, mastery, ownership, or production certification.\n\n")
              stream.write(json.dumps(summary, indent=2) + "\n")
          PY
      - name: Upload division and video coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecodecamp-division-video-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/freecodecamp-division-video-coverage.json
          if-no-files-found: warn
          retention-days: 30
      - name: Build per-video guide queue
        run: python tools/build_freecodecamp_study_guides.py --out-dir "$RUNNER_TEMP/freecodecamp-study-guides"
      - name: Publish coverage truth
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/freecodecamp-study-guides/summary.json" ]; then
            cat "$RUNNER_TEMP/freecodecamp-study-guides/summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Study guide queue not generated; coverage is unverified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload per-video work queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecodecamp-study-guide-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/freecodecamp-study-guides/
          if-no-files-found: warn
          retention-days: 30
