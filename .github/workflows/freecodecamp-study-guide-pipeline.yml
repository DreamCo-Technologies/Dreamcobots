name: FreeCodeCamp Complete Study Guide Coverage
on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * 1"
  pull_request:
    paths:
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "config/freecodecamp-division-routing-overrides.json"
      - "buddy/learning/course_track_registry.py"
      - "tests/test_freecodecamp_specialist_routing.py"
      - "config/authorized-transcripts/**"
      - "config/freecodecamp-complete-learning-path.json"
      - "config/freecodecamp-detailed-video-study-guide.schema.json"
      - "tools/build_freecodecamp_study_guides.py"
      - "tests/test_freecodecamp_study_guides.py"
      - ".github/workflows/freecodecamp-study-guide-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "config/freecodecamp-division-routing-overrides.json"
      - "buddy/learning/course_track_registry.py"
      - "tests/test_freecodecamp_specialist_routing.py"
      - "config/authorized-transcripts/**"
      - "config/freecodecamp-complete-learning-path.json"
      - "config/freecodecamp-detailed-video-study-guide.schema.json"
      - "tools/build_freecodecamp_study_guides.py"
      - "tests/test_freecodecamp_study_guides.py"
      - ".github/workflows/freecodecamp-study-guide-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: freecodecamp-study-guides-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-complete-video-guide-coverage:
    if: github.repository == 'DreamCo-Technologies/Dreamcobots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public metadata enumerator
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Discover and verify complete public video inventory
        run: |
          python tools/sync_freecodecamp_catalog.py --out "$RUNNER_TEMP/freecodecamp-catalog-verified.json"
          python tools/sync_freecodecamp_catalog.py --check --out "$RUNNER_TEMP/freecodecamp-catalog-verified.json"
      - name: Validate guide queue and rights gates
        run: python -m unittest discover -s tests -p 'test_freecodecamp_study_guides.py' -v
      - name: Validate specialist division routing and Buddy demonstrations
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python -m unittest discover -s tests -p 'test_freecodecamp_specialist_routing.py' -v
      - name: Build per-video guide queue from verified inventory
        run: python tools/build_freecodecamp_study_guides.py --catalog "$RUNNER_TEMP/freecodecamp-catalog-verified.json" --out-dir "$RUNNER_TEMP/freecodecamp-study-guides"
      - name: Publish coverage truth
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/freecodecamp-study-guides/summary.json" ]; then
            cat "$RUNNER_TEMP/freecodecamp-study-guides/summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Study guide queue not generated; coverage is unverified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verified public catalog metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecodecamp-metadata-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/freecodecamp-catalog-verified.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload per-video work queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecodecamp-study-guide-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/freecodecamp-study-guides/
          if-no-files-found: warn
          retention-days: 30
