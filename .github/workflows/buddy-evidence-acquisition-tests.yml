name: Buddy Evidence Acquisition Tests
on:
  pull_request:
    paths:
      - 'buddy/learning/evidence_acquisition.py'
      - 'tests/test_buddy_evidence_acquisition.py'
      - '.github/workflows/buddy-evidence-acquisition-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_buddy_evidence_acquisition.py' -v
