name: Repository Revamp

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "App_bots/**"
      - "config/dreamco-essential-master-bots.json"
      - "config/dreamco-must-have-subbot-team.json"
      - "config/buddy-personal-data-fabric.json"
      - "server/subbot-team-engine.ts"
      - "server/unified-worker-runtime.ts"
      - "server/personal-data-fabric.ts"
      - "tests/subbot-team-engine.test.ts"
      - "tests/personal-data-fabric.test.ts"
      - "tools/build_actions_control_center.py"
      - "tools/build_repository_revolution_map.py"
      - "website/actions.html"
      - "website/revamp.html"
      - ".github/workflows/repository-revamp.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "App_bots/**"
      - "config/dreamco-essential-master-bots.json"
      - "config/dreamco-must-have-subbot-team.json"
      - "config/buddy-personal-data-fabric.json"
      - "server/subbot-team-engine.ts"
      - "server/unified-worker-runtime.ts"
      - "server/personal-data-fabric.ts"
      - "tests/subbot-team-engine.test.ts"
      - "tests/personal-data-fabric.test.ts"
      - "tools/build_actions_control_center.py"
      - "tools/build_repository_revolution_map.py"
      - "website/actions.html"
      - "website/revamp.html"
      - ".github/workflows/repository-revamp.yml"

permissions:
  contents: read

concurrency:
  group: repository-revamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Explain this action
        run: |
          {
            echo "# Repository Revamp"
            echo
            echo "**Owner:** Rebuilds the plain-English Actions Center and the every-file/every-bot repository makeover map, then verifies master/sub-bot and personal-data contracts."
            echo
            echo "**Users:** Checks that personalization stays user-owned and that Buddy's visible experience stays connected to tested repository evidence."
            echo
            echo "**Developers:** Regenerates repository inventory, 30-upgrade category contracts, workflow runbooks, and typed runtime tests."
            echo
            echo "**Investors:** Produces evidence for repository scale, operational discipline, portability, and product governance rather than relying on bot-count claims."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Check Actions definitions first
        run: python3 tools/audit_actions_health.py
      - name: Rebuild owner-facing Actions Control Center
        run: python3 tools/build_actions_control_center.py
      - name: Build every-item every-file every-bot revamp map
        run: python3 tools/build_repository_revolution_map.py
      - name: Verify 30-upgrade category contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('website/data/repository-revamp-map.json').read_text())
          assert d['category_count'] == 15
          assert d['upgrades_per_category'] == 30
          assert all(row['upgrade_count'] == 30 for row in d['categories'])
          assert d['file_count'] == len(d['files'])
          assert d['bot_count'] == len(d['bots'])
          assert d['division_master_count'] == 45
          assert d['bot_count'] == 1051
          print({'root_items':d['root_item_count'],'files':d['file_count'],'bots':d['bot_count'],'upgrade_contracts':d['total_category_upgrade_contracts']})
          PY
      - name: Verify every worker can build task-scoped sub-bot teams
        run: node --import tsx --test tests/subbot-team-engine.test.ts
      - name: Verify user-owned personal data fabric
        run: node --import tsx --test tests/personal-data-fabric.test.ts
      - name: Build reversible master-bot consolidation evidence
        run: python3 tools/build_master_bot_consolidation.py
      - name: Add owner summaries
        if: always()
        run: |
          cat reports/ACTIONS_CONTROL_CENTER.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"
          cat reports/REPOSITORY_REVAMP_MAP.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo >> "$GITHUB_STEP_SUMMARY"
          cat reports/MASTER_BOT_CONSOLIDATION.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Save revamp evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-revamp-${{ github.run_id }}
          path: |
            website/data/actions-control-center.json
            website/data/repository-revamp-map.json
            config/generated/master-bot-consolidation.json
            reports/ACTIONS_CONTROL_CENTER.md
            reports/REPOSITORY_REVAMP_MAP.md
            reports/MASTER_BOT_CONSOLIDATION.md
            reports/ACTIONS_HEALTH_REPORT.md
          if-no-files-found: warn
          retention-days: 14
