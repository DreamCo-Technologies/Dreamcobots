name: DreamCo Live Dashboard

on:
  workflow_dispatch:
    inputs:
      module:
        description: "What should the dashboard check?"
        required: true
        default: "all"
        type: choice
        options: [all, buddy, fleet, resources, website, actions]
  push:
    branches: [main]
    paths:
      - "App_bots/**"
      - "shared/**"
      - "config/**"
      - "server/**"
      - "website/**"
      - "tools/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/dreamco-live-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: dreamco-live-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Run current DreamCo checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tmp/live-dashboard
          module="${{ inputs.module || 'all' }}"
          case "$module" in
            actions)
              python3 tools/audit_actions_health.py
              ;;
            buddy)
              npm run easy:check
              ;;
            fleet)
              npm run easy:fleet
              ;;
            resources)
              npm run easy:resources
              ;;
            website)
              npm run buddy:site:check
              ;;
            all)
              python3 tools/audit_actions_health.py
              python3 tools/audit_bot_division_placement.py
              python3 tools/build_resource_sandbox_matrix.py
              node --import tsx --test tests/buddy-resource-sandbox.test.ts
              npx tsx tools/run_universal_verification.ts --quick
              ;;
          esac 2>&1 | tee tmp/live-dashboard/dashboard.log
      - name: Create dashboard summary
        if: always()
        run: |
          {
            echo "# DreamCo Live Dashboard"
            echo
            echo "Module: **${{ inputs.module || 'all' }}**"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "## Last output"
            echo '```text'
            tail -n 160 tmp/live-dashboard/dashboard.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dreamco-live-dashboard-${{ github.run_id }}
          path: |
            tmp/live-dashboard/
            reports/ACTIONS_HEALTH_REPORT.md
            reports/BOT_DIVISION_PLACEMENT_AUDIT.md
            config/generated/actions-health-report.json
            config/generated/bot-division-placement-audit.json
            config/generated/resource-sandbox-test-matrix.json
          if-no-files-found: ignore
          retention-days: 7
