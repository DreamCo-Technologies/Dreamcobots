name: Buddy Distill Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/buddy-distill-contract.json"
      - "schemas/buddy-distill-evidence.schema.json"
      - "evidence/distill/**"
      - "tools/check_buddy_distill_gate.py"
      - "tests/test_check_buddy_distill_gate.py"
      - ".github/workflows/buddy-distill-gate.yml"
  push:
    branches: [main]
    paths:
      - "config/buddy-distill-contract.json"
      - "evidence/distill/**"
      - "tools/check_buddy_distill_gate.py"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # stdlib only: no pip install, no model downloads, no secrets, no training
      - name: Distill gate (fail closed)
        run: python3 tools/check_buddy_distill_gate.py
      - name: Gate unit tests
        run: python3 -m unittest tests.test_check_buddy_distill_gate -v
