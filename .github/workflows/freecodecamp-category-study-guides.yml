name: FreeCodeCamp Category Study Guides
on:
  pull_request:
    paths:
      - "buddy/bootcamp/sources/freecodecamp/catalog.json"
      - "config/buddy-freecodecamp-22-category-study-guides.json"
      - "tools/validate_buddy_freecodecamp_category_guides.py"
      - "tests/test_buddy_freecodecamp_category_guides.py"
      - ".github/workflows/freecodecamp-category-study-guides.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freecodecamp-category-guides-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_buddy_freecodecamp_category_guides.py
      - run: python tools/validate_buddy_freecodecamp_category_guides.py
