name: Buddy Markdown Implementation Gap Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"
  push:
    paths:
      - "**/*.md"
      - "config/buddy/markdown-implementation-gap-policy.json"
      - "tools/audit_markdown_implementation_gaps.py"
      - ".github/workflows/buddy-markdown-gap-audit.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: buddy-markdown-gap-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate Markdown-to-code gap inventory
        run: python3 tools/audit_markdown_implementation_gaps.py --write
      - name: Verify generated audit
        run: |
          python3 tools/audit_markdown_implementation_gaps.py --check
          python3 -m unittest tests.test_markdown_implementation_gaps
      - name: Propose current gap inventory
        if: success() && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: bot/markdown-gap-audit
          delete-branch: false
          commit-message: "audit: refresh Markdown implementation gap inventory"
          title: "audit: refresh Markdown implementation gap inventory"
          body: |
            ## Generated Markdown implementation-gap inventory

            This pull request contains only the verified outputs of the Markdown-to-code audit.
            The audit and regression tests passed before this proposal was opened.
            Missing implementation, test, and runtime evidence remains explicitly unverified.
