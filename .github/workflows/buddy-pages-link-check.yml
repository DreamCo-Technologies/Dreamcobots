name: Buddy Pages Link Check

# Read-only check of the static Pages site in website/: broken internal references,
# missing titles, secret-like content (tools/build_buddy_public_site.py --check), plus
# the nav link checker from PR #12921 when it is present. Dispatchable by the Buddy
# command router as job `pages_link_check`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "website/**"
      - "tools/build_buddy_public_site.py"
      - "tools/check_website_links.py"
      - ".github/workflows/buddy-pages-link-check.yml"

permissions:
  contents: read

concurrency:
  group: buddy-pages-link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Public-site preflight (internal links, titles, secret patterns)
        run: python3 tools/build_buddy_public_site.py --check
      - name: Nav link checker (PR #12921)
        if: always()
        shell: bash
        run: |
          if [ -f tools/check_website_links.py ]; then
            python3 tools/check_website_links.py --site website
          else
            echo "::notice::tools/check_website_links.py is not on this ref yet (PR #12921); preflight above still covers internal references"
          fi
      - name: Buddy control-plane registry is valid and published
        if: always()
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/buddy_control_plane.py check
          python3 tools/buddy_control_plane.py publish-registry --check
