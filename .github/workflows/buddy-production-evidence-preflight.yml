name: Buddy Production Evidence Preflight
on:
  pull_request:
    paths:
      - 'website/**'
      - 'config/**'
      - 'tools/**'
      - 'tests/**'
      - 'reports/**'
      - '.github/workflows/buddy-production-evidence-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buddy-evidence-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Dependency manifest integrity
        run: python3 tools/check_repository_dependencies.py
      - name: Bootcamp generated artifacts and evidence
        run: python3 tools/generate_professional_bootcamp.py --check
      - name: Public Pages preflight
        run: python3 tools/build_buddy_public_site.py --check
      - name: Command center inventory integrity
        run: python3 tools/generate_command_center_data.py --check
      - name: Bootcamp contract tests
        run: python3 -m unittest -v tests.test_professional_training
      - name: Public claim trust gate
        run: python3 tools/check_frontier_claim_trust_gates.py
