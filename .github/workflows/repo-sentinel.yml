name: Repo Sentinel and FreeCodeCamp Delta Sync

on:
  pull_request:
    paths:
      - "stages/00_catalog_sync/**"
      - "stages/08_repo_sentinel/**"
      - "tests/test_repo_sentinel.py"
      - "tests/test_bootcamp_catalog_policy_stages.py"
      - "stages/01_policy_gate/policy_gate.py"
      - "contracts/license_policy.yaml"
      - ".github/workflows/repo-sentinel.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install catalog policy dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile Sentinel modules
        run: python -m py_compile stages/00_catalog_sync/sync_fcc_catalog.py stages/08_repo_sentinel/ast_consolidator.py stages/08_repo_sentinel/sentinel.py
      - name: Test Sentinel offline
        run: python -m unittest discover -s tests -p 'test_repo_sentinel.py' -v
      - name: Test curriculum factory offline
        run: python -m unittest discover -s tests -p 'test_curriculum_factory.py' -v
      - name: Test catalog and policy gates offline
        run: python -m unittest discover -s tests -p 'test_bootcamp_catalog_policy_stages.py' -v
      - name: Generate audit report without rewriting files or accessing the network
        run: python stages/08_repo_sentinel/sentinel.py --strict-ast --report reports/repo-sentinel/sentinel_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: dreamco-repo-sentinel-audit
          path: reports/repo-sentinel/sentinel_report.json
          if-no-files-found: error
          retention-days: 30

  scheduled-catalog-sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata sync dependencies
        run: python -m pip install --disable-pip-version-check PyYAML yt-dlp
      - name: Prepare review branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          if git ls-remote --exit-code --heads origin bot/fcc-catalog-delta >/dev/null 2>&1; then
            git fetch origin bot/fcc-catalog-delta
            git checkout -B bot/fcc-catalog-delta origin/bot/fcc-catalog-delta
            git merge --no-edit "origin/$DEFAULT_BRANCH"
          else
            git checkout -b bot/fcc-catalog-delta "origin/$DEFAULT_BRANCH"
          fi
      - name: Refresh stale FreeCodeCamp metadata catalog
        run: python stages/08_repo_sentinel/sentinel.py --sync-fcc --report reports/repo-sentinel/sentinel_report.json
      - name: Open or update catalog review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add data/manifests/source_catalog.jsonl
          if git diff --cached --quiet; then
            echo "Catalog is current; no metadata delta to propose."
            exit 0
          fi
          git commit -m "chore(catalog): refresh FreeCodeCamp metadata"
          git push --set-upstream origin bot/fcc-catalog-delta
          pr_number="$(gh pr list --head bot/fcc-catalog-delta --state open --json number --jq '.[0].number // empty')"
          body="Automated metadata-only FreeCodeCamp catalog refresh. This PR contains append-only catalog records from the registered official channel. No media or transcripts were downloaded. Item-level rights remain unverified unless independently reviewed; catalog presence does not authorize training or commercial use."
          if [[ -z "$pr_number" ]]; then
            gh pr create --base "$DEFAULT_BRANCH" --head bot/fcc-catalog-delta --title "chore(catalog): refresh FreeCodeCamp metadata" --body "$body"
          else
            gh pr edit "$pr_number" --title "chore(catalog): refresh FreeCodeCamp metadata" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreamco-fcc-catalog-sync
          path: |
            reports/repo-sentinel/sentinel_report.json
            data/manifests/source_catalog.jsonl
          if-no-files-found: warn
          retention-days: 30
