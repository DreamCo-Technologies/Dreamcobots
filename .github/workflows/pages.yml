name: Publish DreamCo AI Research Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'tools/generate_repository_guide.py'
      - 'tools/generate_command_center_data.py'
      - 'tools/normalize_legacy_portfolios.py'
      - 'tools/place_original_bots.py'
      - 'original-bots/**'
      - 'bots/**'
      - 'config/project-feature-coverage.json'
      - 'tools/connect_repository_pages.py'
      - 'config/master_bot_registry.json'
      - 'tools/generate_dreamco_repository_master_map.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh repository owner directory
        run: |
          python3 tools/generate_repository_guide.py
          python3 tools/connect_repository_pages.py
          python3 tools/generate_command_center_data.py
          python3 -m unittest tests.test_repository_guide tests.test_repository_master_map tests.test_repository_browser tests.test_legacy_portfolios tests.test_branch_health_public_report
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Overlay original Buddy website
        run: |
          # jekyll-build-pages writes _site as root; copy to a runner-owned tree first
          mkdir -p public_site
          if [ -d _site ]; then cp -a _site/. public_site/; fi
          rsync -a website/ public_site/
          touch public_site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
