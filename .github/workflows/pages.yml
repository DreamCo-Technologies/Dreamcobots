name: Publish DreamCo AI Research Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check website nav links (fails on broken links)
        run: python3 tools/check_website_links.py --site website

  publish:
    needs: link-check
    uses: ./.github/workflows/deploy-buddy-pages.yml
