name: Master Bot Consolidation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "App_bots/**"
      - "config/master_bot_consolidation_policy.json"
      - "tools/build_master_bot_consolidation.py"
      - "tests/test_master_bot_consolidation.py"
      - ".github/workflows/master-bot-consolidation.yml"
  push:
    branches: [main]
    paths:
      - "App_bots/**"
      - "config/master_bot_consolidation_policy.json"
      - "tools/build_master_bot_consolidation.py"
      - "tests/test_master_bot_consolidation.py"
      - ".github/workflows/master-bot-consolidation.yml"

permissions:
  contents: read

concurrency:
  group: master-bot-consolidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build reversible master-bot merge plan
        run: python3 tools/build_master_bot_consolidation.py
      - name: Verify consolidation rules
        run: python3 -m pytest -q tests/test_master_bot_consolidation.py
      - name: Summary
        if: always()
        run: cat reports/MASTER_BOT_CONSOLIDATION.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: master-bot-consolidation-${{ github.run_id }}
          path: |
            config/generated/master-bot-consolidation.json
            reports/MASTER_BOT_CONSOLIDATION.md
          if-no-files-found: warn
          retention-days: 14
