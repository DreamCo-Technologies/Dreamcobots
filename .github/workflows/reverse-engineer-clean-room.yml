name: DreamCo Five-Stage Reverse Engineering Gate
on:
  pull_request:
    paths: ["contracts/**", "stages/**", "tests/test_pipeline_*.py", "Makefile", "requirements-reverse-engineer.txt", ".github/workflows/reverse-engineer-clean-room.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "stages/**", "tests/test_pipeline_*.py", "Makefile", "requirements-reverse-engineer.txt", ".github/workflows/reverse-engineer-clean-room.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dreamco-five-stage-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-reverse-engineer.txt
      - name: Install deterministic test dependencies
        run: python -m pip install "pytest>=8,<10" "jsonschema>=4.22,<5"
      - name: Run all five-stage contract and boundary tests
        run: make test-all
      - name: Confirm no accidental tracked bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "Tracked Python bytecode is prohibited"; exit 1
          fi
