name: DreamCo Lead Engine Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "server/lead-engine.ts"
      - "server/lead-engine-storage.ts"
      - "server/oauth-login.ts"
      - "server/routes.ts"
      - "shared/schema.ts"
      - "migrations/0002_lead_engine_crm.sql"
      - "tests/governed-leads.test.ts"
      - "tests/lead-engine-storage-contract.test.mjs"
      - "tests/oauth-login-policy.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lead-engine-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-engine-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lead-engine:
    name: TypeScript and Lead Engine regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check the complete application
        run: npm run check
      - name: Test governed lead policy, CRM isolation, OAuth identity, and outbound safeguards
        run: >-
          node --import tsx --test
          tests/governed-leads.test.ts
          tests/lead-engine-storage-contract.test.mjs
          tests/oauth-login-policy.test.mjs
          tests/outbound-adapters.test.ts
