name: Buddy In-House Capability Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'buddy/certification/**'
      - 'config/buddy/capability-certification-goals.json'
      - 'tests/test_buddy_capability_certification.py'
      - '.github/workflows/buddy-inhouse-capability-certification.yml'
  schedule:
    - cron: '27 13 * * *'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify certification engine
        run: python -m unittest tests.test_buddy_capability_certification -v
      - name: Generate conservative evidence
        run: python -m buddy.certification.engine --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-capability-certification
          path: website/data/buddy-capability-certification.json
          retention-days: 30
