name: Buddy In-House Capability Certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'buddy/certification/**'
      - 'config/buddy/daily-lab-manifest.json'
      - 'tests/test_buddy_daily_lab.py'
      - 'tests/test_buddy_discovery_benchmarks.py'
      - 'tests/test_buddy_training_planner.py'
      - 'tests/test_buddy_provider_adapters.py'
      - 'tests/test_buddy_task_champions.py'
      - 'tests/test_buddy_task_distillation.py'
      - 'config/buddy/benchmarks/**'
      - 'config/buddy/unified-build-training-plan.json'
      - 'config/buddy/capability-certification-goals.json'
      - 'tests/test_buddy_capability_certification.py'
      - '.github/workflows/buddy-inhouse-capability-certification.yml'
  schedule:
    - cron: '27 13 * * *'
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify certification engine
        run: python -m unittest tests.test_buddy_capability_certification -v
      - name: Verify daily inventory, deduplication and gap planning
        run: python -m unittest tests.test_buddy_daily_lab -v
      - name: Verify static repository discovery, repeatable model benchmark harness and training gates
        run: python -m unittest tests.test_buddy_discovery_benchmarks -v
      - name: Generate repository-wide static symbol inventory
        run: python -m buddy.certification.repository_discovery
      - name: Verify approved provider adapter safety without network or secrets
        run: python -m unittest tests.test_buddy_provider_adapters -v
      - name: Verify task-specific champion selection and Buddy gap comparison
        run: python -m unittest tests.test_buddy_task_champions -v
      - name: Verify rights-aware task distillation and stateful tool sandbox
        run: python -m unittest tests.test_buddy_task_distillation -v
      - name: Verify unified training backlog planner
        run: python -m unittest tests.test_buddy_training_planner -v
      - name: Generate daily capability, workflow, tool, function, library and generator gap report
        run: python -m buddy.certification.daily_lab --revision "${{ github.sha }}"
      - name: Produce review-only training proposals from gap evidence
        run: python -m buddy.certification.training_planner
      - name: Generate conservative evidence
        run: python -m buddy.certification.engine --revision "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-capability-certification
          path: |
            website/data/buddy-capability-certification.json
            website/data/buddy-daily-lab.json
            website/data/buddy-repository-discovery.json
            website/data/buddy-training-backlog.json
          retention-days: 30
