name: Buddy Safe Repository Repair

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/buddy-safe-repair.yml"
      - "tools/buddy_safe_repair.py"
      - "tools/buddy_failure_learning.py"
      - "tests/test_buddy_safe_repair.py"

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: buddy-safe-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select oldest eligible incident
        id: incident
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "buddy-auto-triage", per_page: 30
            });
            const issue = issues.find(x => {
              if (x.pull_request) return false;
              const body = x.body || "";
              const value = (label) => {
                const prefix = "- " + label + ": **";
                const line = body.split("\\n").find(y => y.startsWith(prefix));
                return line ? line.slice(prefix.length).replace(/\\*\\*$/, "").trim() : "";
              };
              const context = [value("Workflow"), value("Job"), value("Failed step(s)")].join(" ");
              return /dataset route|route index|division.*fleet|generated artifact/i.test(context);
            });
            if (!issue) {
              core.setOutput("found", "false");
              return;
            }
            const body = issue.body || "";
            const boldField = (label) => {
              const prefix = "- " + label + ": **";
              const line = body.split("\n").find(x => x.startsWith(prefix));
              return line ? line.slice(prefix.length).replace(/\*\*$/, "").trim() : "";
            };
            const branchLine = body.split("\n").find(x => x.startsWith("- Branch: "));
            const branch = branchLine ? branchLine.slice("- Branch: ".length).trim() : "";
            if (!/^[A-Za-z0-9._/-]+$/.test(branch) || branch.includes("..") || branch.startsWith("/")) {
              core.warning("Incident has no safe target branch; leaving it for manual triage.");
              core.setOutput("found", "false");
              return;
            }
            const runLine = body.split("\n").find(x => x.startsWith("- Run: "));
            core.setOutput("found", "true");
            core.setOutput("issue_number", String(issue.number));
            core.setOutput("branch", branch);
            core.setOutput("workflow", boldField("Workflow"));
            core.setOutput("job", boldField("Job"));
            core.setOutput("failed_step", boldField("Failed step(s)"));
            core.setOutput("run_url", runLine ? runLine.slice("- Run: ".length).trim() : "");
      - name: Checkout incident branch
        if: steps.incident.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.incident.outputs.branch }}
          persist-credentials: false
      - name: Set up Python
        if: steps.incident.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test safe repair boundaries
        if: steps.incident.outputs.found == 'true'
        run: python -m unittest tests.test_buddy_failure_learning tests.test_buddy_safe_repair
      - name: Build incident observation and run allowlisted repair
        if: steps.incident.outputs.found == 'true'
        id: safe_repair
        env:
          WORKFLOW: ${{ steps.incident.outputs.workflow }}
          JOB: ${{ steps.incident.outputs.job }}
          FAILED_STEP: ${{ steps.incident.outputs.failed_step }}
          RUN_URL: ${{ steps.incident.outputs.run_url }}
        run: |
          mkdir -p artifacts/buddy-safe-repair
          python - <<'PY'
          import json, os
          observation = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ.get("WORKFLOW", ""),
              "job": os.environ.get("JOB", ""),
              "failed_step": os.environ.get("FAILED_STEP", ""),
              "run_url": os.environ.get("RUN_URL", "")
          }
          with open("artifacts/buddy-safe-repair/observation.json", "w", encoding="utf-8") as f:
              json.dump(observation, f, indent=2)
          PY
          python tools/buddy_safe_repair.py --observation artifacts/buddy-safe-repair/observation.json
      - name: Create isolated repair pull request
        if: steps.safe_repair.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: buddy/auto-repair-${{ github.run_id }}
          base: ${{ steps.incident.outputs.branch }}
          delete-branch: true
          commit-message: "chore: regenerate verified DreamCo artifacts"
          title: "Buddy safe repair: regenerate stale generated artifacts"
          body: |
            This PR was generated by Buddy's allowlisted GitHub Actions repair worker.

            - Original incident: #${{ steps.incident.outputs.issue_number }}
            - Failed workflow: ${{ steps.incident.outputs.workflow }}
            - Failed job: ${{ steps.incident.outputs.job }}
            - Failed step: ${{ steps.incident.outputs.failed_step }}
            - Original run: ${{ steps.incident.outputs.run_url }}

            Only a deterministic generated-artifact rebuild was permitted. Review the diff and run the original failing check plus dependent regression checks before merging.
      - name: Preserve repair evidence
        if: always() && steps.incident.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: buddy-safe-repair-${{ github.run_id }}
          path: artifacts/buddy-safe-repair/
          if-no-files-found: ignore
          retention-days: 90
