name: Manufacturing Marketplace Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "31 15 * * *"
  push:
    branches: [main]
    paths:
      - "App_bots/DreamTrade.json"
      - "config/china-us-tech-manufacturing-scout-program.json"
      - "config/us-manufacturer-rfq-marketplace-program.json"
      - "config/mastery-data-pack-knowledge-layers.json"
      - "config/system-progress-gauges.json"
      - "tools/build_trade_manufacturing_marketplace.py"
      - "tools/build_system_progress_status.py"
      - "tools/build_engineering_gap_closure_plan.py"
      - "tools/build_github_platform_benchmark.py"
      - "tests/test_trade_manufacturing_marketplace.py"
      - "website/manufacturing-marketplace.html"
      - "website/manufacturing-marketplace.js"
      - ".github/workflows/manufacturing-marketplace-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: manufacturing-marketplace-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate trade marketplace catalog
        run: python3 tools/build_trade_manufacturing_marketplace.py
      - name: Build current GitHub gap plan for progress gauges
        run: |
          python3 tools/build_github_platform_benchmark.py
          python3 tools/build_engineering_gap_closure_plan.py
          python3 tools/build_system_progress_status.py
      - name: Run marketplace and progress tests
        run: python3 -m unittest tests.test_trade_manufacturing_marketplace
      - name: Check marketplace JavaScript
        run: node --check website/manufacturing-marketplace.js
      - name: Build owner summary
        if: always()
        run: |
          {
            echo "# Manufacturing Marketplace Intelligence"
            echo
            if [ -f config/generated/trade-manufacturing-marketplace.json ]; then
              python3 -c "import json; d=json.load(open('config/generated/trade-manufacturing-marketplace.json')); print('- Source adapter classes:',len(d['scout']['source_adapters'])); print('- Marketplace features:',len(d['marketplace']['features'])); print('- Sandbox requirements:',len(d['sandbox_requirements']))"
            fi
            if [ -f config/generated/system-progress-status.json ]; then
              python3 -c "import json; d=json.load(open('config/generated/system-progress-status.json')); print('- System build status:',d['system_build_status']); print('- Engineering gaps:',d['gap_count']); print('- Average current gap progress:',str(d['average_gap_percent'])+'%')"
            fi
            echo "- Live supplier claims, RFQs, contracts and payments remain blocked until authorized adapters and runtime evidence exist."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manufacturing-marketplace-${{ github.run_id }}
          path: |
            config/generated/trade-manufacturing-marketplace.json
            config/generated/system-progress-status.json
            config/generated/engineering-gap-closure-plan.json
            reports/GITHUB_PLATFORM_PARITY_BENCHMARK.md
          if-no-files-found: ignore
          retention-days: 14
