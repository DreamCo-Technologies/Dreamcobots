name: Buddy Pages Mastery Evidence
on:
  pull_request:
    paths:
      - 'tools/build_buddy_pages_mastery_evidence.py'
      - 'tests/test_buddy_pages_mastery_evidence.py'
      - 'website/buddy-capability-evidence.html'
      - 'website/data/buddy-mastery-evidence.json'
      - '.github/workflows/buddy-pages-mastery-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_buddy_pages_mastery_evidence.py' -v
      - run: python tools/build_buddy_pages_mastery_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-mastery-evidence
          path: website/data/buddy-mastery-evidence.json
