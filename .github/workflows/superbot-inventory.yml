name: Superbot Repository Inventory

on:
  push:
    branches: [main, 'codex/superbot-consolidation']
    paths:
      - 'App_bots/**'
      - 'bots/**'
      - 'original-bots/**'
      - 'buddy/**'
      - 'buddy_os/**'
      - 'config/masterbot-65-registry.json'
      - 'config/master_bot_registry.json'
      - 'config/generated/masterbot-55-domain-crosswalk.json'
      - 'config/buddy-model-registry.json'
      - 'config/buddy-model-selection-registry.json'
      - 'config/buddy-fleet-quality-program.json'
      - 'tools/build_superbot_repository_inventory.py'
      - '.github/workflows/superbot-inventory.yml'
  pull_request:
    paths:
      - 'App_bots/**'
      - 'bots/**'
      - 'original-bots/**'
      - 'buddy/**'
      - 'buddy_os/**'
      - 'config/masterbot-65-registry.json'
      - 'config/master_bot_registry.json'
      - 'config/generated/masterbot-55-domain-crosswalk.json'
      - 'config/buddy-model-registry.json'
      - 'config/buddy-model-selection-registry.json'
      - 'config/buddy-fleet-quality-program.json'
      - 'tools/build_superbot_repository_inventory.py'
      - '.github/workflows/superbot-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build complete repository inventory
        run: python tools/build_superbot_repository_inventory.py
      - name: Validate generated inventory exists
        run: |
          test -s config/generated/superbot-repository-inventory.json
          test -s reports/SUPERBOT_REPOSITORY_INVENTORY.md
      - name: Upload inventory
        uses: actions/upload-artifact@v7
        with:
          name: superbot-repository-inventory
          path: |
            config/generated/superbot-repository-inventory.json
            reports/SUPERBOT_REPOSITORY_INVENTORY.md
