name: Buddy Learning Regression

on:
  pull_request:
    paths:
      - 'buddy/learning/**'
      - 'foundry/local_rag.py'
      - 'config/buddy/resource-registry.json'
      - 'docs/BUDDY_RESOURCE_MAP.md'
      - 'tests/test_buddy_resource_registry.py'
      - 'tools/generate_resource_connection_catalog.py'
      - 'website/data/buddy-resource-connection-catalog.json'
      - 'buddy/datasets/unknown_router.py'
      - 'tests/test_buddy_dataset_hub_runtime.py'
      - 'tests/test_buddy_learning_runtime_bridge.py'
      - 'tests/test_buddy_library_knowledge_router.py'
      - 'tests/test_buddy_universal_library_registry.py'
      - 'tests/test_foundry_local_rag.py'
      - 'config/buddy-conversation-learning-governance.json'
      - 'docs/BUDDY_UNIVERSAL_LEARNING_AND_MASTERY_LOOP.md'
      - 'tests/test_*learning*.py'
      - 'tests/test_dependency_reduction_score.py'
      - 'tools/record_buddy_benchmark_learning.py'
  push:
    branches: [main]
    paths:
      - 'buddy/learning/**'
      - 'foundry/local_rag.py'
      - 'config/buddy/resource-registry.json'
      - 'docs/BUDDY_RESOURCE_MAP.md'
      - 'tests/test_buddy_resource_registry.py'
      - 'tools/generate_resource_connection_catalog.py'
      - 'website/data/buddy-resource-connection-catalog.json'
      - 'buddy/datasets/unknown_router.py'
      - 'tests/test_buddy_dataset_hub_runtime.py'
      - 'tests/test_buddy_learning_runtime_bridge.py'
      - 'tests/test_buddy_library_knowledge_router.py'
      - 'tests/test_buddy_universal_library_registry.py'
      - 'tests/test_foundry_local_rag.py'
      - 'tests/test_*learning*.py'
      - 'tests/test_dependency_reduction_score.py'
      - 'tools/record_buddy_benchmark_learning.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Buddy learning test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-buddy-learning.txt

      - name: Run Buddy learning regression tests
        run: |
          python -m pytest -q \
            tests/test_buddy_learning_evidence.py \
            tests/test_benchmark_learning_progress.py \
            tests/test_learning_history.py \
            tests/test_dependency_reduction_score.py \
            tests/test_mastery_decision.py \
            tests/test_buddy_universal_learning_governance.py \
            tests/test_buddy_conversation_learning_policy.py \
            tests/test_buddy_learning_runtime_bridge.py \
            tests/test_buddy_library_knowledge_router.py \
            tests/test_buddy_universal_library_registry.py \
            tests/test_foundry_local_rag.py \
            tests/test_buddy_dataset_hub_runtime.py \
            tests/test_buddy_resource_registry.py
