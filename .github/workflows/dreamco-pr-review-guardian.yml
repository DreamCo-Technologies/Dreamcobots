name: DreamCo PR Review Guardian

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: dreamco-pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-guardian:
    name: PR safety and mergeability review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Build review report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pr-review
          PR_NUMBER=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            PR_NUMBER="$(python - <<'PY'
import json, os
from pathlib import Path
payload_path = os.environ.get("GITHUB_EVENT_PATH", "")
number = ""
if payload_path:
    payload = json.loads(Path(payload_path).read_text())
    number = payload.get("pull_request", {}).get("number", "")
print(number or "")
PY
)"
          fi
          {
            echo "# DreamCo PR Review Guardian"
            echo
            echo "Repository: $REPOSITORY"
            echo "PR: ${PR_NUMBER:-scheduled repository scan}"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [[ -n "${PR_NUMBER:-}" ]]; then
              gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json number,title,state,isDraft,mergeable,mergeStateStatus,headRefName,baseRefName,changedFiles,additions,deletions,author > artifacts/pr-review/pr.json
              python - <<'PY'
import json
from pathlib import Path
p=json.loads(Path('artifacts/pr-review/pr.json').read_text())
for k in ('number','title','state','isDraft','mergeable','mergeStateStatus','headRefName','baseRefName','changedFiles','additions','deletions'):
    print(f'- **{k}**: `{p.get(k)}`')
PY
              echo
              echo "## Decision guidance"
              echo
              echo "- Mergeable: validate CI, security, benchmark and regression gates before merge."
              echo "- Conflicted/blocked: rebuild from current main and transplant only verified unique capabilities."
              echo "- Duplicate/obsolete: preserve historical evidence and avoid importing duplicate code."
              echo "- Unknown: keep blocked until evidence is available."
            else
              echo "Main-branch guardian run: validate that the PR review workflow itself is executable and available for future PRs."
            fi
          } > artifacts/pr-review/report.md
      - name: Upload review report
        uses: actions/upload-artifact@v6
        with:
          name: dreamco-pr-review-${{ github.run_id }}
          path: artifacts/pr-review/
          if-no-files-found: error
          retention-days: 30
