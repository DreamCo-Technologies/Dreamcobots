name: Governed Test Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "tests/**"
      - "tools/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/governed-test-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "tests/**"
      - "tools/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/governed-test-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: governed-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Explain this action
        run: |
          {
            echo "# Governed Test Diagnostics"
            echo
            echo "**Owner:** Tells you exactly which DreamCo safety/product tests failed and shows the nearby error instead of making you read thousands of log lines."
            echo "**Users:** Protects core product, privacy, routing, and approval behavior before release."
            echo "**Developers:** Runs the canonical governed suite and preserves full logs plus a focused failure extract."
            echo "**Investors:** Shows that DreamCo exposes failures rather than hiding them behind a bot-count or feature-count claim."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Run governed tests and preserve full output
        id: governed
        shell: bash
        run: |
          set +e
          mkdir -p tmp/governed-diagnostics
          npm run test:governed 2>&1 | tee tmp/governed-diagnostics/full.log
          code=${PIPESTATUS[0]}
          grep -n -B 6 -A 18 -E '^not ok|ERR_ASSERTION|AssertionError|error:' tmp/governed-diagnostics/full.log > tmp/governed-diagnostics/failures.txt || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Plain-English failure summary
        if: always()
        run: |
          {
            echo
            echo "## Focused failure output"
            echo '```text'
            cat tmp/governed-diagnostics/failures.txt 2>/dev/null || echo "No failing-test marker found."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: governed-test-diagnostics-${{ github.run_id }}
          path: tmp/governed-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the test gate
        if: always()
        run: test "${{ steps.governed.outputs.exit_code }}" = "0"
