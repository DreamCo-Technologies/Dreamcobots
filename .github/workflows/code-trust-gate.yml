name: Code Trust Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "client/**"
      - "website/**"
      - "tools/**"
      - "script/**"
      - "tests/**"
      - "config/**"
      - "App_bots/**"
      - "package.json"
      - "package-lock.json"
      - ".github/agents/**"
      - ".github/workflows/code-trust-gate.yml"
  pull_request:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: code-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-code:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate trusted-code policies
        run: python3 -m unittest tests.test_trusted_code_delivery tests.test_change_impact_test_policy
      - name: Determine change range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git rev-parse HEAD^1)"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          git cat-file -e "$base^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify changed executable code has test evidence
        run: python3 tools/audit_change_test_coverage.py --base "${{ steps.range.outputs.base }}" --head "${{ steps.range.outputs.head }}"
      - name: Static syntax and type audit
        run: python3 tools/audit_trusted_code_delivery.py
      - name: Full repository verification
        run: npm run test:repository
      - name: Fleet end-to-end verification
        run: npm run buddy:fleet:e2e
      - name: Python policy and platform regression suites
        run: |
          python3 -m unittest \
            tests.test_full_potential_sandbox \
            tests.test_universal_human_ai_task_sandbox \
            tests.test_bot_sandbox_curriculum \
            tests.test_offline_generator_universal_sandbox \
            tests.test_platform_evolution \
            tests.test_engineering_gap_closure_team \
            tests.test_trusted_code_delivery \
            tests.test_change_impact_test_policy
      - name: Supply-chain audit
        run: npm audit --audit-level=high
      - name: Build production artifact
        run: npm run build
      - name: Build release-quality receipt
        if: always()
        env:
          CODE_TRUST_JOB_STATUS: ${{ job.status }}
          CODE_TRUST_COMMIT: ${{ github.sha }}
          CODE_TRUST_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p tmp/code-trust
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def load(path):
              p=Path(path)
              return json.loads(p.read_text()) if p.exists() else {}
          audit=load('config/generated/trusted-code-delivery-audit.json')
          impact=load('config/generated/change-impact-test-coverage.json')
          status=os.environ.get('CODE_TRUST_JOB_STATUS','unknown')
          blockers=list(audit.get('release_blockers',[]))+list(impact.get('release_blockers',[]))
          receipt={
            'schema':'dreamco.code_trust_receipt.v2',
            'commit':os.environ.get('CODE_TRUST_COMMIT'),
            'run_id':os.environ.get('CODE_TRUST_RUN_ID'),
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'job_status':status,
            'changed_files':impact.get('changed_file_count'),
            'changed_executable_files':impact.get('changed_executable_file_count'),
            'changed_test_files':impact.get('changed_test_file_count'),
            'release_blockers':blockers,
            'review_findings':audit.get('review_finding_count',0),
            'source_files':audit.get('source_file_count'),
            'test_files':audit.get('test_file_count'),
            'release_status':'verified_candidate' if status == 'success' and not blockers else 'blocked',
            'truth_boundary':'A passing receipt means required configured checks passed for this commit and change range; it is not proof that no possible bug exists.'
          }
          Path('tmp/code-trust/release-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8') as f:
              f.write('## Code Trust Gate\n\n')
              f.write(f"- Release status: **{receipt['release_status']}**\n")
              f.write(f"- Changed executable files: {receipt['changed_executable_files']}\n")
              f.write(f"- Changed test files: {receipt['changed_test_files']}\n")
              f.write(f"- Release blockers: {len(receipt['release_blockers'])}\n")
              f.write(f"- Review findings: {receipt['review_findings']}\n")
          PY
      - name: Upload trust evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-trust-${{ github.run_id }}
          path: |
            config/generated/trusted-code-delivery-audit.json
            config/generated/change-impact-test-coverage.json
            reports/TRUSTED_CODE_DELIVERY_AUDIT.md
            tmp/code-trust/
            tmp/dreamco-verification/
          if-no-files-found: warn
          retention-days: 14
