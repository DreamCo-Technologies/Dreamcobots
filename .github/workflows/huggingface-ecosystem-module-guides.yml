name: Hugging Face Ecosystem Module Guides
on:
  pull_request:
    paths:
      - "config/buddy-huggingface-full-learning-map.json"
      - "config/buddy-huggingface-18-ecosystem-module-guides.json"
      - "tools/validate_buddy_huggingface_module_guides.py"
      - "tests/test_buddy_huggingface_module_guides.py"
      - ".github/workflows/huggingface-ecosystem-module-guides.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hf-module-guides-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_buddy_huggingface_module_guides.py
      - run: python tools/validate_buddy_huggingface_module_guides.py
