name: Revenue Lane Playbook Framework

on:
  pull_request:
    paths:
      - "money_os/config/revenue_lanes_expanded.json"
      - "config/buddy-revenue-lane-playbook-framework.json"
      - "tests/test_buddy_revenue_lane_playbook_framework.py"
      - ".github/workflows/revenue-lane-playbook-framework.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenue-lane-framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pytest -q tests/test_buddy_revenue_lane_playbook_framework.py
