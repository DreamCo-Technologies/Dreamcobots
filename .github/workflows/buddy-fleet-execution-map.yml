name: Buddy Fleet Execution Map
on:
  pull_request:
    paths:
      - "config/bots/bot-manifests.generated.json"
      - "config/supplemental-portfolio-capability-charters.json"
      - "money_os/**"
      - "shared/division-production-contract.ts"
      - "config/masterbot-65-registry.json"
      - "config/generated/masterbot-45-domain-crosswalk.json"
      - "tools/build_buddy_fleet_execution_map.py"
      - "tests/test_buddy_fleet_execution_map.py"
      - ".github/workflows/buddy-fleet-execution-map.yml"
  push:
    branches: [main]
    paths:
      - "config/bots/bot-manifests.generated.json"
      - "config/supplemental-portfolio-capability-charters.json"
      - "money_os/**"
      - "shared/division-production-contract.ts"
      - "config/masterbot-65-registry.json"
      - "config/generated/masterbot-45-domain-crosswalk.json"
      - "tools/build_buddy_fleet_execution_map.py"
      - "tests/test_buddy_fleet_execution_map.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: buddy-fleet-execution-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build deterministic full-fleet plan
        run: python tools/build_buddy_fleet_execution_map.py
      - name: Validate every bot and specialist portfolio
        run: python -m unittest tests.test_buddy_fleet_execution_map
      - name: Upload plan evidence
        uses: actions/upload-artifact@v7
        with:
          name: buddy-fleet-execution-map-${{ github.run_id }}
          path: config/generated/buddy-fleet-execution-map.json
          if-no-files-found: error
          retention-days: 14
