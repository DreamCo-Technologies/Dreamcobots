name: Buddy Fleet Execution Map
on:
  pull_request:
    paths:
      - "config/bots/bot-manifests.generated.json"
      - "config/supplemental-portfolio-capability-charters.json"
      - "money_os/**"
      - "shared/division-production-contract.ts"
      - "config/masterbot-65-registry.json"
      - "config/generated/masterbot-45-domain-crosswalk.json"
      - "tools/build_buddy_fleet_execution_map.py"
      - "tools/build_live_revenue_readiness.py"
      - "tests/test_live_revenue_readiness_coverage.py"
      - "tests/test_buddy_fleet_execution_map.py"
      - ".github/workflows/buddy-fleet-execution-map.yml"
      - "config/bots/teammate-lane-division-crosswalk.json"
      - "config/bots/teammate-lanes.json"
      - "config/bots/bot-runtime-contract.schema.json"
      - "buddy/fleet_runtime/**"
      - "tools/generate_bot_manifests.py"
      - "tests/test_fleet_runtime_routing.py"
  push:
    branches: [main]
    paths:
      - "config/bots/bot-manifests.generated.json"
      - "config/supplemental-portfolio-capability-charters.json"
      - "money_os/**"
      - "shared/division-production-contract.ts"
      - "config/masterbot-65-registry.json"
      - "config/generated/masterbot-45-domain-crosswalk.json"
      - "tools/build_buddy_fleet_execution_map.py"
      - "tools/build_live_revenue_readiness.py"
      - "tests/test_live_revenue_readiness_coverage.py"
      - "tests/test_buddy_fleet_execution_map.py"
      - "config/bots/teammate-lane-division-crosswalk.json"
      - "config/bots/teammate-lanes.json"
      - "config/bots/bot-runtime-contract.schema.json"
      - "buddy/fleet_runtime/**"
      - "tools/generate_bot_manifests.py"
      - "tests/test_fleet_runtime_routing.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: buddy-fleet-execution-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate canonical division and MasterBot manifests
        run: |
          python tools/generate_bot_manifests.py
          python tools/generate_bot_manifests.py --check
      - name: Build deterministic full-fleet plan
        run: python tools/build_buddy_fleet_execution_map.py
      - name: Validate runtime routing, specialist portfolios and revenue plans
        run: |
          python -m unittest tests.test_fleet_runtime_routing
          python -m unittest tests.test_buddy_fleet_execution_map
          python -m unittest tests.test_live_revenue_readiness_coverage
      - name: Upload generated manifests and fleet evidence
        uses: actions/upload-artifact@v7
        with:
          name: buddy-fleet-execution-map-${{ github.run_id }}
          path: |
            config/bots/bot-manifests.generated.json
            config/bots/division-manifests.generated.json
            config/generated/buddy-fleet-execution-map.json
          if-no-files-found: error
          retention-days: 14
