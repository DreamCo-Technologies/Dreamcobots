name: Consolidation Integrity Gate
on:
  pull_request:
    paths:
      - "config/consolidated-pr-integration.json"
      - "config/masterbot-65-registry.json"
      - "config/actions-page-operating-system.json"
      - "config/local-buddy-model.yaml"
      - "tools/validate_actions_page_contract.py"
      - "config/buddy/category-system-registry.json"
      - "config/buddy/additional-taxonomy-system-registry.json"
      - "config/buddy/task-taxonomy-system-registry.json"
      - "website/data/task-taxonomy-system-registry.json"
      - "docs/BUDDY_TASK_AND_MARKDOWN_TAXONOMY_SYSTEMS.md"
      - "config/universal-human-ai-software-task-sandbox.json"
      - "tools/validate_buddy_task_taxonomy_registry.py"
      - "tests/test_buddy_task_taxonomy_registry.py"
      - "config/buddy/resource-registry.json"
      - "config/buddy-study-resources-*.json"
      - "shared/ai-models.ts"
      - "tools/validate_buddy_category_system_registry.py"
      - "tools/validate_buddy_additional_taxonomy_registry.py"
      - "tests/test_buddy_category_system_registry.py"
      - "tests/test_buddy_additional_taxonomy_registry.py"
      - "package.json"
      - "website/category-systems.html"
      - "website/category-systems.js"
      - "website/data/category-system-registry.json"
      - "website/data/additional-taxonomy-system-registry.json"
      - "docs/BUDDY_ADDITIONAL_TAXONOMY_SYSTEMS.md"
      - "website/nav.js"
      - "config/buddy/technology-discovery-policy.json"
      - "config/vibe-coding/capability-taxonomy.json"
      - "tools/validate_vibe_coding_taxonomy.py"
      - ".github/workflows/vibe-coding-taxonomy.yml"
      - "docs/VIBE_CODING_CATEGORY_MAP.md"
      - "config/generated/buddy-technology-radar.json"
      - "website/data/buddy-technology-radar.json"
      - "website/data/technology-discovery-policy.json"
      - "tools/refresh_buddy_technology_radar.py"
      - "tests/test_buddy_technology_radar.py"
      - "website/technology-radar.html"
      - "website/technology-radar.js"
      - "config/buddy/markdown-implementation-gap-policy.json"
      - "tools/audit_markdown_implementation_gaps.py"
      - "tests/test_markdown_implementation_gaps.py"
      - "website/markdown-gap-audit.html"
      - "website/markdown-gap-audit.js"
      - "website/data/markdown-implementation-gap-audit.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate current division registry
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('config/masterbot-65-registry.json'))
          divisions=d['divisions']
          assert divisions
          assert d['canonical_count'] == len(divisions)
          assert len({x['id'] for x in divisions}) == len(divisions)
          assert len({x['name'] for x in divisions}) == len(divisions)
          print(f'current division registry: PASS ({len(divisions)} records; count derived)')
          PY
      - name: Validate Actions contract
        run: python3 tools/validate_actions_page_contract.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Buddy category-system registry
        run: |
          npm run buddy:category-systems
          python3 tools/audit_markdown_implementation_gaps.py --write
          python3 tools/audit_markdown_implementation_gaps.py --check
          python3 -m unittest tests.test_markdown_implementation_gaps tests.test_buddy_category_system_registry tests.test_buddy_additional_taxonomy_registry tests.test_buddy_technology_radar tests.test_buddy_task_taxonomy_registry
          python3 tools/refresh_buddy_technology_radar.py --check
          python3 tools/validate_vibe_coding_taxonomy.py
          node --check website/category-systems.js
          node --check website/technology-radar.js
          node --check website/markdown-gap-audit.js
      - name: Validate consolidation map
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('config/consolidated-pr-integration.json'))
          assert d['base'] == 'main'
          assert isinstance(d['pull_requests'], list)
          assert isinstance(d['canonical_assets'], list)
          assert len({str(x.get('number')) for x in d['pull_requests']}) == len(d['pull_requests'])
          print('consolidation map: PASS')
          PY
