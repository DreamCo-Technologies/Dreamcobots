name: Full System Certification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 9 * * *"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/**"
      - "client/**"
      - "website/**"
      - "tools/**"
      - "script/**"
      - "tests/**"
      - "config/**"
      - "App_bots/**"
      - "original-bots/**"
      - "bots/**"
      - "attached_assets/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - ".github/agents/**"
      - ".github/workflows/full-system-certification.yml"

permissions:
  contents: read

concurrency:
  group: full-system-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Clean locked dependency install
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check openpyxl

      - name: Refresh generated verification contracts
        run: |
          python3 tools/generate_repository_test_registry.py
          node --import tsx tools/generate_dreamco_search_index.ts
          python3 tools/generate_buddy_platform_expansion.py
          node --import tsx tools/generate_buddy_success_program.ts

      - name: Validate certification policies
        run: |
          python3 -m unittest tests.test_full_system_operational_certification tests.test_trusted_code_delivery tests.test_change_impact_test_policy tests.test_recovery_ontology_workforce_runtime
          node --import tsx --test tests/server-health-runtime-policy.test.ts

      - name: Recover and unify legacy bot system
        run: |
          python3 tools/recover_legacy_bots.py
          python3 tools/build_legacy_capability_merge_proposals.py
          python3 tools/build_legacy_promotion_backlog.py
          python3 tools/build_unified_bot_system.py
          python3 tools/build_runtime_sync_plan.py

      - name: Build work business creative government manufacturing and ontology evidence
        run: |
          python3 tools/build_universal_work_ai_catalog.py || python3 tools/build_universal_work_ai_catalog.py --offline
          python3 tools/build_universal_capability_benchmark.py
          python3 tools/build_business_lifecycle_benchmarks.py
          python3 tools/build_creative_mastery_benchmarks.py
          python3 tools/build_government_public_sector_benchmarks.py
          python3 tools/build_work_platform_benchmarks.py
          python3 tools/build_manufacturing_productivity_benchmarks.py
          python3 tools/build_continuous_value_discovery_backlog.py
          python3 tools/build_parallel_benchmark_gap_registry.py
          python3 tools/build_ontology_snapshot.py

      - name: Refresh internal and external connection truth
        run: |
          npm run buddy:connections
          python3 tools/audit_runtime_connections.py
          python3 tools/audit_repository_connections.py

      - name: Account for every bot division category and specialist agent
        run: python3 tools/audit_all_bots_categories_and_agents.py

      - name: Run trusted-code static audit
        run: python3 tools/audit_trusted_code_delivery.py

      - name: Build maximum sandbox plan
        run: |
          python3 tools/build_universal_human_ai_task_sandbox.py
          python3 tools/build_full_potential_sandbox_catalog.py
          python3 tools/build_bot_sandbox_curriculum.py
          python3 tools/build_maximum_sandbox_matrix.py

      - name: Run business data and trade readiness tests
        run: |
          python3 tools/build_bot_business_owner_curriculum.py
          python3 tools/build_live_revenue_readiness.py
          python3 tools/build_manufacturer_marketplace_catalog.py
          node --import tsx --test tests/business-data-trade-readiness.test.ts

      - name: Run full production verification
        run: npx tsx tools/run_universal_verification.ts --production

      - name: Re-verify fleet E2E and inherit canonical sandbox evidence
        run: |
          npm run buddy:fleet:e2e
          python3 tools/audit_maximum_sandbox_runtime.py

      - name: Run speed and accuracy benchmarks
        run: python3 tools/run_system_speed_accuracy_benchmarks.py

      - name: Supply-chain vulnerability gate
        run: npm audit --audit-level=high

      - name: Smoke-test built production runtime
        run: python3 tools/smoke_production_runtime.py

      - name: Build full certification receipt
        if: always()
        run: python3 tools/build_full_system_certification.py

      - name: Build live-user readiness
        if: always()
        run: python3 tools/build_live_user_testing_readiness.py || true

      - name: Certification summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          def load(path):
              p=Path(path); return json.loads(p.read_text()) if p.exists() else {}
          d=load('config/generated/full-system-operational-certification.json')
          print('# Full System Certification'); print()
          if not d:
              print('Certification receipt was not generated because prerequisite evidence is missing.'); raise SystemExit(0)
          print(f"- Status: **{d['status']}**")
          print(f"- Core operationally certified: **{d['core_operational_certified']}**")
          print(f"- Fully operational + connected claim allowed: **{d['fully_operational_and_connected_claim_allowed']}**")
          print(f"- Speed: **{d['speed_summary']['passed']}/{d['speed_summary']['total']}**")
          print(f"- Accuracy: **{d['accuracy_summary']['passed']}/{d['accuracy_summary']['total']}**")
          print(f"- Runtime connections: **{d['connection_summary']['runtime_verified']}/{d['connection_summary']['declared']}**")
          print(f"- Internal repository references/blockers: **{d['connection_summary']['internal_references']}/{d['connection_summary']['internal_blockers']}**")
          print(f"- Legacy files/candidates: **{d['recovery_summary']['legacy_files']}/{d['recovery_summary']['recoverable_candidates']}**")
          print(f"- Sandbox overlays: **{d['sandbox_summary']['overlays']}**")
          print(f"- Canonical sandbox runtime coverage: **{d['sandbox_summary']['canonical_runtime_coverage_percent']}%**")
          b=d['benchmark_summary']
          print(f"- Universal/business/creative/government/manufacturing benchmark cases: **{b['universal']}/{b['business']}/{b['creative']}/{b['government']}/{b['manufacturing']}**")
          print(f"- Parallel benchmark gap workers: **{b['parallel_gap_workers']}**")
          print(f"- Continuous value candidates: **{b['value_candidates']}**")
          live=load('config/generated/live-user-testing-readiness.json')
          if live: print(f"- Live-user recommended stage: **{live['recommended_stage']}**")
          if d['release_blockers']:
              print('- Blockers:')
              for blocker in d['release_blockers']: print(f"  - {blocker}")
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-system-certification-${{ github.run_id }}
          path: |
            config/generated/full-system-operational-certification.json
            config/generated/system-speed-accuracy-benchmarks.json
            config/generated/production-runtime-smoke.json
            config/generated/runtime-connection-readiness.json
            config/generated/repository-system-connections.json
            config/generated/trusted-code-delivery-audit.json
            config/generated/bot-accounting-placement-audit.json
            config/generated/legacy-bot-recovery-manifest.json
            config/generated/legacy-capability-merge-proposals.json
            config/generated/legacy-bot-promotion-backlog.json
            config/generated/unified-bot-system.json
            config/generated/runtime-sync-plan.json
            config/generated/universal-work-ai-catalog.json
            config/generated/universal-capability-benchmark.json
            config/generated/business-lifecycle-benchmarks.json
            config/generated/creative-studio-mastery-benchmarks.json
            config/generated/government-public-sector-benchmarks.json
            config/generated/work-platform-benchmark-backlog.json
            config/generated/manufacturing-productivity-benchmarks.json
            config/generated/parallel-benchmark-gap-registry.json
            config/generated/continuous-value-discovery-backlog.json
            config/generated/dreamco-ontology-snapshot.json
            config/generated/maximum-sandbox-matrix.json
            config/generated/maximum-sandbox-runtime-audit.json
            config/generated/live-user-testing-readiness.json
            tmp/dreamco-verification/latest.json
            reports/FULL_SYSTEM_OPERATIONAL_CERTIFICATION.md
            reports/REPOSITORY_SYSTEM_CONNECTIONS.md
            reports/PARALLEL_BENCHMARK_GAP_REGISTRY.md
          if-no-files-found: warn
          retention-days: 21
