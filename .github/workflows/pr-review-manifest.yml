name: DreamCo PR Review Manifest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dreamco-pr-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect PR metadata
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json number,title,mergeable,mergeStateStatus > /tmp/pr.json
      - name: Generate manifest
        if: github.event_name == 'pull_request'
        run: python tools/pr_review_manifest.py --pr-json /tmp/pr.json
      - name: Upload manifest
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dreamco-pr-manifest-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: artifacts/pr-review/manifest.json
          if-no-files-found: error
          retention-days: 30
