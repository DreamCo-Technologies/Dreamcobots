name: Daily resource ledger

on:
  workflow_dispatch:
  schedule:
    - cron: "40 15 * * *"

permissions:
  contents: read

concurrency:
  group: daily-resource-ledger
  cancel-in-progress: false

jobs:
  day:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan resources, gaps, and learning in one job
        run: |
          python3 buddy/accounts/resource_ledger.py
          python3 buddy/accounts/plugin_gap_bot.py
          python3 buddy/builder/daily_learning.py
