name: Benchmark Tracker

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  benchmark-tracker:
    name: Build Benchmark Dashboard Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate capability discovery report
        run: python tools/capability_discovery_report.py

      - name: Validate and generate canonical Buddy benchmark index
        run: python tools/generate_buddy_benchmark_index.py

      - name: Run executable reality benchmark protocol smoke test
        run: python tools/reality_benchmark_smoke.py

      - name: Diagnose evaluation Pages evidence fingerprint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.general_intelligence import build
          data = build()
          print("EXPECTED_GENERAL_INTELLIGENCE_SOURCE_HASH=" + data["source_hash"])
          for path in ("website/data/general-intelligence.json", "website/data/general-intelligence-manifest.json"):
              existing = json.loads(Path(path).read_text())
              changed = [key for key in existing if key != "source_hash" and (key not in data or existing[key] != data[key])] if path.endswith("general-intelligence.json") else []
              print("PAGES_OTHER_DIFF_KEYS=" + path + ":" + ",".join(changed))
          PY

      - name: Guard against Actions workflow-run fanout regressions
        run: python -m unittest tests.test_actions_fanout_guard

      - name: Verify bounded Greenkeeper observation evidence
        run: python -m unittest tests.test_greenkeeper_observations

      - name: Verify benchmark handoff provenance and manual inputs
        run: python -m unittest discover -s tests -p 'test_benchmark_upstream_run_binding.py'

      - name: Verify governed evidence fail-closed contracts
        run: python -m unittest tests.test_evidence_malformed_inputs tests.test_general_intelligence.EvidenceTests tests.test_general_intelligence.RunnerTests tests.test_benchmark_suite_review_provenance tests.test_benchmark_gap_reviewer_integrity buddy.learning.registered_runner_test

      - name: Collect benchmark metadata
        shell: bash
        run: |
          mkdir -p artifacts/benchmark-dashboard
          cp -f config/generated/buddy_benchmark_index.json artifacts/benchmark-dashboard/ 2>/dev/null || true
          cp -f reports/BUDDY_BENCHMARK_INDEX.md artifacts/benchmark-dashboard/ 2>/dev/null || true
          cp -f config/reality_benchmark_suite.json artifacts/benchmark-dashboard/ 2>/dev/null || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path('artifacts/benchmark-dashboard/benchmark-run.json')
          out.write_text(json.dumps({
              'schema': 'dreamco.benchmark_run.v1',
              'status': 'generated',
              'score_scale': {'min': 0, 'max': 100},
              'reality_suite_protocol': 'pass',
              'commit': os.environ.get('GITHUB_SHA'),
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'run_id': os.environ.get('GITHUB_RUN_ID')
          }, indent=2) + '\n')
          PY

      - name: Upload benchmark dashboard artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dreamco-benchmark-dashboard-${{ github.run_id }}
          path: artifacts/benchmark-dashboard
          retention-days: 30

      - name: Upload capability discovery artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dreamco-capability-discovery-${{ github.run_id }}
          path: artifacts/capability_discovery_report.json
          if-no-files-found: warn
          retention-days: 30
