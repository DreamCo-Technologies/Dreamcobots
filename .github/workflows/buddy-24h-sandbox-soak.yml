name: Buddy 24h Sandbox Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read
  actions: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 tools/build_user_money_map.py
      - name: Restore the latest rolling soak history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run=$(gh run list --workflow buddy-24h-sandbox-soak.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ] && [ "$previous_run" != "${{ github.run_id }}" ]; then
            mkdir -p previous-soak
            gh run download "$previous_run" --pattern 'buddy-24h-soak-*' --dir previous-soak || true
            previous_history=$(find previous-soak -type f -name sandbox-24h-history.json -print -quit)
            if [ -n "$previous_history" ]; then
              cp "$previous_history" config/generated/sandbox-24h-history.json
            fi
          fi
      - run: python3 tools/run_24h_sandbox_soak.py
      - run: python3 -m unittest tests.test_build_user_money_map
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: buddy-24h-soak-${{ github.run_id }}
          path: |
            reports/USER_MONEY_MAP.md
            reports/SANDBOX_24H.md
            config/generated/user-money-map.json
            config/generated/sandbox-24h-tick.json
            config/generated/sandbox-24h-history.json
          if-no-files-found: warn
