name: DreamCo Institute Foundry Contracts
on:
  pull_request:
    paths:
      - "config/dreamco_institute_resource_registry.json"
      - "config/masterbot-65-registry.json"
      - "scripts/dreamco_model_foundry.py"
      - "scripts/dreamco_hardware_detector.py"
      - "scripts/train_my_agent.py"
      - "scripts/validate_dreamco_resource_registry.py"
      - "tests/test_dreamco_model_foundry.py"
      - "tests/test_dreamco_resource_registry.py"
      - ".github/workflows/dreamco-institute-foundry-contracts.yml"
  push:
    branches: [main]
    paths:
      - "config/dreamco_institute_resource_registry.json"
      - "config/masterbot-65-registry.json"
      - "scripts/dreamco_model_foundry.py"
      - "scripts/dreamco_hardware_detector.py"
      - "scripts/train_my_agent.py"
      - "scripts/validate_dreamco_resource_registry.py"
      - "tests/test_dreamco_model_foundry.py"
      - "tests/test_dreamco_resource_registry.py"
      - ".github/workflows/dreamco-institute-foundry-contracts.yml"
permissions:
  contents: read
concurrency:
  group: dreamco-institute-foundry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile buyer and registry tooling
        run: python -m py_compile scripts/dreamco_model_foundry.py scripts/dreamco_hardware_detector.py scripts/train_my_agent.py scripts/validate_dreamco_resource_registry.py
      - name: Validate external resource admission registry
        run: python scripts/validate_dreamco_resource_registry.py
      - name: Run Foundry contract tests
        run: python -m unittest tests.test_dreamco_model_foundry tests.test_dreamco_resource_registry -v
