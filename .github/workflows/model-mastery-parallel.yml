name: Model Mastery Parallel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/model-mastery-benchmark-program.json"
      - "config/model-capability-manifest.json"
      - "config/intelligent-task-router.json"
      - "server/model-intelligence-router.ts"
      - "server/model-protocol-compiler.ts"
      - "server/intelligent-task-router.ts"
      - "tests/model-intelligence-router.test.ts"
      - "tests/model-protocol-compiler.test.ts"
      - "tests/intelligent-task-router.test.ts"
      - "tools/assess_model_mastery_parallel.py"
      - ".github/workflows/model-mastery-parallel.yml"
  push:
    branches: [main]
    paths:
      - "config/model-mastery-benchmark-program.json"
      - "config/model-capability-manifest.json"
      - "config/intelligent-task-router.json"
      - "server/model-intelligence-router.ts"
      - "server/model-protocol-compiler.ts"
      - "server/intelligent-task-router.ts"
      - "tests/model-intelligence-router.test.ts"
      - "tests/model-protocol-compiler.test.ts"
      - "tests/intelligent-task-router.test.ts"
      - "tools/assess_model_mastery_parallel.py"
      - ".github/workflows/model-mastery-parallel.yml"

permissions:
  contents: read

concurrency:
  group: model-mastery-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mastery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Explain this action
        run: |
          {
            echo "# Model Mastery Parallel"
            echo
            echo "**Goal:** Give all 32 model-mastery benchmark dimensions an active parallel assessor without paying for 32 duplicate runners or 32 duplicate installs."
            echo "**Shared evidence:** Model selection, provider protocol compilation, and intelligent task routing tests run once."
            echo "**Parallel gap bots:** One lightweight assessor per mastery dimension then evaluates the shared evidence concurrently."
            echo "**Live model cost:** Zero by default. Live/paid model comparisons happen only after shortlisting and approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Shared model routing evidence
        run: node --import tsx --test tests/model-intelligence-router.test.ts tests/model-protocol-compiler.test.ts tests/intelligent-task-router.test.ts
      - name: Run 32 mastery gap assessors in parallel
        run: python3 tools/assess_model_mastery_parallel.py
      - name: Require complete lane coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/generated/model-mastery-gap-report.json').read_text())
          assert d['parallel_lane_count'] == 32
          assert d['maximum_parallel_lanes'] == 32
          assert d['catalog_target_count'] == 500
          assert d['live_calls_executed'] == 0
          assert len(d['dimensions']) == 32
          print({'lanes':d['parallel_lane_count'],'fixture_ready':d['passing_contract_count'],'gaps':d['gap_count'],'live_calls':d['live_calls_executed']})
          PY
      - name: Summarize mastery gaps
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('config/generated/model-mastery-gap-report.json')
          if not p.exists():
              print('## Model mastery report\n\nNo report was produced.')
              raise SystemExit(0)
          d=json.loads(p.read_text())
          print('## Model mastery report')
          print()
          print(f"- Parallel assessor lanes: **{d['parallel_lane_count']}**")
          print(f"- Contract-ready dimensions: **{d['passing_contract_count']}**")
          print(f"- Visible gaps: **{d['gap_count']}**")
          print(f"- Live paid/provider calls: **{d['live_calls_executed']}**")
          print()
          for row in d['dimensions']:
              icon='✅' if row['state']=='passing_contract' else '⚠️'
              print(f"- {icon} `{row['dimension']}` — {row['state']} — owner `{row['owner']}`")
          PY
      - name: Save mastery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-mastery-parallel-${{ github.run_id }}
          path: config/generated/model-mastery-gap-report.json
          if-no-files-found: warn
          retention-days: 14
