name: Buddy Continuous Learning Runner

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  learning-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Connect workflows and benchmarks
        run: python buddy/learning/workflow_benchmark_readiness.py
      - name: Validate learning controller
        run: python -m unittest buddy.learning.registered_runner_test buddy.learning.workflow_benchmark_readiness_test
      - name: Run registered evidence runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python buddy/learning/registered_runner.py \
            --events buddy/learning/workflow_benchmark_events.json \
            --out artifacts/continuous-learning-evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: buddy-continuous-learning-evidence
          path: artifacts/continuous-learning-evidence.json
