name: Actions Failure Watch

on:
  workflow_run:
    workflows:
      - Buddy Actions Test Lab
      - DreamCo Control Center
      - Actions Health
      - Actions Failure Sweep
      - Actions Failure Watch
      - Repository Test Matrix
      - Deploy Buddy Website
      - Builder Issue Reconciler
      - Parallel Benchmark Gap Builders
      - DreamCo Live Dashboard
      - Open Source Evolution
      - Self Working System
      - DreamCo Platform Evolution
      - Engineering Gap Closure
      - Business Data Trade Readiness
      - Code Trust Gate
      - Full System Certification
      - Run Everything Now
      - Government Transparency Refresh
      - CodeQL Security Scan
      - Dependency Review
      - DreamCo CI
      - CI
      - CI Automation Workflows
      - DreamCo Build
      - .github/workflows/dreamcobots_workflows.yml
      - .github/workflows/observability.yml
      - All Bot Sandbox Campaign
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  capture:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.conclusion == 'stale'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_NAME: ${{ github.event.workflow_run.event }}
    steps:
      - name: Create evidence directory
        run: mkdir -p failure-evidence/job-logs
      - name: Collect run and job metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > failure-evidence/run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > failure-evidence/jobs-pages.json
          jq -s '{jobs: map(.jobs // []) | add}' failure-evidence/jobs-pages.json > failure-evidence/jobs.json
          jq -r '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id,.name,.conclusion] | @tsv' failure-evidence/jobs.json > failure-evidence/failed-jobs.tsv || true
      - name: Download failed job logs
        shell: bash
        run: |
          set +e
          while IFS=$'\t' read -r job_id job_name conclusion; do
            [ -z "$job_id" ] && continue
            safe_name=$(printf '%s' "$job_name" | tr -cs 'A-Za-z0-9._-' '_' | cut -c1-80)
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "failure-evidence/job-logs/${job_id}-${safe_name}.txt" 2>/dev/null
          done < failure-evidence/failed-jobs.tsv
          exit 0
      - name: Build failure report and root-cause key
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          jobs=json.loads(Path('failure-evidence/jobs.json').read_text()).get('jobs',[])
          failed=[j for j in jobs if j.get('conclusion') not in (None,'success','skipped')]
          first_job=failed[0].get('name','unknown') if failed else 'unknown-job'
          first_step='unknown-step'
          for job in failed:
              for step in job.get('steps') or []:
                  if step.get('conclusion') not in (None,'success','skipped'):
                      first_job=job.get('name','unknown-job'); first_step=step.get('name','unknown-step'); break
              if first_step != 'unknown-step': break
          workflow=os.environ['WORKFLOW_NAME']
          key=hashlib.sha256(f'{workflow}|{first_job}|{first_step}'.lower().encode()).hexdigest()[:16]
          Path('failure-evidence/root-cause-key.txt').write_text(key+'\n')
          lines=['# DreamCo Actions Failure','',f"Workflow: **{workflow}**",f"Run: **#{os.environ['RUN_NUMBER']}**",f"Conclusion: **{os.environ['RUN_CONCLUSION']}**",f"Event: **{os.environ['EVENT_NAME']}**",f"Commit: `{os.environ['HEAD_SHA']}`",f"Run URL: {os.environ['RUN_URL']}",f"Root-cause key: `{key}`",f"First failing job: **{first_job}**",f"First failing step: **{first_step}**",'','## Failed jobs']
          if not failed: lines.append('- No failed job was returned; inspect run metadata/artifacts.')
          for j in failed:
            lines.append(f"- {j.get('name')} — {j.get('conclusion')} — job {j.get('id')}")
            for step in j.get('steps') or []:
              if step.get('conclusion') not in (None,'success','skipped'):
                lines.append(f"  - step: {step.get('name')} — {step.get('conclusion')}")
          lines += ['', '## Repair lifecycle', '- Detected: capture the failing run and first failing step.', '- Reproduced: establish the smallest reproducible root cause.', '- Repairing: make the smallest safe fix without weakening tests.', '- Verification: run the focused test and dependent regression suite.', '- Resolved: close the issue only after successful verification.']
          Path('failure-evidence/report.md').write_text('\n'.join(lines)+'\n')
          PY
          cat failure-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upsert one root-cause issue
        shell: bash
        run: |
          set -euo pipefail
          key=$(cat failure-evidence/root-cause-key.txt)
          title="DreamCo failure root cause [$key]: $WORKFLOW_NAME"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$key in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file failure-evidence/report.md
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "New evidence for root-cause key $key: run #$RUN_NUMBER — $RUN_URL"
            echo "Updated root-cause issue #$existing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: actions-failure-${{ github.event.workflow_run.id }}
          path: failure-evidence/
          if-no-files-found: warn
          retention-days: 14

  close-resolved:
    if: >-
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Close matching root-cause issues after successful verification
        shell: bash
        run: |
          set -euo pipefail
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$WORKFLOW_NAME in:title" --json number,title --jq '.[] | [.number,.title] | @tsv')
          while IFS=$'\t' read -r number title; do
            [ -z "$number" ] && continue
            if [[ "$title" == *"DreamCo failure root cause"* ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Verification evidence: workflow **$WORKFLOW_NAME** succeeded. Run: $RUN_URL"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
          done <<< "$issues"
