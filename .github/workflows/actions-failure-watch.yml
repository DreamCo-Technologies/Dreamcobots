name: Actions Failure Watch

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: actions-failure-watch-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      ${{ github.event.workflow_run.name != 'Actions Failure Watch' &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.conclusion == 'stale') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_NAME: ${{ github.event.workflow_run.event }}
    steps:
      - name: Create evidence directory
        run: mkdir -p failure-evidence/job-logs
      - name: Collect run and job metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg id "$RUN_ID" \
            --arg number "$RUN_NUMBER" \
            --arg name "$WORKFLOW_NAME" \
            --arg url "$RUN_URL" \
            --arg conclusion "$RUN_CONCLUSION" \
            --arg event "$EVENT_NAME" \
            --arg sha "$HEAD_SHA" \
            '{id: ($id|tonumber), run_number: ($number|tonumber), name: $name, html_url: $url, conclusion: $conclusion, event: $event, head_sha: $sha}' \
            > failure-evidence/run.json
          if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > failure-evidence/jobs-pages.json 2> failure-evidence/jobs-api-error.txt; then
            jq -s '{jobs: map(.jobs // []) | add, availability: "available"}' failure-evidence/jobs-pages.json > failure-evidence/jobs.json
          else
            error="$(head -c 500 failure-evidence/jobs-api-error.txt || true)"
            jq -n --arg reason "$error" '{jobs: [], availability: "unavailable", reason: $reason}' > failure-evidence/jobs.json
          fi
          jq -r '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id,.conclusion] | @tsv' failure-evidence/jobs.json > failure-evidence/failed-jobs.tsv || true
      - name: Download logs for every failed job
        shell: bash
        run: |
          set -euo pipefail
          while read -r job_id conclusion; do
            [ -n "$job_id" ] || continue
            echo "Collecting log for job $job_id: $conclusion"
            if ! curl --fail --silent --show-error --location --max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
              -o "failure-evidence/job-logs/$job_id.zip"; then
              echo "Log download unavailable for job $job_id" >> failure-evidence/job-logs/download-errors.txt
            fi
          done < failure-evidence/failed-jobs.tsv
      - name: Build failure report and root-cause key
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          jobs_doc = json.loads(Path('failure-evidence/jobs.json').read_text())
          jobs = jobs_doc.get('jobs', [])
          metadata_status = jobs_doc.get('availability', 'available')
          metadata_reason = jobs_doc.get('reason', '')
          failed = [j for j in jobs if j.get('conclusion') not in (None, 'success', 'skipped')]
          first_job = failed[0].get('name', 'unknown-job') if failed else ('job-metadata-unavailable' if metadata_status != 'available' else 'unknown-job')
          first_step = 'unknown-step'
          for job in failed:
              for step in job.get('steps') or []:
                  if step.get('conclusion') not in (None, 'success', 'skipped'):
                      first_job = job.get('name', 'unknown-job')
                      first_step = step.get('name', 'unknown-step')
                      break
              if first_step != 'unknown-step':
                  break
          workflow = os.environ['WORKFLOW_NAME']
          key = hashlib.sha256(f'{workflow}|{first_job}|{first_step}'.lower().encode()).hexdigest()[:16]
          Path('failure-evidence/root-cause-key.txt').write_text(key + '\n')
          lines = [
              '# DreamCo Actions Failure', '',
              f"Workflow: **{workflow}**",
              f"Run: **#{os.environ['RUN_NUMBER']}**",
              f"Conclusion: **{os.environ['RUN_CONCLUSION']}**",
              f"Event: **{os.environ['EVENT_NAME']}**",
              f"Commit: `{os.environ['HEAD_SHA']}`",
              f"Run URL: {os.environ['RUN_URL']}",
              f"Root-cause key: `{key}`",
              f"Job metadata: **{metadata_status}**",
              f"First failing job: **{first_job}**",
              f"First failing step: **{first_step}**",
          ]
          if metadata_reason:
              lines += ['', f"Job metadata unavailable: {metadata_reason}"]
          lines += ['', 'Issue filing is disabled. Use the Actions run and this artifact.']
          Path('failure-evidence/report.md').write_text('\n'.join(lines) + '\n')
          PY
          cat failure-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Do not open GitHub issues
        run: echo "Issue filing disabled to stop CI-failure spam and unnecessary spend."
      - name: Save failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actions-failure-${{ github.event.workflow_run.id }}
          path: failure-evidence/
          if-no-files-found: warn
          retention-days: 14
