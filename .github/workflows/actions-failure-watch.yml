name: Actions Failure Watch

on:
  workflow_run:
    workflows:
      - Buddy Actions Test Lab
      - DreamCo Control Center
      - Actions Health
      - Actions Failure Sweep
      - Actions Failure Watch
      - Repository Test Matrix
      - Deploy Buddy Website
      - Builder Issue Reconciler
      - Parallel Benchmark Gap Builders
      - DreamCo Live Dashboard
      - Open Source Evolution
      - Self Working System
      - DreamCo Platform Evolution
      - Engineering Gap Closure
      - Business Data Trade Readiness
      - Code Trust Gate
      - Full System Certification
      - Run Everything Now
      - Government Transparency Refresh
      - CodeQL Security Scan
      - Dependency Review
      - DreamCo CI
      - CI
      - CI Automation Workflows
      - DreamCo Build
      - .github/workflows/dreamcobots_workflows.yml
      - .github/workflows/observability.yml
      - All Bot Sandbox Campaign
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  capture:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.conclusion == 'stale'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      EVENT_NAME: ${{ github.event.workflow_run.event }}
    steps:
      - name: Create evidence directory
        run: mkdir -p failure-evidence/job-logs
      - name: Collect run and job metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > failure-evidence/run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > failure-evidence/jobs-pages.json
          jq -s '{jobs: map(.jobs // []) | add}' failure-evidence/jobs-pages.json > failure-evidence/jobs.json
          jq -r '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id,.name,.conclusion] | @tsv' failure-evidence/jobs.json > failure-evidence/failed-jobs.tsv || true
      - name: Download failed job logs
        shell: bash
        run: |
          set +e
          while IFS=$'\t' read -r job_id job_name conclusion; do
            [ -z "$job_id" ] && continue
            safe_name=$(printf '%s' "$job_name" | tr -cs 'A-Za-z0-9._-' '_' | cut -c1-80)
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "failure-evidence/job-logs/${job_id}-${safe_name}.txt" 2>/dev/null
          done < failure-evidence/failed-jobs.tsv
          exit 0
      - name: Build failure report
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs=json.loads(Path('failure-evidence/jobs.json').read_text()).get('jobs',[])
          failed=[j for j in jobs if j.get('conclusion') not in (None,'success','skipped')]
          lines=['# DreamCo Actions Failure','',f"Workflow: **{os.environ['WORKFLOW_NAME']}**",f"Run: **#{os.environ['RUN_NUMBER']}**",f"Conclusion: **{os.environ['RUN_CONCLUSION']}**",f"Event: **{os.environ['EVENT_NAME']}**",f"Commit: `{os.environ['HEAD_SHA']}`",f"Run URL: {os.environ['RUN_URL']}",'','## Failed jobs']
          if not failed: lines.append('- No failed job was returned; inspect run metadata/artifacts.')
          for j in failed:
            lines.append(f"- {j.get('name')} — {j.get('conclusion')} — job {j.get('id')}")
            for step in j.get('steps') or []:
              if step.get('conclusion') not in (None,'success','skipped'):
                lines.append(f"  - step: {step.get('name')} — {step.get('conclusion')}")
          lines += ['', '## Repair path', '- Inspect the first failing job/step.', '- Fix the smallest reproducible root cause without weakening tests.', '- Re-run the focused job, then the affected dependent suite.', '- Keep blocked or owner-action states visible rather than converting them to success.']
          Path('failure-evidence/report.md').write_text('\n'.join(lines)+'\n')
          PY
          cat failure-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open one repair issue for this failed run
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Actions run $RUN_ID in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Actions run $RUN_ID failed: $WORKFLOW_NAME" --body-file failure-evidence/report.md
          else
            echo "Repair issue already exists: #$existing" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: actions-failure-${{ github.event.workflow_run.id }}
          path: failure-evidence/
          if-no-files-found: warn
          retention-days: 14
