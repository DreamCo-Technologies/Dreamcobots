name: Benchmark Gap Planner
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/benchmark-gap-planner.yml"
      - ".github/workflows/benchmark-evidence-loop.yml"
      - "tools/run_daily_division_benchmarks.ts"
      - "tools/convert_daily_division_benchmark.py"
      - "tools/benchmark_gap_planner.py"
      - "config/benchmark-65-loop.json"
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci
      - name: Measure domain contracts and build the canonical gap queue
        run: |
          set -euo pipefail
          mkdir -p benchmark-evidence
          node --import tsx tools/run_daily_division_benchmarks.ts --concurrency=16 > benchmark-evidence/division-benchmark.json || test -s benchmark-evidence/division-benchmark.json
          python3 tools/convert_daily_division_benchmark.py --input benchmark-evidence/division-benchmark.json --output benchmark-evidence/benchmark-scores.json
          python3 tools/benchmark_gap_planner.py --scores benchmark-evidence/benchmark-scores.json --out benchmark-evidence/benchmark-gap-queue.json
      - name: Validate benchmark conversion and scope separation
        run: python3 -m unittest tests.test_convert_daily_division_benchmark
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-gap-queue-${{ github.run_id }}
          path: benchmark-evidence/
          retention-days: 14
