name: Buddy 1000-Source Learning

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buddy-1000-source-learning
  cancel-in-progress: false

jobs:
  plan-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source-learning policy
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/buddy_1000_source_learning_policy.json')
          d = json.loads(p.read_text())
          assert d['target_source_count'] == 1000
          assert d['source_policy']['authorized_only'] is True
          assert d['compute_policy']['free_first'] is True
          assert d['compute_policy']['early_stop_on_mastery'] is True
          print('1000-source learning policy validated.')
          PY

      - name: Run deterministic benchmark smoke test
        run: |
          python3 benchmarks/buddy_benchmark_runner.py benchmarks/tasks/universal_1000_smoke.json --output /tmp/buddy-benchmark.json

      - name: Run source ranking smoke test
        run: python3 tools/buddy_source_selector.py

      - name: Publish machine-readable learning plan
        run: |
          mkdir -p reports
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('config/buddy_1000_source_learning_policy.json').read_text())
          plan={
            'source_target': policy['target_source_count'],
            'scan_mode': policy['daily_operations']['scan_mode'],
            'benchmark_mode': policy['daily_operations']['benchmark_mode'],
            'free_first': policy['compute_policy']['free_first'],
            'differential_fetch': True,
            'early_stop_on_mastery': True,
            'holdout_required': True,
            'status': 'planning_only_until_source_adapters_are_configured'
          }
          Path('reports/buddy-1000-source-learning-plan.json').write_text(json.dumps(plan, indent=2)+'\n')
          print(json.dumps(plan, indent=2))
          PY
