name: Actions Health

on:
  workflow_dispatch:
  push:
    branches: [main, codex/master-capability-pages]
    paths:
      - ".github/workflows/**"
      - "tools/audit_actions_health.py"
      - "tools/audit_actions_live.py"
      - "tools/refresh_repository_evidence.py"
      - "tools/buddy_failure_learning.py"
      - "tools/buddy_conversation_learning_policy.py"
      - "tests/test_buddy_failure_learning.py"
      - "tests/test_buddy_conversation_learning_policy.py"
      - "tests/test_buddy_universal_learning_governance.py"
      - "config/buddy-conversation-learning-governance.json"
      - "tests/test_actions_health.py"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/audit_actions_health.py"
      - "tools/audit_actions_live.py"
      - "tools/buddy_conversation_learning_policy.py"
      - "tools/buddy_failure_learning.py"
      - "tools/build_dreamco_training_examples.py"
      - "tools/refresh_repository_evidence.py"
      - "tests/test_buddy_failure_learning.py"
      - "tests/test_buddy_conversation_learning_policy.py"
      - "tests/test_actions_health.py"
      - "package.json"
  schedule:
    - cron: "23 12 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: actions-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Refresh deterministic repository evidence
        run: python3 tools/refresh_repository_evidence.py
      - name: Static audit diagnostics
        if: always()
        run: |
          if [ -f config/generated/actions-health-report.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/generated/actions-health-report.json')
          d = json.loads(p.read_text())
          print(f"workflow_count={d.get('workflow_count')}")
          print(f"critical_error_count={d.get('critical_error_count')}")
          print(f"warning_count={d.get('warning_count')}")
          for item in d.get('findings', []):
              for error in item.get('errors', []):
                  print(f"ERROR | {item['workflow']} | {error}")
              for warning in item.get('warnings', []):
                  print(f"WARNING | {item['workflow']} | {warning}")
          PY
          else
            echo "No static audit report was produced."
          fi
      - name: Live audit of GitHub Actions state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_actions_live.py
      - name: Install pytest for function-style Pages feature tests
        run: python3 -m pip install --quiet pytest
      - name: Verify Actions-page contracts
        if: always()
        run: |
          python3 -m unittest tests.test_actions_health
          python3 -m unittest tests.test_buddy_failure_learning
          python3 -m unittest tests.test_buddy_conversation_learning_policy
          python3 -m unittest tests.test_buddy_universal_learning_governance
          python3 -m pytest -q tests/test_pages_feature_audit.py tests/test_file_prospectus.py
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
          npm run test:actions-page
      - name: Add reports to summary
        if: always()
        run: |
          for report in reports/ACTIONS_HEALTH_REPORT.md reports/ACTIONS_LIVE_HEALTH.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; printf '\n\n' >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Save complete Actions health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actions-health-${{ github.run_id }}
          path: |
            reports/ACTIONS_HEALTH_REPORT.md
            reports/ACTIONS_LIVE_HEALTH.md
            config/generated/actions-health-report.json
            config/generated/actions-live-health.json
            website/data/actions-health-report.json
            website/data/actions-live-health.json
          if-no-files-found: warn
          retention-days: 30
