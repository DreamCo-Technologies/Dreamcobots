name: Core Capability Benchmark Definitions

on:
  pull_request:
    paths:
      - "config/buddy-benchmark-task-registry.json"
      - "config/buddy-core-capability-benchmark-definitions.json"
      - "tools/validate_core_capability_benchmarks.py"
      - "tests/test_core_capability_benchmarks.py"
      - ".github/workflows/core-capability-benchmark-definitions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-benchmark-definitions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_core_capability_benchmarks.py
      - run: python tools/validate_core_capability_benchmarks.py
