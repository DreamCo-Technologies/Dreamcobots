name: Buddy Bootcamp - freeCodeCamp Catalog
on:
  pull_request:
    paths:
      - "buddy/bootcamp/sources/freecodecamp/**"
      - "tools/sync_freecodecamp_catalog.py"
      - "tests/test_freecodecamp_catalog.py"
      - ".github/workflows/buddy-bootcamp-freecodecamp.yml"
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: buddy-bootcamp-freecodecamp-catalog
  cancel-in-progress: false
jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata enumerator
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Discover and categorize public video metadata
        run: python tools/sync_freecodecamp_catalog.py
      - name: Validate catalog and taxonomy
        run: |
          python tools/sync_freecodecamp_catalog.py --check
          python -m unittest tests.test_freecodecamp_catalog -v
      - name: Propose catalog refresh
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/freecodecamp-catalog
          delete-branch: false
          add-paths: buddy/bootcamp/sources/freecodecamp/catalog.json
          commit-message: "chore: refresh freeCodeCamp video catalog"
          title: "chore: refresh freeCodeCamp video catalog"
          body: |
            Refreshes the public freeCodeCamp video metadata catalog and keyword categories.
            This does not download video/audio, ingest transcripts, or authorize model training.
