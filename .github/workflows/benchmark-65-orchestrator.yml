name: Legacy 65-Division Benchmark Registry Audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/masterbot-65-registry.json"
      - "config/benchmark-65-loop.json"
      - "tools/validate_masterbot_registry.py"
      - "tools/audit_markdown_requirement_traceability.py"
permissions:
  contents: read
jobs:
  registry-audit:
    name: Validate real registry and requirement inventory
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate canonical 65-MasterBot registry
        run: python3 tools/validate_masterbot_registry.py
      - name: Audit Markdown requirements
        run: python3 tools/audit_markdown_requirement_traceability.py
      - name: Preserve actual audit evidence (not placeholder benchmark results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-registry-audit-${{ github.run_id }}
          path: artifacts/requirement-traceability/
          if-no-files-found: warn
          retention-days: 30
