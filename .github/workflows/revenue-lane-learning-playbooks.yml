name: Revenue Lane Learning Playbooks

on:
  pull_request:
    paths:
      - "money_os/config/revenue_lanes_expanded.json"
      - "money_os/config/revenue_lane_learning_playbooks.json"
      - "tools/validate_revenue_lane_learning_playbooks.py"
      - "tests/test_revenue_lane_learning_playbooks.py"
      - ".github/workflows/revenue-lane-learning-playbooks.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: revenue-lane-playbooks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_revenue_lane_learning_playbooks.py
      - run: python tools/validate_revenue_lane_learning_playbooks.py
