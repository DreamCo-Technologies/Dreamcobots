name: DreamCo Institute
on:
  pull_request:
    paths:
      - "config/dreamco-institute-academic-catalog.json"
      - "config/institute-competitive-benchmark-policy.json"
      - "config/institute-competitive-baselines.json"
      - "scripts/benchmark_vs_baselines.py"
      - "tests/test_institute_competitive_benchmark.py"
      - "buddy/registrar/**"
      - "tools/build_dreamco_institute_catalog.py"
      - "tests/test_dreamco_institute_*.py"
      - "tests/test_institute_competitive_benchmark.py"
      - "docs/institute/COMPETITIVE_MODEL_LAB.md"
      - "package.json"
      - "website/dreamco-institute.*"
      - "website/data/dreamco-institute-academic-catalog.json"
      - ".github/workflows/dreamco-institute.yml"
  push:
    branches: [main]
    paths:
      - "config/dreamco-institute-academic-catalog.json"
      - "buddy/registrar/**"
      - "tools/build_dreamco_institute_catalog.py"
      - "tests/test_dreamco_institute_*.py"
      - "website/dreamco-institute.*"
      - "website/data/dreamco-institute-academic-catalog.json"
      - ".github/workflows/dreamco-institute.yml"
permissions:
  contents: read
jobs:
  academic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registrar and academic credit rules
        run: npm run test:institute
      - name: Validate static catalog synchronization
        run: python tools/build_dreamco_institute_catalog.py --check
