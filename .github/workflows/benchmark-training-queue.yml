name: Benchmark Training Queue
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Benchmark Evidence Loop"]
    types: [completed]
permissions:
  contents: read
jobs:
  queue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate latest evidence artifact
        run: |
          mkdir -p benchmark-evidence
          echo '{"queue":[]}' > benchmark-evidence/benchmark-gap-queue.json
      - name: Build training queue
        run: python3 tools/build_benchmark_training_queue.py --gaps benchmark-evidence/benchmark-gap-queue.json --out benchmark-evidence/benchmark-training-queue.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-training-queue-${{ github.run_id }}
          path: benchmark-evidence/benchmark-training-queue.json
          retention-days: 14
