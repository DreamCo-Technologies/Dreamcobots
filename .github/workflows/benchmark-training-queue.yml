name: Benchmark Training Queue
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Benchmark Evidence Loop"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  queue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: benchmark-evidence-*
          path: benchmark-evidence
          merge-multiple: true
      - name: Build training queue from measured evidence
        run: |
          test -f benchmark-evidence/benchmark-gap-queue.json
          python3 tools/build_benchmark_training_queue.py \
            --gaps benchmark-evidence/benchmark-gap-queue.json \
            --out benchmark-evidence/benchmark-training-queue.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-training-queue-${{ github.run_id }}
          path: benchmark-evidence/benchmark-training-queue.json
          retention-days: 14
