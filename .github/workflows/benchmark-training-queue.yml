name: Benchmark Training Queue
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Benchmark Evidence Loop run ID with required benchmark artifacts"
        required: true
        type: string
  workflow_run:
    workflows: ["Benchmark Evidence Loop"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  queue:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate upstream benchmark evidence provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: python3 tools/validate_benchmark_upstream_run.py --run-id "$SOURCE_RUN_ID" --expected "Benchmark Evidence Loop"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          pattern: benchmark-evidence-*
          path: benchmark-evidence
          merge-multiple: true
      - name: Build training queue from measured evidence
        run: |
          test -f benchmark-evidence/benchmark-gap-queue.json
          python3 tools/build_benchmark_training_queue.py \
            --gaps benchmark-evidence/benchmark-gap-queue.json \
            --out benchmark-evidence/benchmark-training-queue.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-training-queue-${{ github.run_id }}
          path: benchmark-evidence/benchmark-training-queue.json
          retention-days: 14
