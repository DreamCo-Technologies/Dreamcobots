name: Actions Failure Sweep

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/actions-failure-sweep.yml'
  schedule:
    - cron: "11 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository context
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan recent runs from every workflow with pagination
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sweep
          created_range="$(date -u -d '24 hours ago' '+%Y-%m-%d')..$(date -u '+%Y-%m-%d')"
          success=0
          for attempt in 1 2 3; do
            : > sweep/run-lines.json
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&created=$created_range" --jq '.workflow_runs[]' > sweep/run-lines.json; then
              success=1
              break
            fi
            echo "GitHub Actions API request failed on attempt $attempt/3; retrying with bounded backoff." >&2
            case "$attempt" in
              1) sleep 15 ;;
              2) sleep 30 ;;
            esac
          done
          if [ "$success" -ne 1 ]; then
            echo "GitHub Actions API remained unavailable after 3 attempts; preserving failure state." >&2
            exit 1
          fi
          jq -s '.' sweep/run-lines.json > sweep/runs.json
          python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          rows=json.loads(Path('sweep/runs.json').read_text())
          cutoff=datetime.now(timezone.utc)-timedelta(hours=24)
          bad=[]
          for row in rows:
              if row.get('status')!='completed' or row.get('conclusion') not in {'failure','timed_out','action_required','stale'}:
                  continue
              try: dt=datetime.fromisoformat(row.get('created_at','').replace('Z','+00:00'))
              except Exception: dt=cutoff
              if dt>=cutoff: bad.append(row)
          Path('sweep/failures.json').write_text(json.dumps(bad,indent=2)+'\n')
          lines=['# Actions Failure Sweep','',f'Recent failed runs (24h): **{len(bad)}**','',f'Runs inspected across paginated API results: **{len(rows)}**','']
          for row in bad:
              lines.append(f"- {row.get('name')} — {row.get('conclusion')} — run {row.get('id')} — {row.get('html_url')}")
          if not bad: lines.append('- No failed/timed-out/action-required/stale runs found in the last 24 hours.')
          Path('sweep/report.md').write_text('\n'.join(lines)+'\n')
          PY
          cat sweep/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Group failures into read-only triage evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/actions_failure_triage.py \
            --input sweep/failures.json \
            --output sweep/triage.json \
            --summary sweep/triage.md
          cat sweep/triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save sweep evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: actions-failure-sweep-${{ github.run_id }}
          path: sweep/
          if-no-files-found: warn
          retention-days: 14
