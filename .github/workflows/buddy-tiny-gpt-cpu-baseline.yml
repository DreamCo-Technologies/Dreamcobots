name: Buddy TinyGPT CPU Baseline

on:
  pull_request:
    paths:
      - "buddy/modeling/**"
      - "tests/test_tiny_gpt_baseline.py"
      - "tools/run_tiny_gpt_baseline.py"
      - "requirements-buddy-gpt.txt"
      - ".github/workflows/buddy-tiny-gpt-cpu-baseline.yml"
  push:
    branches: [main]
    paths:
      - "buddy/modeling/**"
      - "tests/test_tiny_gpt_baseline.py"
      - "tools/run_tiny_gpt_baseline.py"
      - "requirements-buddy-gpt.txt"
      - ".github/workflows/buddy-tiny-gpt-cpu-baseline.yml"

permissions:
  contents: read

concurrency:
  group: buddy-tiny-gpt-baseline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  cpu-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-buddy-gpt.txt
      - name: Run TinyGPT tests
        run: python -m unittest discover -s tests -p 'test_tiny_gpt_baseline.py' -v
      - name: Generate deterministic baseline evidence
        run: python tools/run_tiny_gpt_baseline.py --output /tmp/buddy-tiny-gpt-baseline.json
