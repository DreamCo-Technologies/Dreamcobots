name: Buddy Continuous Repair

on:
  workflow_dispatch:
  schedule:
    # Continuous health/repair sweep, hourly throughout the day.
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Actions Health
      - Keep Green
      - DreamCo Core Health
      - Fleet Runtime Truth
      - Buddy Failure Learning Regression
      - Buddy Learning Regression
      - Buddy Sandbox Bootcamp
      - Repository Test Matrix
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: buddy-continuous-repair-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  safe-repair:
    name: Diagnose, safely repair, and verify
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout protected default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install audit and test dependencies
        run: |
          python3 -m pip install --quiet pyyaml pytest
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi

      - name: Record failed workflow context
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p reports/continuous-repair
          gh run view "$FAILED_RUN_ID" --json databaseId,name,conclusion,headSha,url,jobs             > "reports/continuous-repair/failed-run-$FAILED_RUN_ID.json"

      - name: Index repair history and diagnose failed jobs
        if: github.event_name == 'workflow_run'
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reports/continuous-repair
          python3 tools/study_buddy_repair_history.py --limit 500 --output reports/continuous-repair/historical-repair-index.json
          python3 -m tools.build_buddy_failure_observations \
            --run "reports/continuous-repair/failed-run-$FAILED_RUN_ID.json" \
            --repository "$GITHUB_REPOSITORY" \
            --historical-index reports/continuous-repair/historical-repair-index.json \
            --memory artifacts/failure-learning-memory.json \
            --output reports/continuous-repair/historical-diagnosis.json
          {
            echo "## Buddy historical repair diagnosis"
            echo "- Failed run: $FAILED_RUN_ID"
            echo "- Historical matches are investigation-only and cannot be applied automatically."
            echo "- No incident memory or training data is written by this step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture current Actions state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_actions_live.py

      - name: Refresh deterministic repository evidence
        run: python3 tools/refresh_repository_evidence.py

      - name: Verify repair-learning and Actions health
        run: |
          python3 -m unittest tests.test_actions_health
          python3 -m unittest tests.test_buddy_failure_learning tests.test_build_buddy_failure_observations
          python3 -m pytest -q tests/test_pages_feature_audit.py tests/test_file_prospectus.py

      - name: Verify public Actions page
        run: npm run test:actions-page

      - name: Summarize repair scope
        if: always()
        run: |
          {
            echo "## Buddy Continuous Repair"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Hourly schedule: enabled"
            echo "- Failed workflow run: ${{ github.event.workflow_run.html_url || 'not applicable' }}"
            echo "- Repair boundary: deterministic evidence refresh and regression-verified changes only\n            - PR creation: disabled by repository policy; verified changes are packaged for human review"
            echo "- Production deployment and direct pushes to main: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: buddy-continuous-repair-${{ github.run_id }}
          path: |
            reports/continuous-repair/**
            reports/ACTIONS_HEALTH_REPORT.md
            reports/ACTIONS_LIVE_HEALTH.md
            config/generated/actions-health-report.json
            config/generated/actions-live-health.json
          if-no-files-found: warn
          retention-days: 30

      - name: Package verified changes for manual review
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/continuous-repair
          git add -N -- config/generated reports 2>/dev/null || true
          if ! git diff --quiet -- config/generated reports; then
            git diff --check -- config/generated reports
            git diff --binary -- config/generated reports > reports/continuous-repair/proposed-repair.patch
            {
              echo "## Human review handoff"
              echo "- Verified generated/evidence changes were packaged as an artifact."
              echo "- Automatic PR creation is unavailable because the repository does not permit GITHUB_TOKEN to create pull requests."
              echo "- No PR, merge, direct push to main, or deployment was attempted."
              echo
              git diff --stat -- config/generated reports
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Human review handoff"
              echo "- No generated/evidence changes were produced; no patch artifact is required."
              echo "- Automatic PR creation remains disabled by repository policy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update a human-triage issue if verification fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Buddy Auto-Repair] Human review required";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failedRun = context.payload.workflow_run?.html_url || "Scheduled health sweep";
            const body = [
              "The continuous repair loop could not complete its safe repair and verification sequence.",
              "",
              `- Repair run: ${runUrl}`,
              `- Triggering failed workflow: ${failedRun}`,
              "- The loop does not bypass failing tests, alter protected production state, or merge its own changes.",
              "- Inspect the run log and uploaded diagnostics, repair the root cause, and rerun the checks."
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = open.data.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
