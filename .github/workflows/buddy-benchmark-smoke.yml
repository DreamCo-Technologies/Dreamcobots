name: buddy-benchmark-smoke
on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'config/buddy_universal_benchmark.yaml'
      - 'schemas/benchmarks/**'
      - 'buddy/learning/**'
      - 'tools/record_buddy_benchmark_learning.py'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic benchmark
        run: python3 benchmarks/buddy_benchmark_runner.py benchmarks/tasks/universal_1000_smoke.json --output /tmp/buddy-benchmark.json
      - name: Record Buddy learning evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/record_buddy_benchmark_learning.py /tmp/buddy-benchmark.json \
            --output /tmp/buddy-learning-evidence.json \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Validate result shape
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/buddy-benchmark.json')
          data = json.loads(p.read_text())
          assert data['benchmark_id'] == 1000
          assert data['free_first'] is True
          assert data['cost_usd'] == 0.0
          assert isinstance(data['results'], list)
          evidence = json.loads(Path('/tmp/buddy-learning-evidence.json').read_text())
          assert evidence['schema'] == 'dreamco.buddy.benchmark_learning_evidence.v1'
          assert len(evidence['records']) == len(data['results'])
          print('Buddy benchmark and learning evidence are structurally valid.')
          PY
      - name: Upload Buddy learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: buddy-benchmark-learning-evidence
          path: /tmp/buddy-learning-evidence.json
          if-no-files-found: error
