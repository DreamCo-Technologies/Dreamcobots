name: DreamCo Model Foundry Buyer Kits
on:
  pull_request:
    paths:
      - "scripts/dreamco_model_foundry.py"
      - "scripts/dreamco_hardware_detector.py"
      - "scripts/train_my_agent.py"
      - "tests/test_dreamco_model_foundry.py"
      - "config/masterbot-65-registry.json"
      - "config/authorized-training-datasets/manifest.json"
      - "config/dreamco_institute_resource_registry.json"
      - "scripts/validate_dreamco_resource_registry.py"
      - "tests/test_dreamco_resource_registry.py"
      - "tools/build_dreamco_institute_resource_plan.py"
      - "tests/test_dreamco_institute_resource_plan.py"
      - ".github/workflows/dreamco-model-foundry-kits.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dreamco-model-foundry-kits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  buyer-kit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile foundry scripts
        run: python -m compileall -q scripts/dreamco_model_foundry.py scripts/dreamco_hardware_detector.py scripts/train_my_agent.py scripts/validate_dreamco_resource_registry.py
      - name: Run buyer kit contract tests
        run: python -m unittest tests.test_dreamco_model_foundry -v
      - name: Validate external resource registry
        run: python scripts/validate_dreamco_resource_registry.py
      - name: Run external resource registry tests
        run: python -m unittest tests.test_dreamco_resource_registry -v
      - name: Run 65-division resource routing plan tests
        run: python -m unittest tests.test_dreamco_institute_resource_plan -v
      - name: Build metadata-only resource routing plan
        run: python tools/build_dreamco_institute_resource_plan.py --output "$RUNNER_TEMP/dreamco-resource-plan.json"
      - name: Validate catalog count
        run: |
          python scripts/dreamco_model_foundry.py --catalog-only --output "$RUNNER_TEMP/dreamco-commercial-kits"
          python - <<'PY'
import json, os
from pathlib import Path
p = Path(os.environ['RUNNER_TEMP']) / 'dreamco-commercial-kits' / 'CATALOG.json'
d = json.loads(p.read_text(encoding='utf-8'))
assert d['kit_count'] == 250, f"expected 250 total SKUs, found {d['kit_count']}"
assert d['masterbot_kit_count'] == 195, f"expected 195 MasterBot kits, found {d.get('masterbot_kit_count')}"
assert d['business_profile_kit_count'] == 55, f"expected 55 business-profile kits, found {d.get('business_profile_kit_count')}"
assert len({item['sku'] for item in d['kits']}) == 250, 'catalog SKUs must be unique'
assert all(item.get('weights_included') is False for item in d['kits']), 'blueprint catalog must not include pretrained weights'
assert all(item.get('weights_status') == 'UNTRAINED_BLUEPRINT_READY_FOR_TRAINING' for item in d['kits']), 'every catalog SKU must remain explicitly untrained'
print('Validated 250 unique untrained SKUs: 195 MasterBot + 55 business-profile kits')
PY
