name: Keep Green

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: keep-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Actions page contract
        run: python3 tools/validate_actions_page.py
      - name: Validate Python syntax for touched intelligence code
        run: python3 -m compileall -q buddy_os tests
      - name: Run JSON validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_repository_json.py'
      - name: Validate JSON files
        run: python3 tools/validate_repository_json.py

  actions-page-tests:
    name: Actions page tests
    runs-on: ubuntu-latest
    needs: repository-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies when package-lock exists
        run: npm ci --ignore-scripts
        if: hashFiles('package-lock.json') != ''
      - name: Run Actions page test suite
        run: npm run test:actions-page

  keep-green-policy:
    name: Keep-green policy
    runs-on: ubuntu-latest
    needs: [repository-contract, actions-page-tests]
    if: always()
    steps:
      - name: Require all gates to pass
        env:
          CONTRACT: ${{ needs.repository-contract.result }}
          ACTIONS_TESTS: ${{ needs.actions-page-tests.result }}
        run: |
          test "$CONTRACT" = success
          test "$ACTIONS_TESTS" = success
          echo "KEEP GREEN: all mandatory repository gates passed."
