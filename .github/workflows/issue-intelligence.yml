name: Issue Intelligence

on:
  workflow_run:
    workflows: ["Buddy Sandbox Bootcamp", "Actions Page Gate", "Actions Health", "Repository System Watch", "Buddy Preventive Engineering"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-intelligence-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage completed workflow
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure status:new label exists
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/labels?per_page=100" --paginate --jq '.[].name' | grep -Fxq "status:new"; then
            gh label create "status:new" --color "1D76DB" --description "New issue awaiting triage"
          fi
      - name: Run failure triage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tools/issue_intelligence.py
