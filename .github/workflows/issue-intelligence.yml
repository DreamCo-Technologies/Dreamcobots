name: Issue Intelligence

on:
  workflow_run:
    workflows: ["Buddy Sandbox Bootcamp", "Actions Page Gate", "Actions Health", "Repository System Watch", "Buddy Preventive Engineering"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-intelligence
  cancel-in-progress: false

jobs:
  triage:
    name: Triage completed workflow
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure issue labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            'ci-failure:B60205:GitHub Actions failure' \
            'severity:high:D73A4A:High severity CI issue' \
            'severity:medium:FBCA04:Medium severity CI issue' \
            'severity:low:0E8A16:Low severity CI issue' \
            'ci:dependency:5319E7:Dependency failure' \
            'ci:test:5319E7:Test failure' \
            'ci:lint:5319E7:Lint failure' \
            'ci:build:5319E7:Build failure' \
            'ci:configuration:5319E7:Configuration failure' \
            'ci:permissions:5319E7:Permissions failure' \
            'ci:timeout:5319E7:Timeout failure' \
            'ci:workflow:5319E7:Workflow failure'; do
            IFS=: read -r name color description <<< "$spec"
            gh label create "$name" --color "$color" --description "$description" --force || true
          done
      - name: Run failure triage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tools/issue_intelligence.py
