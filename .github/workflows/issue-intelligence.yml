name: Issue Intelligence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed GitHub Actions run ID to triage
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-intelligence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage completed workflow
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure status:new label exists
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/labels?per_page=100" --paginate --jq '.[].name' | grep -Fxq "status:new"; then
            gh label create "status:new" --color "1D76DB" --description "New issue awaiting triage"
          fi
      - name: Run failure triage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: python3 tools/issue_intelligence.py
