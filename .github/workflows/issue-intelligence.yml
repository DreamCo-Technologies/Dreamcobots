name: Issue Intelligence

on:
  workflow_run:
    workflows: ["Buddy Sandbox Bootcamp", "Actions Page Gate", "Actions Health", "Repository System Watch", "Buddy Preventive Engineering"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: issue-intelligence-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage completed workflow
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Ensure issue labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/labels?per_page=100" --paginate --jq '.[].name')"
          while IFS='|' read -r name color description; do
            if grep -Fxq "$name" <<< "$existing"; then
              continue
            fi
            gh label create "$name" --color "$color" --description "$description" || true
            existing="$(printf '%s\n%s' "$existing" "$name")"
          done <<'LABELS'
          ci-failure|B60205|GitHub Actions failure
          severity:high|D73A4A|High severity CI issue
          severity:medium|FBCA04|Medium severity CI issue
          severity:low|0E8A16|Low severity CI issue
          ci:dependency|5319E7|Dependency failure
          ci:test|5319E7|Test failure
          ci:lint|5319E7|Lint failure
          ci:build|5319E7|Build failure
          ci:configuration|5319E7|Configuration failure
          ci:permissions|5319E7|Permissions failure
          ci:timeout|5319E7|Timeout failure
          ci:workflow|5319E7|Workflow failure
          status:new|1D76DB|New issue awaiting triage
          status:investigating|FBCA04|Root cause investigation in progress
          status:fixing|D93F0B|A repair is being implemented
          status:retest|5319E7|Repair is undergoing verification
          status:blocked|B60205|Blocked pending an owner action or dependency
          status:resolved|0E8A16|Verified resolved with passing evidence
          LABELS
      - name: Run failure triage
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 tools/issue_intelligence.py
