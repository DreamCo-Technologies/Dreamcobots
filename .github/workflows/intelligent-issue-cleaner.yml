name: Intelligent Issue Cleaner

# Read-only review of up to 500 open issues each hour.
# Never closes or labels issues without independently verified resolution evidence.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read-only; mutations are disabled regardless of this input"
        required: false
        default: "true"
      batch_size:
        description: "Max issues to scan this run"
        required: false
        default: "500"
      keep_per_workflow:
        description: "Newest CI failure issues to keep per workflow"
        required: false
        default: "2"

permissions:
  contents: read
  issues: read

concurrency:
  group: intelligent-issue-cleaner
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '500' }}
      KEEP_PER_WORKFLOW: ${{ github.event.inputs.keep_per_workflow || '2' }}
      DRY_RUN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run intelligent cleaner
        run: python3 tools/issue_cleaner/clean_issues.py
