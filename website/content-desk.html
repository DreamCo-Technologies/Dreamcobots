<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy content desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="nav-placeholder"></div>
  <script src="nav.js"></script>
  <main class="container">
    <h1>Content desk</h1>
    <p>The script costs $0 here. Buddy does not bill you. Play uses this browser's voice, not a cloned person. A poster is drawn type, not a copied face.</p>
    <form id="content-form" class="card">
      <p><label>What is it about? <input id="subject" required placeholder="how to frost a cake"></label></p>
      <p><label>Type <select id="kind"></select></label></p>
      <p><label>When you will post <input id="when" placeholder="Friday 6pm"></label></p>
      <p><label>Link, if you want one <input id="link" placeholder="https://example.com"></label></p>
      <button class="btn btn-primary" type="submit">Write this type</button>
      <button class="btn btn-outline" id="lineup" type="button">One line for every type</button>
    </form>
    <p id="learned">Loading the format rules.</p>
    <ul id="drafts"></ul>
    <pre id="packet">Nothing made yet.</pre>
    <p><button class="btn btn-outline" id="save" type="button">Download</button>
      <button class="btn btn-outline" id="speak" type="button">Play in this browser</button>
      <button class="btn btn-outline" id="poster" type="button">Draw a poster</button></p>
    <canvas id="poster-board" width="640" height="360" hidden></canvas>
    <form id="clone-form" class="card">
      <p>Voice or image copy</p>
      <p><label>Kind <select id="clone-kind"><option value="voice">Voice</option><option value="image">Image</option></select></label></p>
      <p><label><input id="clone-mine" type="checkbox"> This sample is mine</label></p>
      <p><label><input id="clone-consent" type="checkbox"> I agree it stays a note on this device</label></p>
      <button class="btn btn-outline" type="submit">Check the copy</button>
      <p id="clone-status">No copy checked yet.</p>
    </form>
  </main>
  <script src="content-desk.js"></script>
</body>
</html>
