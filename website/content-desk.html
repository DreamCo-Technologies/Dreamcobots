<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buddy content desk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="nav-placeholder"></div>
  <script src="nav.js"></script>
  <main class="container">
    <h1>Content desk</h1>
    <p>Same path as a creator assistant: an idea, a shoot plan, and a caption you can publish. Buddy does not render a video and does not post to Instagram, Facebook, or WhatsApp.</p>
    <form id="content-form" class="card">
      <p><label>What is it about? <input id="subject" required placeholder="how to frost a cake"></label></p>
      <p><label>When you will post <input id="when" placeholder="Friday 6pm"></label></p>
      <p><label>Link, if you want one <input id="link" placeholder="https://example.com"></label></p>
      <button class="btn btn-primary" type="submit">Make the packet</button>
    </form>
    <pre id="packet">Nothing made yet.</pre>
    <p><button class="btn btn-outline" id="save" type="button">Download</button></p>
  </main>
  <script src="content-desk.js"></script>
</body>
</html>
