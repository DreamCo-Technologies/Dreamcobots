<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Score system | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Scores</p><h1>Learning scores</h1><p>Each lesson starts not measured. Run all does not invent a score.</p></div>
<p><button class="btn btn-primary" id="run-all-scores" type="button">Run all scores</button></p>
<p id="score-status">No score measured.</p></header>
<section class="actions-review" id="scores"></section>
</main>
<script>
fetch("score-paths.json").then((response) => response.json()).then((data) => {
  const box = document.getElementById("scores");
  (data.paths || []).forEach((name) => { const button = document.createElement("button"); button.className = "btn btn-outline"; button.type = "button"; button.textContent = name; button.addEventListener("click", () => { document.getElementById("score-status").textContent = name + ": not measured."; }); box.appendChild(button); });
  document.getElementById("run-all-scores").addEventListener("click", () => { document.getElementById("score-status").textContent = (data.paths || []).length + " lessons. All not measured."; });
});
</script>
</body></html>
