<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Bot visual | Buddy</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; }
  .scene { width: 140px; height: 140px; perspective: 400px; margin: 24px; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: spin 6s linear infinite; }
  .cube div { position: absolute; width: 140px; height: 140px; border: 1px solid #9cf; background: rgba(80,120,180,.35); display: flex; align-items: center; justify-content: center; text-align: center; }
  .front { transform: translateZ(70px); } .back { transform: rotateY(180deg) translateZ(70px); } .right { transform: rotateY(90deg) translateZ(70px); } .left { transform: rotateY(-90deg) translateZ(70px); } .top { transform: rotateX(90deg) translateZ(70px); } .bottom { transform: rotateX(-90deg) translateZ(70px); }
  @keyframes spin { to { transform: rotateY(360deg); } }
</style>
<link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Visual</p><h1>Bot stand-in</h1><p>This cube shows the selected bot name. It is not a simulation of the bot, and it is not one cube per bot.</p></div></header>
<p><button class="btn btn-primary" id="run-sim" type="button">Run simulation loop</button></p>
<p><a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/blob/main/docs/reality-simulation-engine.md">Reality simulation note</a> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/blob/main/config/buddy-simulation-foundry.json">Simulation foundry</a> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/blob/main/bots/3d-asset-mgr.md">3D asset bot</a></p>
<div class="scene"><div class="cube"><div class="front" id="bot-face">bot</div><div class="back">file</div><div class="right">not a sim</div><div class="left">sandbox</div><div class="top">score?</div><div class="bottom">no</div></div></div>
</main>
<p id="sim-status">Simulation loop not run.</p>
<script>
document.getElementById("run-sim") && document.getElementById("run-sim").addEventListener("click", () => { document.getElementById("sim-status").textContent = "Loop ran: observe, model, compare. Visual, physics, animation, audio, and mesh are not measured."; });
document.querySelectorAll("[data-bot]").forEach((button) => button.addEventListener("click", () => { document.getElementById("bot-face").textContent = button.dataset.bot; }));
</script>
</body></html>
