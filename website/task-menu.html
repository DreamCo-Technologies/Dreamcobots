<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Task menu | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Tasks</p><h1>Task menu</h1><p>A task routes to the first listed model. Scores are not measured, and no weights are modified.</p></div></header>
<section class="actions-review" id="tasks"></section>
<p id="task-status">No task selected.</p>
</main>
<script>
["plan","research","code","debug","test","review","deploy","data","browser"].forEach((name) => { const button = document.createElement("button"); button.className = "btn btn-outline"; button.type = "button"; button.textContent = name; button.addEventListener("click", () => { document.getElementById("task-status").textContent = name + " selected. Model score not measured."; }); document.getElementById("tasks").appendChild(button); });
</script>
</body></html>
