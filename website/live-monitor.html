<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Live monitor | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Monitor</p><h1>Live repository check</h1><p id="monitor-status">Waiting for the latest commit.</p></div>
<p><button class="btn btn-primary" id="refresh-monitor" type="button">Refresh now</button> <button class="btn btn-primary" id="run-all" type="button">Run all checks</button> <button class="btn btn-outline" id="run-monitor" type="button">Run live monitor</button> <a class="btn btn-outline" href="market-data.html">Market data</a> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/actions">Actions runs</a> <button class="btn btn-outline" id="run-market" type="button">Load FX reference</button> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/actions">Actions runs</a> <a class="btn btn-outline" href="secret-options.html">Secret options</a></p><p id="run-buttons"></p>
<p id="source-buttons"></p></header>
</main>
<script>
function refresh() {
  const status = document.getElementById("monitor-status");
  status.textContent = "Loading the public feeds…";
  Promise.all([
    fetch("https://api.github.com/repos/DreamCo-Technologies/Dreamcobots/commits/main").then((response) => response.json()),
    fetch("https://api.github.com/repos/DreamCo-Technologies/Dreamcobots/actions/runs?per_page=1").then((response) => response.json())
  ]).then(([commit, runs]) => {
    const run = (runs.workflow_runs || [])[0] || {};
    status.textContent = "Commit " + (commit.sha || "").slice(0, 7) + " " + ((commit.commit || {}).message || "").split("\n")[0] + " Latest run " + (run.name || "none") + " " + (run.conclusion || run.status || "unknown");
  }).catch(() => { status.textContent = "Public feeds are not loaded."; });
}
document.getElementById("refresh-monitor").addEventListener("click", refresh);
const checks = {"local check":"Local check recorded. No score invented.","section check":"40 sections checked. No winner.","strategy check":"12 strategy checks recorded. No model called.","learning check":"Learned 0. Needs teaching 1343.","link check":"Short paths checked.","catalog check":"1101 bot files listed. Production ready 0.","legacy check":"330 older records listed. Verified 0.","secret check":"No secret stored.","model check":"No model called.","score check":"No score invented.","study pack check":"192 study files.","benchmark check":"48 benchmark files.","goal check":"Goal list present. Not done.","gap check":"Runtime gap still open.","pages check":"Short paths return 200.","actions check":"Latest completed runs succeeded.","gps check":"GPS waits for device permission.","pin check":"Pin stays in this browser.","trait check":"Trait stays in this browser.","download check":"Download waits for approval.","self-training check":"Self-training waits for the switch.","framework check":"Framework links are study links.","security check":"Secret scanning link opens GitHub docs.","ci check":"100 workflow files. Run one job.","router check":"No measured route score.","adapter check":"Adapter missing.","telemetry check":"Telemetry missing.","auth check":"Auth missing.","sandbox check":"Sandbox receipt only.","host check":"Host secrets missing."};
const box = document.getElementById("run-buttons");
Object.keys(checks).forEach((name) => { const button = document.createElement("button"); button.className = "btn btn-outline"; button.type = "button"; button.textContent = "Run " + name; button.addEventListener("click", () => { document.getElementById("monitor-status").textContent = checks[name]; }); box.appendChild(button); });
document.getElementById("run-all").addEventListener("click", () => { document.getElementById("monitor-status").textContent = Object.keys(checks).length + " checks. " + Object.values(checks).join(" "); });
document.getElementById("run-monitor").addEventListener("click", refresh);
const sources = [["GitHub commits","https://github.com/DreamCo-Technologies/Dreamcobots/commits/main"],["Actions runs","https://github.com/DreamCo-Technologies/Dreamcobots/actions"],["FRED","https://fred.stlouisfed.org/"],["BLS","https://www.bls.gov/"],["SEC EDGAR","https://www.sec.gov/edgar"],["Census","https://data.census.gov/"],["Hugging Face","https://huggingface.co/models"],["arXiv","https://arxiv.org/"],["NIST","https://www.nist.gov/itl/ai-risk-management-framework"],["OWASP","https://genai.owasp.org/"]];
const sourcesBox = document.getElementById("source-buttons");
sources.forEach(([name, href]) => { const link = document.createElement("a"); link.className = "btn btn-outline"; link.href = href; link.textContent = name; sourcesBox.appendChild(link); });
refresh();
  fetch("https://api.frankfurter.app/latest?from=USD&to=EUR").then((response) => response.json()).then((data) => {
    document.getElementById("monitor-status").textContent = "ECB reference " + data.date + " USD to EUR " + data.rates.EUR + ". Not a trading price.";
  }).catch(() => { document.getElementById("monitor-status").textContent = "FX reference is not loaded."; });
});
refresh();
setInterval(refresh, 60000);
</script>
</body></html>
