<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Live monitor | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Monitor</p><h1>Live repository check</h1><p id="monitor-status">Waiting for the latest commit.</p></div>
<p><button class="btn btn-primary" id="refresh-monitor" type="button">Refresh now</button> <button class="btn btn-primary" id="run-all" type="button">Check all snapshots</button> <button class="btn btn-outline" id="run-monitor" type="button">Run live monitor</button> <a class="btn btn-outline" href="market-data.html">Market data</a> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/actions">Actions runs</a> <button class="btn btn-outline" id="run-market" type="button">Open FX reference</button> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/actions">Actions runs</a> <a class="btn btn-outline" href="secret-options.html">Secret options</a></p><p id="run-buttons"></p>
<p id="source-buttons"></p></header>
</main>
<script>
function refresh() {
  const status = document.getElementById("monitor-status");
  status.textContent = "Loading the public feeds…";
  Promise.all([
    fetch("https://api.github.com/repos/DreamCo-Technologies/Dreamcobots/commits/main").then((response) => response.json()),
    fetch("https://api.github.com/repos/DreamCo-Technologies/Dreamcobots/actions/runs?per_page=1").then((response) => response.json())
  ]).then(([commit, runs]) => {
    const run = (runs.workflow_runs || [])[0] || {};
    status.textContent = "Commit " + (commit.sha || "").slice(0, 7) + " " + ((commit.commit || {}).message || "").split("\n")[0] + " Latest run " + (run.name || "none") + " " + (run.conclusion || run.status || "unknown");
  }).catch(() => { status.textContent = "Public feeds are not loaded."; });
}
document.getElementById("refresh-monitor").addEventListener("click", refresh);
const checks = {"Pages wiring audit":"data/pages-feature-audit.json", "Repository connection index":"data/pages-connection-index.json", "Fleet runtime evidence":"data/fleet-runtime-status.json"};
async function checkSnapshot(name, url) {
  const response = await fetch(url, {cache: "no-cache"});
  if (!response.ok) throw new Error(name + " HTTP " + response.status);
  const data = await response.json();
  return name + ": loaded " + (data.schema || "snapshot") + ". This is stored evidence; no new runtime test was executed.";
}
const box = document.getElementById("run-buttons");
Object.entries(checks).forEach(([name, url]) => { const button = document.createElement("button"); button.className = "btn btn-outline"; button.type = "button"; button.textContent = "Check " + name; button.addEventListener("click", async () => { try { document.getElementById("monitor-status").textContent = await checkSnapshot(name, url); } catch(error) { document.getElementById("monitor-status").textContent = error.message; } }); box.appendChild(button); });
document.getElementById("run-all").addEventListener("click", async () => { const results = await Promise.allSettled(Object.entries(checks).map(([name,url]) => checkSnapshot(name,url))); document.getElementById("monitor-status").textContent = results.map(r => r.status === "fulfilled" ? r.value : String(r.reason)).join(" "); });
document.getElementById("run-monitor").addEventListener("click", refresh);
document.getElementById("run-market").addEventListener("click", () => { window.location.href = "market-data.html"; });
const sources = [["GitHub commits","https://github.com/DreamCo-Technologies/Dreamcobots/commits/main"],["Actions runs","https://github.com/DreamCo-Technologies/Dreamcobots/actions"],["FRED","https://fred.stlouisfed.org/"],["BLS","https://www.bls.gov/"],["SEC EDGAR","https://www.sec.gov/edgar"],["Census","https://data.census.gov/"],["Hugging Face","https://huggingface.co/models"],["arXiv","https://arxiv.org/"],["NIST","https://www.nist.gov/itl/ai-risk-management-framework"],["OWASP","https://genai.owasp.org/"]];
const sourcesBox = document.getElementById("source-buttons");
sources.forEach(([name, href]) => { const link = document.createElement("a"); link.className = "btn btn-outline"; link.href = href; link.textContent = name; sourcesBox.appendChild(link); });
refresh();
setInterval(refresh, 60000);
</script>
</body></html>
