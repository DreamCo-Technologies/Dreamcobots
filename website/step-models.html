<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Model for each step</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="nav-placeholder"></div>
  <script src="nav.js"></script>
  <main class="container">
    <h1>A model for every step</h1>
    <p id="lead">Loading approved models, connections, plugins, APIs, and workflows.</p>
    <form id="task-form" class="card">
      <p><label>Task <input id="task" required placeholder="write a lesson"></label></p>
      <button class="btn btn-primary" id="all" type="button">Choose all approved models</button>
    </form>
    <div id="steps"></div>
    <p id="status">Nothing has been called.</p>
    <h2>Connections</h2>
    <div id="connections"></div>
    <h2>APIs</h2>
    <div id="apis"></div>
    <h2>Workflows</h2>
    <div id="workflows"></div>
    <p><a href="plugins.html">Search the plugin catalog</a></p>
  </main>
  <script src="step-models.js"></script>
</body>
</html>
