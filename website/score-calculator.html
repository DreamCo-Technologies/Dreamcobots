<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Score calculator | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">Calculator</p><h1>Score calculator</h1><p>Enter a 0 to 100 result. Empty stays not measured. Benchmark files are not scored here.</p></div>
<p><a class="btn btn-outline" href="scoring-criteria.html">Criteria</a> <a class="btn btn-outline" href="https://github.com/DreamCo-Technologies/Dreamcobots/blob/main/scoring-criteria.md">scoring-criteria.md</a></p></header>
<section class="actions-review"><label>Saved result <input id="saved" type="number" min="0" max="100"></label> <label>Second run <input id="second" type="number" min="0" max="100"></label> <button class="btn btn-primary" id="calc" type="button">Calculate</button><p id="calc-status">Not measured.</p></section>
</main>
<script>
document.getElementById("calc").addEventListener("click", () => {
  const saved = document.getElementById("saved").value;
  const second = document.getElementById("second").value;
  if (saved === "" || second === "") { document.getElementById("calc-status").textContent = "Not measured. Both runs are required."; return; }
  document.getElementById("calc-status").textContent = "Weighted score " + ((Number(saved) * 3 + Number(second) * 3) / 6).toFixed(1) + ". This is your entry, not a benchmark result.";
});
</script>
</body></html>
