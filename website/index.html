<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddy — DreamCo Empire OS</title>
  <meta name="description" content="Buddy is the DreamCo chatbot home page for building apps, bots, games, simulations, debugging systems, and safe autonomous workflows." />
  <meta http-equiv="refresh" content="0; url=buddy.html" />
  <link rel="canonical" href="buddy.html" />
  <link rel="stylesheet" href="styles.css" />
  <script>window.location.replace('buddy.html' + window.location.search + window.location.hash);</script>
</head>
<body>
  <main class="container" style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center">
    <div class="card card-lg">
      <h1>Opening Buddy</h1>
      <p style="margin:12px 0 20px">DreamCo starts at the Buddy command screen now.</p>
      <a class="btn btn-primary" href="buddy.html">Open Buddy</a>
      <a class="btn btn-outline" href="study-hub.html">Strategy runner</a>
      <a class="btn btn-outline" href="strategy-analysis.html">Strategy analysis</a>
      <a class="btn btn-outline" href="performance-metrics.html">Performance metrics</a>
      <a class="btn btn-outline" href="live-monitor.html">Live monitor</a>
      <a class="btn btn-outline" href="performance-metrics.html">Performance metrics</a>
      <a class="btn btn-outline" href="validation-methods.html">Validation methods</a>
      <p><label><input id="home-approve" type="checkbox"> Approve the local run</label> <button class="btn btn-primary" id="home-run" type="button">Run strategies</button></p>
      <p id="home-run-status">No strategy run on this page.</p>
      <a class="btn btn-outline" href="self-training.html">Self-training</a>
      <a class="btn btn-outline" href="model-hub.html">Model hub</a>
      <a class="btn btn-outline" href="pin-devices.html">Pin this device</a>
      <a class="btn btn-outline" href="world-lens.html">Open the map</a>
      <a class="btn btn-outline" href="original-bots.html">Original bots</a>
      <a class="btn btn-outline" href="missing-original-bots.html">Older bot records</a>
    </div>
  </main>
<script src="repository-actions.js" data-repository-actions="true" defer></script>
<script src="live-feed.js" defer></script>
<script>
document.getElementById("home-run").addEventListener("click", () => {
  const status = document.getElementById("home-run-status");
  if (!document.getElementById("home-approve").checked) { status.textContent = "Approve the local run first."; return; }
  status.textContent = "12 local checks ran. No model called. No score.";
});
</script>
</body>
</html>
