<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buddy Command Center</title>
  <style>
    :root { --bg:#0a0c10; --fg:#e8ece8; --muted:#8b948c; --line:#1c2320; --mint:#65d3a3; --card:#12151a; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 ui-sans-serif,system-ui; background:var(--bg); color:var(--fg); }
    a { color:var(--mint); text-decoration:none; }
    header, main { max-width: 960px; margin: 0 auto; padding: 16px; }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; border-bottom:1px solid var(--line); }
    nav { display:flex; flex-wrap:wrap; gap:10px; }
    h1 { font-size: 2rem; margin: 8px 0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
    textarea, button, input { font: inherit; }
    textarea { width:100%; min-height:90px; background:#0a0c10; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px; }
    button { min-height:44px; padding:0 16px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
    button.primary { background:var(--mint); color:#062016; border:0; }
    .muted { color:var(--muted); font-size:14px; }
    label { display:flex; align-items:center; gap:8px; min-height:44px; }
  </style>
</head>
<body>
  <header>
    <strong>Buddy</strong>
    <nav>
      <a href="buddy.html">Buddy home</a>
      <a href="command.html">Command</a>
      <a href="https://github.com/DreamCo-Technologies/Dreamcobots">Repo</a>
    </nav>
  </header>
  <main>
    <p class="muted">Website mirror of the hosted Command desk. Local planner. No secret keys.</p>
    <h1>How can I help?</h1>
    <div class="card">
      <p class="muted">Paid families stay off unless you connect them. Free students take every step first.</p>
      <div id="paid"></div>
    </div>
    <div class="card">
      <textarea id="job" placeholder="Build an inventory app with search, CSV export, tests, and debug."></textarea>
      <p><button class="primary" id="go" type="button">Decompose</button></p>
      <div id="steps"></div>
    </div>
    <div class="card">
      <h2>Operator jobs Buddy can run itself</h2>
      <div id="ops"></div>
    </div>
  </main>
  <script>
    const FAMILIES = [["dream-student","chat"],["phi","local"],["olmo","plan"],["deepseek","code"],["embed","eval"],["safety","gate"],["qwen","learn"]];
    ["grok","claude-wrap","gpt-wrap","gemini-wrap"].forEach(function (f) {
      const l = document.createElement("label");
      l.innerHTML = "<input type=checkbox /> " + f;
      document.getElementById("paid").appendChild(l);
    });
    document.getElementById("go").onclick = function () {
      const job = document.getElementById("job").value.trim() || "Untitled";
      const titles = ["Clarify","Route","Plan","Hard","Eval","Gate","Learn"];
      document.getElementById("steps").innerHTML = titles.map(function (title, i) {
        const fam = FAMILIES[i];
        return "<article class=card><strong>"+title+"</strong><p class=muted>"+fam[0]+" / "+fam[1]+" / free</p><p>"+job+"</p></article>";
      }).join("") + "<p class=muted>Unique models: 7 of 7</p>";
    };
    document.getElementById("ops").innerHTML = [
      ["Compile MD bots","plan_only"],["Place original bots","200 placed"],["Prove learning","fail-learn-pass"],
      ["Grok twins","1101 caretakers"],["HF packs","license first"],["Weight balancer","no fake weights"],
      ["500 waves","native/assisted/blocked"],["Money map","stripe test-mode"],["Fleet growth","10 divisions"],["Playbook","learn+earn"]
    ].map(function (row) {
      return "<article class=card><strong>"+row[0]+"</strong><p class=muted>Buddy local evidence: "+row[1]+"</p></article>";
    }).join("");
  </script>
</body>
</html>
