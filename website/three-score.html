<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>three.js scores | Buddy</title><link rel="stylesheet" href="styles.css?v=41" /><link rel="stylesheet" href="actions.css?v=4" /></head>
<body><div id="nav-placeholder"></div><script src="nav.js"></script><main class="actions-shell">
<header class="actions-header"><div><p class="actions-kicker">three.js</p><h1>three.js score list</h1><p>Each item links to the official docs. The score is not measured. The library is not copied into this repo.</p></div>
<p><a class="btn btn-primary" href="https://threejs.org/docs/">three.js docs</a> <a class="btn btn-outline" href="https://threejs.org/examples/">examples</a> <a class="btn btn-outline" href="https://github.com/mrdoob/three.js">source</a></p></header>
<p><button class="btn btn-primary" id="test-three" type="button">Test three.js objects</button></p>
<p id="three-status">No test yet.</p>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js";
document.getElementById("test-three").addEventListener("click", () => {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 10);
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshNormalMaterial();
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);
  scene.add(new THREE.AmbientLight(0xffffff));
  document.getElementById("three-status").textContent = "Created scene, camera, geometry, material, mesh, and light. Score not measured.";
});
</script>
<script>
["scene","camera","renderer","mesh","material","light","geometry","animation","audio","controls"].forEach((name) => { const link = document.createElement("a"); link.className = "btn btn-outline"; link.href = "https://threejs.org/docs/"; link.textContent = name + " score: not measured"; document.getElementById("three-items").appendChild(link); });
</script>
</body></html>
