<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your idea</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="nav-placeholder"></div>
  <script src="nav.js"></script>
  <main class="container">
    <h1>Your idea</h1>
    <p>Paste an idea and two notes you wrote, from a school course or from <a href="https://www.codecademy.com/">Codecademy</a>. Buddy keeps a plan. It does not copy the course, store other people's data, or build the game, song, video, or device on this page.</p>
    <form id="idea-form" class="card">
      <p><label>Idea <textarea id="idea" rows="3" required placeholder="A small game that teaches sorting"></textarea></label></p>
      <p><label>Your notes, one per line <textarea id="notes" rows="4" placeholder="What you learned, in your own words"></textarea></label></p>
      <button class="btn btn-primary" type="submit">Make the plan</button>
      <p id="idea-status">Nothing planned yet.</p>
      <p id="idea-link"></p>
    </form>
  </main>
  <script src="idea.js"></script>
</body>
</html>
