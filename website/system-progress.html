<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamCo System Progress</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#090e1a;color:#eef2ff;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(2rem,5vw,4rem)}.hero,.card{background:#121a2c;border:1px solid #273553;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.bar{height:16px;background:#26324e;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7dd3fc,#a78bfa);min-width:2px}.big{font-size:2rem;font-weight:800}.muted{color:#9fb0cf}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#273553}.gap{margin:12px 0;padding:14px;background:#0d1425;border-radius:14px}</style></head><body><main><div class="badge">DreamCo Build Control</div><h1>System Progress</h1><div class="hero"><div class="muted">Current build status</div><div id="build" class="big">Loading…</div><div class="grid"><div><div class="muted">Open engineering gaps</div><div id="gapCount" class="big">—</div></div><div><div class="muted">Average evidence progress</div><div id="avg" class="big">—</div></div></div></div><div class="card"><h2>Gap gauges</h2><p class="muted">A gap reaches 100% only when runtime evidence passes. Planning alone cannot turn a gauge green.</p><div id="gaps"></div></div></main><script>(async()=>{const build=document.getElementById('build'),gapsEl=document.getElementById('gaps');try{const d=await fetch('./data/system-progress-status.json').then(r=>{if(!r.ok)throw new Error('status file missing');return r.json()});build.textContent=d.system_build_status.toUpperCase();document.getElementById('gapCount').textContent=d.gap_count;document.getElementById('avg').textContent=`${d.average_gap_percent}%`;gapsEl.innerHTML=(d.gauges||[]).map(g=>`<div class="gap"><strong>${g.gap_id}</strong><div class="muted">${g.owner||'unassigned'} · ${g.stage} · ${g.priority}</div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,g.percent_complete))}%"></div></div><div>${g.percent_complete}% · runtime: ${g.runtime_evidence_status}</div><div class="muted">${(g.blockers||[]).join(' · ')}</div></div>`).join('')||'<div class="muted">No open gaps in the generated report.</div>'}catch(e){build.textContent='STATUS NOT GENERATED';gapsEl.textContent='Run DreamCo Platform Evolution / Engineering Gap Closure to generate the current status.'}})();</script></body></html>
