<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DreamCo Connections</title>
<style>
:root{color-scheme:dark;--bg:#07080c;--panel:#12141c;--line:#232736;--text:#f4f6fb;--muted:#9aa3b8;--ok:#69e8bf;--bad:#ff8b8b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:16px}
a{color:#9cc9ff}.ok{color:var(--ok)}.bad{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button{background:#7c5cff;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
</style>
</head>
<body>
<h1>Connections</h1>
<p>Live check of pages, bots, and resources. A 200 means the file is reachable. It does not mean every bot runs.</p>
<button onclick="scan()">Scan now</button>
<div id="out" class="card">Not scanned.</div>
<h2>Open</h2>
<p><a href="buddy.html">Buddy</a> · <a href="train.html">Train</a> · <a href="finish.html">Finish</a> · <a href="command-center.html">Command Center</a> · <a href="actions.html">Actions</a> · <a href="bots.html">Fleet</a> · <a href="gaps.json">Gaps</a></p>
<script>
const targets = [
  "buddy.html","train.html","finish.html","command-center.html","actions.html","bots.html",
  "backend-status.json","gaps.json","command-center/bots.json",
  "data/buddy-control-status.json","data/buddy-connection-catalog.json","data/bot-fleet-catalog.json"
];
async function scan(){
  const out = document.getElementById("out");
  out.textContent = "Scanning...";
  const rows = [];
  for (const t of targets){
    try {
      const r = await fetch(t, {cache:"no-store"});
      rows.push(`<p class="${r.ok?"ok":"bad"}">${r.status} ${t}</p>`);
    } catch (e) {
      rows.push(`<p class="bad">fail ${t}</p>`);
    }
  }
  let bots = "unknown";
  try {
    const b = await fetch("command-center/bots.json").then(r=>r.json());
    bots = Array.isArray(b) ? b.length : (b.bots||[]).length;
  } catch {}
  out.innerHTML = `<p>Catalog bots on Pages: ${bots}</p>` + rows.join("");
}
scan();
</script>
</body>
</html>
