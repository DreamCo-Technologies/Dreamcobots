<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Divisions</title><link rel="stylesheet" href="styles.css"/>
<style>body{padding:16px}.card{background:#15191f;border:1px solid #303741;border-radius:12px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.ok{color:#69e8bf}</style></head><body>
<div id="nav-placeholder"></div><script src="nav.js"></script>
<main>
<h1>Divisions</h1>
<p class="ok">GitHub Pages serves this. Your device stores local state.</p>
<p id="sum">Loading.</p>
<div id="list" class="grid"></div>
</main>
<script>
fetch("data/divisions-live.json").then(r=>r.json()).then(d=>{
  document.getElementById("sum").textContent = d.count+" divisions. Host: "+d.host+". Outside builder: "+d.outside_builder+".";
  document.getElementById("list").innerHTML = d.items.map(i=>`<div class="card"><strong>${i.name}</strong><p>${i.bots} bots</p><p><a href="${i.fleet}">Fleet file</a></p></div>`).join("");
});
</script></body></html>
