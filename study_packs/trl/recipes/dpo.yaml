pack_id: TRL-DPO-001
method: dpo
status: plan_only
trained_weights_exist: false
trl_version_target: "1.14.0"
base_model: outputs/sft                 # start from approved SFT adapter/checkpoint only
dataset:
  id: PLACEHOLDER/preference-dataset
  split: train
  schema: 'preference: "prompt", "chosen", "rejected"'
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  task_type: CAUSAL_LM
trainer_args:                           # DPOConfig fields
  output_dir: outputs/dpo
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  beta: 0.1
  max_length: 1024
  logging_steps: 10
  bf16: true
