version: 1
name: buddy-hustle-catalog
principles:
  - no_guaranteed_income
  - evidence_before_claims
  - free_first
  - user_controls_actions
  - explicit_approval_for_material_actions
  - transparent_costs
  - transparent_activity_logs
  - legal_and_terms_compliance
opportunities:
  - id: H001
    name: AI-assisted freelance service
    autonomy: 2
    proof_required: portfolio_or_sample
  - id: H002
    name: Productized automation service
    autonomy: 3
    proof_required: working_demo
  - id: H003
    name: Local-business lead research
    autonomy: 3
    proof_required: compliant workflow
  - id: H004
    name: Website/app building service
    autonomy: 3
    proof_required: deployed_or_sandboxed_demo
  - id: H005
    name: Digital template/workflow packs
    autonomy: 3
    proof_required: usable_package
  - id: H006
    name: Educational content/product
    autonomy: 2
    proof_required: curriculum_and_quality_review
  - id: H007
    name: Lawful public-data research product
    autonomy: 2
    proof_required: provenance_and_terms_review
  - id: H008
    name: Micro-SaaS opportunity
    autonomy: 2
    proof_required: market_evidence_and_prototype
  - id: H009
    name: Automation consulting
    autonomy: 2
    proof_required: workflow_audit_and_demo
  - id: H010
    name: User-specific opportunity discovery
    autonomy: 1
    proof_required: personalized evidence report
personalization:
  required_inputs: [skills, time, budget, goals]
  optional_inputs: [interests, equipment, business, industry, location, audience, assets]
  avoid_unnecessary_sensitive_data: true
execution:
  default_autonomy: 1
  approval_required_for: [spending_money, publishing, sending_external_messages, changing_accounts, contracts, consequential_decisions]
  bounded_automation_requires: [scope, budget, rate_limit, allowed_tools, stop_conditions, audit_log]
