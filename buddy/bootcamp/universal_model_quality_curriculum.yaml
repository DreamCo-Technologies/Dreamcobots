version: 1
name: Universal Model Quality and Efficiency Bootcamp
audience: Buddy and external student models
objective: Improve transferable task quality with measured efficiency, safety, and reproducibility.
stages:
  - compute_and_model_readiness
  - model_fundamentals
  - dataset_engineering_and_rights
  - untouched_baseline
  - prompt_retrieval_and_tool_baselines
  - supervised_finetuning
  - lora_qlora_adaptation
  - preference_optimization_when_justified
  - reinforcement_learning_when_justified
  - independent_evaluation
  - unseen_holdout
  - cross_domain_transfer
  - regression_and_safety
  - packaging_and_deployment
  - evidence_based_graduation
learning_policy:
  select_resource: expected_quality_gain_per_minute_subject_to_cost_and_safety
  default_training_data_consent: false
  require_model_and_dataset_license_review: true
  require_three_repeated_runs_for_stochastic_promotion: true
  require_unseen_holdout: true
  require_cross_domain_transfer: true
  require_regression_suite: true
  require_artifact_for_trained_status: true
  never_train_on_holdout: true
  never_promote_on_training_loss_alone: true
  require_owner_approval_for_paid_compute: true
efficiency_metrics:
  - task_success
  - answer_quality
  - factuality
  - tool_correctness
  - safety
  - transfer_score
  - recovery_rate
  - latency_ms
  - tokens_per_second
  - peak_vram_bytes
  - peak_ram_bytes
  - training_seconds
  - inference_cost_usd
  - energy_wh_when_available
  - human_interventions
  - retries
graduation:
  min_repeated_runs: 3
  require_baseline_comparison: true
  require_holdout_pass: true
  require_transfer_pass: true
  require_no_critical_safety_regression: true
  require_reproducible_artifact: true
