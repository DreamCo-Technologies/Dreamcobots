version: 1
name: buddy-division-efficiency-contract
purpose: continuously improve all 45 divisions while reducing duplicated bots and unnecessary execution cost

scope:
  divisions: all_registered
  shared_platform_services: true

metrics:
  - goal_completion_rate
  - benchmark_pass_rate
  - user_success_rate
  - duplicate_capability_rate
  - tool_failure_rate
  - recovery_rate
  - latency
  - compute_cost
  - memory_cost
  - model_cost
  - incident_rate
  - automation_coverage
  - human_escalation_rate
  - evidence_completeness

optimization_loop:
  - inventory
  - benchmark
  - identify_duplicates
  - identify_bottlenecks
  - identify_unused_components
  - consolidate
  - route_to_best_shared_service
  - benchmark_again
  - canary
  - monitor
  - promote_or_rollback

rules:
  every_division_has_owner_map: true
  every_division_has_capability_map: true
  every_division_has_benchmark_map: true
  every_division_has_dependency_map: true
  duplicate_bots_are_candidates_for_superbot_merge: true
  shared_infrastructure_is_preferred: true
  optimization_cannot_reduce_required_capability: true
  production_changes_require_evidence: true
