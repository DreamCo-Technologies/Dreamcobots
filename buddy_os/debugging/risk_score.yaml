version: 1
name: buddy-predictive-risk-score

risk_factors:
  change_size: 0.10
  dependency_change: 0.15
  security_surface: 0.20
  production_surface: 0.20
  historical_failure_rate: 0.15
  test_coverage_gap: 0.10
  integration_count: 0.05
  architecture_coupling: 0.05

bands:
  low:
    max: 0.24
  guarded:
    min: 0.25
    max: 0.49
  high:
    min: 0.50
    max: 0.74
  critical:
    min: 0.75

behavior:
  low: automatic_preflight
  guarded: expanded_tests
  high: debate_and_expanded_verification
  critical: approval_required_and_canary

rules:
  never_reduce_risk_score_without_new_evidence: true
  historical_failures_raise_future_risk: true
  successful_recovery_can_reduce_risk_only_after_repeated_verification: true
  critical_security_findings_override_score: true
