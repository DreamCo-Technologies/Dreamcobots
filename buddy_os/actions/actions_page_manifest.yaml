version: 3
name: buddy-actions-page-manifest
purpose: single manifest describing every capability family the Actions page should expose

sections:
  command:
    - goal_input
    - natural_language_task
    - role_definition
    - formal_requirements
  context:
    - context_fabric
    - project_state
    - document_library
    - markdown_notes
    - memory
    - instructions
    - preferences
    - evidence
  intelligence:
    - 45_divisions
    - 65_masterbots
    - bot_registry
    - superbot_registry
    - capability_registry
    - skills_registry
    - benchmark_registry
    - mastery_registry
  reasoning:
    - model_router
    - model_weight_registry
    - debate_team
    - planning
    - next_best_action
    - uncertainty
  execution:
    - action_lifecycle
    - agent_modes
    - tool_registry
    - mcp_registry
    - code_runner
    - command_runner
    - sandbox
    - workflows
    - generators
    - libraries
  engineering:
    - repository_map
    - branches
    - pull_requests
    - issues
    - ci_cd
    - observability
    - debugging
    - dependency_health
    - regression_detection
    - preventive_repair
  learning:
    - benchmark_center
    - sandbox_test_catalog
    - real_user_test_queue
    - live_provider_test_queue
    - production_readiness
    - mastery_gaps
    - training_recommendations
    - buddy_bootcamp
    - masterbot_training_lanes
    - masterbot_prospectus
    - 24x7_gap_closure_scheduler
    - github_capacity_dashboard
  governance:
    - permissions
    - approvals
    - risk
    - security
    - provenance
    - audit_log
    - rollback
  system:
    - ontology_browser
    - ontology_quality_gates
    - ontology_evolution
    - memory_controls
    - connector_health
    - dashboard_registry
    - next_best_action

masterbot_ui:
  domain_masterbots: 45
  platform_masterbots: 20
  total_masterbots: 65
  each_masterbot_has:
    - dashboard
    - command_center
    - prospectus
    - training_queue
    - sandbox_controls
    - benchmark_controls
    - mastery_history
    - gap_queue
    - sub_bot_roster
    - resource_registry
    - runtime_telemetry
  training_buttons:
    - train_now
    - close_gaps
    - run_sandbox
    - run_benchmarks
    - study_resources
    - test_sub_bots
    - compare_strategies
    - retest_failures
    - promote_best_strategy
    - view_mastery

ui_behavior:
  every_section_links_to_underlying_registry: true
  show_state_and_evidence: true
  show_owner_and_permissions: true
  show_last_verified: true
  show_next_best_action: true
  allow_goal_scoped_views: true
  allow_division_scoped_views: true
  allow_masterbot_scoped_views: true
  allow_capability_scoped_views: true
  allow_bot_scoped_views: true
  allow_benchmark_scoped_views: true
  allow_repository_scoped_views: true
  show_verified_counts_separately_from_estimates: true

truth_states:
  - discovered
  - configured
  - connected
  - authorized
  - healthy
  - sandbox_verified
  - user_verified
  - live_verified
  - production_verified
  - blocked
  - degraded
  - unknown

masterbot_fleet_contract:
  canonical_registry: config/masterbot-65-registry.json
  canonical_count: 65
  domain_masterbots: 45
  platform_masterbots: 20
  dedicated_logical_training_lane_per_masterbot: true
  matrix:
    logical_lanes: 65
    lanes_per_tick: 5
    max_parallel: 5
    full_fleet_cycle_minutes: 65
    schedule: "*/5 * * * *"
    bounded_runner_minutes_per_lane: 4
    no_quota_bypass: true
    no_manufactured_work: true
  checkpoint:
    runner: tools/run_masterbot_lane.py
    persist_per_masterbot: true
    mastery_requires_repeatable_benchmark_evidence: true
  traceability:
    source_inventory: all_tracked_markdown_and_mdx
    auditor: tools/audit_markdown_requirement_traceability.py
    mapping_registry: config/requirement-evidence-map.json
    dimensions:
      - source_specification_and_heading
      - implementation_paths
      - test_paths
      - runtime_route_paths
      - benchmark_evidence_paths
    path_presence_is_not_verification: true
  bootcamp:
    config: config/buddy-bootcamp-65.json
    levels: 8
    sandbox_modes:
      - training
      - practice
      - coach
      - challenge
      - repair_lab
      - exam_prep
      - benchmark_simulation
      - adversarial
      - time_trial
      - resource_limited
      - tool_limited
      - multi_agent
      - human_vs_buddy
      - buddy_vs_buddy
      - masterbot_vs_masterbot
  actions_page:
    expose_all_65_masterbots: true
    per_masterbot_views:
      - dashboard
      - command_center
      - prospectus
      - training_queue
      - sandbox_controls
      - benchmark_controls
      - mastery_history
      - gap_queue
      - sub_bot_roster
      - resource_registry
      - runtime_telemetry
    expose:
      - 45_domain_masterbots
      - 20_platform_masterbots
      - training_controls
      - bootcamp
      - sandbox
      - gap_closure
      - capacity_telemetry
