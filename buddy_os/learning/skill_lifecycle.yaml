version: 1
name: buddy-skill-lifecycle

lifecycle:
  discover:
    source: repository_and_registered_tools
  define:
    required: [name, purpose, prerequisites, inputs, outputs, tests]
  practice:
    methods: [guided_task, simulation, sandbox, real_task_read_only]
  evaluate:
    metrics: [correctness, reliability, latency, cost, safety]
  benchmark:
    compare_to: previous_verified_score
  improve:
    methods: [prompt_revision, tool_strategy, workflow_revision, retraining_request]
  promote:
    requirement: verified_improvement
  monitor:
    continuous: true

skill_record:
  score: 0
  confidence: 0
  attempts: 0
  successes: 0
  failures: 0
  last_verified: null
  evidence_refs: []
