version: 1
# Dashboard registry. Each dashboard can be backed by an existing frontend/service.
dashboards:
  empire:
    title: DreamCo Empire
    purpose: master overview of Buddy, bots, projects, revenue, health, and deployments
  bots:
    title: Bot Fleet
    purpose: inspect and control repository-backed bots
  revenue:
    title: Revenue Engine
    purpose: revenue streams, leads, conversions, targets, and automation health
  marketplace:
    title: Marketplace
    purpose: products, services, listings, and fulfillment systems
  learning:
    title: Learning Engine
    purpose: training, benchmarks, experiments, evaluations, and improvement loops
  models:
    title: AI Models
    purpose: model availability, routing, cost, latency, and task fit
  government:
    title: Government Hub
    purpose: government resources, forms, programs, and workflows
  infrastructure:
    title: Infrastructure
    purpose: services, runners, queues, deployments, and system health
  security:
    title: Security Center
    purpose: vulnerabilities, permissions, audit events, and policy status
  dream_brain:
    title: Dream Brain
    purpose: memory, documents, instructions, embeddings, and knowledge retrieval

navigation:
  default: empire
  allow_user_selection: true
  health_indicator: required
  backend_status: required
