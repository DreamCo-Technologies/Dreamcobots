version: 1
name: buddy-legitimate-income-opportunity-catalog
purpose: "Help users identify and safely automate legitimate ways AI can create economic value."
principles:
  - no_guaranteed_income_claims
  - transparent_risk
  - user_controls_consequential_actions
  - free_first
  - measurable_outcomes
  - no_spam_or_fraud
  - respect_platform_rules
opportunity_families:
  - service_business
  - freelancing
  - local_business_support
  - lead_generation
  - content_production
  - educational_products
  - software_products
  - templates_and_digital_products
  - ecommerce_operations
  - marketplace_services
  - data_analysis_services
  - automation_consulting
  - website_and_dashboard_building
  - app_development
  - game_and_simulation_development
  - research_services
  - grant_and_nonprofit_support
  - sales_enablement
  - marketing_operations
  - customer_support_automation
  - bookkeeping_assistance
  - property_research_and_workflow_support
  - career_and_job_search_support
  - creator_workflows
  - licensing_and_asset_creation
  - micro_saas
  - open_source_service_businesses
workflow:
  - profile_user
  - identify_assets
  - identify_constraints
  - identify_skills
  - identify_market
  - generate_opportunities
  - rank_by_fit
  - estimate_effort_cost_time_and_risk
  - identify_automation_surface
  - build_sandbox
  - create_prototype
  - user_review
  - bounded_execution
  - measure_results
  - learn_and_iterate
user_controls:
  default: observe
  allowed: [observe,draft,sandbox,approve_each,bounded_autonomy,autonomous_within_policy]
  revoke_any_time: true
