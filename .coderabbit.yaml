language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  sequence_diagrams: false
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!config/generated/**"
    - "!attached_assets/**"
    - "!**/*.lock"
    - "!package-lock.json"
    - "!**/node_modules/**"
    - "!reports/os-observability-metrics.stub.json"
  path_instructions:
    - path: "**"
      instructions: >
        Review only small, incremental PRs rebased onto current main. If a PR
        exceeds 5000 changed lines, reply "too large; isolate one proven slice"
        and stop. Honor path_filters; do not review generated catalogs or lockfiles.
        Missing, stale, skipped, cancelled, planned, or retry-only evidence is
        not green. Require evidence_complete on the current commit; never flip
        production_ready. Do not add workflows, file failure issues, approve
        Dependabot majors, or delete branches listed in reports/UNMERGED_PR_VAULT.md.
        Do not request full reviews of stale vault PRs or merge them onto each other.
        Report only: verdict (block, request-changes, or comment); P0/P1 with file
        paths and line numbers; duplicate vault PR and SHA (or unverified);
        smallest next patch (or "nothing; human must rebase"). Name any observed
        write denial and stop retrying; do not infer a missing permission.
    - path: ".github/workflows/**"
      instructions: >
        Fail closed. Do not recommend new workflows. Flag issue creation on
        failure, workflow_run fan-out, continue-on-error, empty matrices, and
        skipped-as-success. Prefer concurrency + path filters.
    - path: "website/**"
      instructions: >
        Yellow if evidence is missing. Never set production_ready true.
        No vanity green. No extra dashboards.
    - path: "reports/**"
      instructions: >
        Stubs stay non-green. Inventory files are maps, not merge licenses.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
  learnings:
    scope: auto
