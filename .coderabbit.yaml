language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  sequence_diagrams: false
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!config/generated/**"
    - "!attached_assets/**"
    - "!**/*.lock"
    - "!package-lock.json"
    - "!**/node_modules/**"
    - "!reports/os-observability-metrics.stub.json"
  path_instructions:
    - path: ".github/workflows/**"
      instructions: >
        Fail closed. Do not recommend new workflows. Flag issue creation on
        failure, workflow_run fan-out, continue-on-error, empty matrices, and
        skipped-as-success. Prefer concurrency + path filters.
    - path: "website/**"
      instructions: >
        Yellow if evidence is missing. Never set production_ready true.
        No vanity green. No extra dashboards.
    - path: "reports/**"
      instructions: >
        Stubs stay non-green. Inventory files are maps, not merge licenses.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
  learnings:
    scope: auto
