dpo: {enabled: true, epochs: 1, learning_rate: 0.000005, beta: 0.1}
evaluation: {validation_buckets: [90, 91, 92, 93, 94], holdout_buckets: [95, 96, 97, 98, 99], promotion_requires_no_regression: true}
